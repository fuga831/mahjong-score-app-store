# codemagic.yaml — mahjong-score-app (Capacitor) の iOS 自動ビルド・署名・TestFlight配信
#
# ⚠️ このサンドボックスにはCodemagicのアカウント・Apple Developer Portalへの
# アクセス・実際にビルドを走らせられる環境がなく、このファイルを実際に
# Codemagic上で実行して検証したことは一度もありません。2026年9月時点の
# Codemagic公式ドキュメント(docs.codemagic.io)・公式サンプルプロジェクト
# (codemagic-ci-cd/codemagic-sample-projects)の記法に基づいて書いていますが、
# 必ずご自身のCodemagicプロジェクトで一度ビルドを走らせて検証してください。
#
# ---- このファイルを使う前に必要な準備(すべて一度きりの手作業) ----
#
# 1. このリポジトリの `ios/` ディレクトリが既にコミットされていること。
#    Codemagicは `npx cap add ios` を代わりに実行してくれません。お手元のMacで
#    `ios-snippets/README.md` の手順どおり `npx cap add ios` を実行し、
#    `ios-snippets/` 以下の差分(Info.plist・entitlements・AppDelegate.swift)を
#    反映した上で、生成された `ios/` フォルダ一式をgitにコミットしてください。
#
# 2. Apple Developer PortalでこのアプリのApp ID(Bundle ID)を作成し、
#    Sign in with Apple・Push Notifications の2つのCapabilityを**先に**
#    有効化しておくこと(`ios-snippets/entitlements-additions.md` 参照)。
#    `app-store-connect fetch-signing-files --create` は「有効化済みの
#    Capabilityを含むプロファイル」を取得・生成するだけで、Capability自体を
#    有効化してはくれません。
#
# 3. App Store Connectで、このアプリのアプリレコードを作成しておくこと
#    (TestFlightへのアップロード先として必要)。作成後に払い出される
#    数字のApple ID(例: 1234567890)を、下の APP_STORE_APPLE_ID に設定します。
#
# 4. CodemagicのTeam settings > Integrations で、App Store Connect APIキー
#    (Issuer ID・Key ID・.p8秘密鍵)を使ってApple Developer Portal連携を作成し、
#    好きな名前を付けてください(下のyamlでは "jan score" という名前で
#    登録済みの連携を想定しています。別名にした場合は
#    integrations.app_store_connect の値を合わせて書き換えてください)。
#    この連携が、下の「Fetch signing files from App Store Connect」ステップの
#    認証情報(Issuer ID・Key ID・秘密鍵)と、TestFlightへの自動アップロードの
#    両方の認証基盤になります。
#
# 5. capacitor.config.json の appId・project.pbxproj の
#    PRODUCT_BUNDLE_IDENTIFIER・下記 vars.BUNDLE_ID は
#    いずれも "io.github.fuga831.mahjongscore" に統一済みです。
#    Apple Developer Portal側のApp ID(Bundle ID)もこの値で登録してください。
#
# 6. (推奨・任意) FirebaseコンソールからダウンロードしたiOS用の
#    GoogleService-Info.plist を、リポジトリに直接コミットする代わりに
#    Codemagicの暗号化環境変数として渡したい場合は、下記の変数を設定してください:
#      GOOGLE_SERVICE_INFO_PLIST_BASE64 = $(base64 -i GoogleService-Info.plist)
#    の出力を、Codemagicの環境変数設定画面で「Secure」にチェックを入れて
#    登録してください。リポジトリに直接コミットする場合はこの変数は不要です
#    (下のスクリプトは未設定なら自動的にスキップされます)。
#
# 7. TestFlightの「テスターグループ」に自動配信したい場合は、
#    App Store Connect側で作成済みのグループ名を beta_groups に列挙してください
#    (未設定でもアップロード自体は行われ、Codemagicの連携アカウントに
#    内部テスターとして自動的に見えるようになります)。
#
# 8. 「Fetch signing files from App Store Connect」ステップで証明書を
#    新規作成(--create)するために必要な、証明書用のRSA秘密鍵を
#    お手元のマシンで生成し、Codemagicの暗号化環境変数として登録して
#    ください(準備4のApp Store Connect API認証情報とは別物です)。
#      ssh-keygen -t rsa -b 2048 -m PEM -f ./ios_distribution_private_key -q -N ""
#    で生成される ios_distribution_private_key(-----BEGIN RSA PRIVATE KEY-----
#    〜 -----END RSA PRIVATE KEY----- を含む全文)を、Codemagicの環境変数設定画面で
#    変数名 CERTIFICATE_PRIVATE_KEY・「Secure」にチェックを入れて登録してください。
#    これが無いと「Cannot save Signing Certificates without certificate private key」
#    で失敗します(Apple Developer Portal側に既に有効な配布用証明書がある場合は、
#    その証明書を作成した際に使った秘密鍵を代わりに登録してください。
#    新しい秘密鍵を登録すると、Portal上の既存証明書とはペアが合わなくなり
#    別の新しい証明書が作られます)。
#    登録時は「グループ」の指定が必須です。実際にこのアプリをビルドしている
#    チーム・アプリの環境変数設定画面で、グループ名 "ios_signing" を作成/選択して
#    その中にこの変数を登録してください(下の environment.groups の値と
#    一致していれば、グループ名自体はどんな名前でも構いません)。

workflows:
  ios-testflight-workflow:
    name: iOS - Build, Sign & Upload to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Apple Developer Portal連携(準備4)。この名前は、CodemagicのTeam
    # integrations で実際に付けた連携名に合わせて変更してください。
    integrations:
      app_store_connect: jan score

    environment:
      # 準備8で作成した環境変数グループ(CERTIFICATE_PRIVATE_KEYを含む)を
      # ワークフローにインポートする。グループ名は実際にCodemagicで
      # 作成した名前(現在は "ios_signing")に合わせて書き換えてください。
      groups:
        - ios_signing

      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6810488211
        BUNDLE_ID: "io.github.fuga831.mahjongscore"

      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      # git tag(例: v1.0.0)をpushした時に自動でTestFlightへ上げる想定。
      # 通常のpush毎に毎回配信したくないため、pushトリガーはコメントアウトしています。
      # 手動で「Start new build」から実行することもいつでも可能です。
      events:
        - tag
      tag_patterns:
        - pattern: "v*.*.*"
          include: true

    scripts:
      - name: Install npm dependencies
        script: |
          cd $CM_BUILD_DIR
          npm install

      - name: (任意) 暗号化環境変数からGoogleService-Info.plistを書き出す
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > "$CM_BUILD_DIR/ios/App/App/GoogleService-Info.plist"
            echo "GoogleService-Info.plist を書き出しました。"
          else
            echo "GOOGLE_SERVICE_INFO_PLIST_BASE64 は未設定です。リポジトリに直接コミット済みのファイルをそのまま使います。"
          fi

      - name: Update dependencies and copy web assets to native iOS project
        script: |
          cd $CM_BUILD_DIR
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd $CM_BUILD_DIR/ios/App
          pod install

      - name: Initialize keychain
        script: |
          # fetch-signing-files / keychain add-certificates で証明書を
          # インポート・生成する前に、公式サンプル通りビルド専用の
          # キーチェーンを初期化してデフォルトに設定しておく。
          keychain initialize

      - name: Fetch signing files from App Store Connect
        script: |
          # 宣言的な ios_signing ブロックだと「No matching profiles found」としか
          # 出ず原因が分からないため、明示的に app-store-connect CLI を呼び出して
          # 詳細なエラーメッセージ(Bundle ID・Capability不一致、証明書種別の
          # 不一致など)がビルドログに出るようにしている。
          # --issuer-id / --key-id / --private-key は integrations.app_store_connect
          # (準備4) 経由で自動的に注入される認証情報がそのまま使われる。
          #
          # --certificate-key について:
          # 「Cannot save Signing Certificates without certificate private key」は
          # 上記のApp Store Connect API認証(--issuer-id等)とは別物の、
          # 証明書自体を新規生成するためのRSA秘密鍵が無いことが原因。
          # --create で新規証明書を作る場合、Appleは発行後に秘密鍵を
          # 取得させてくれない仕様のため、CLIが事前にこの秘密鍵を
          # 持っていないと、証明書を作成できても保存できずに失敗する。
          # 公式ドキュメント(cli-tools/docs/app-store-connect/fetch-signing-files.md)
          # の記載通り、--certificate-key を渡さない場合は環境変数
          # CERTIFICATE_PRIVATE_KEY の値が自動的に使われるが、
          # 未設定だと今回のエラーになるため明示的に渡している。
          # 準備8を参照し、CERTIFICATE_PRIVATE_KEY をCodemagicの
          # 暗号化環境変数として設定しておくこと。
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Set up signing certificate in keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
          cd $CM_BUILD_DIR/ios/App
          xcode-project use-profiles

      - name: Increment build number (TestFlightの最新ビルド番号+1)
        script: |
          cd $CM_BUILD_DIR/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            # まだ一度もTestFlightにアップロードしたことがない(初回)場合のフォールバック。
            NEW_BUILD_NUMBER=$BUILD_NUMBER
          else
            NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          fi
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Build ipa for distribution
        script: |
          cd $CM_BUILD_DIR/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      # ビルド失敗時だけ通知したい場合の例。recipientsを実際のメールアドレスに
      # 置き換えて使ってください(不要ならこのブロックごと削除して構いません)。
      email:
        recipients:
          - you@example.com
        notify:
          success: false
          failure: true

      app_store_connect:
        auth: integration # 準備4のintegrationsを使って認証する
        submit_to_testflight: true # ご要望どおり、TestFlightへの自動アップロードまで
        beta_groups: [] # 準備7: 自動配信したいテスターグループ名があればここに列挙
        submit_to_app_store: false # App Store本審査への提出は行わない(TestFlightどまり)
