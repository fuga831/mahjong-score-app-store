/* ---- hanchan form handlers ---- */
// 素点入力欄は常に絶対値の数字だけを保持し、符号はformScoreSignで別管理する
// (数字専用キーボード(inputmode="numeric")にはマイナス記号が無く、
// 符号込みの値を直接入力できないため、符号だけ別のトグルボタンで
// 切り替える設計にした)。デスクトップの number input 等で "-123" のような
// 符号付きの値がそのまま渡ってきた場合は、ここで符号を抜き出して
// formScoreSign側に反映し、符号が二重にならないようにする。
function setFormScore(name, value){
  const str = String(value);
  if (str.startsWith('-')) {
    logState.ui.formScoreSign[name] = '-';
    logState.ui.formScores[name] = str.slice(1);
  } else {
    logState.ui.formScores[name] = value;
  }
  logState.ui.formScoreAuto[name] = false; // 手入力なので自動逆算の仮値ではなくなる
  autoFillLastPlayerScore();
  scheduleRenderApp();
}
function toggleFormScoreSign(name){
  const cur = logState.ui.formScoreSign[name] || '+';
  logState.ui.formScoreSign[name] = cur === '+' ? '-' : '+';
  logState.ui.formScoreAuto[name] = false; // 符号を直接触った時点で手入力扱いにする
  autoFillLastPlayerScore();
  scheduleRenderApp();
}
function setFormBuster(bustedName, busterName){ logState.ui.formBuster[bustedName] = busterName; scheduleRenderApp(); }

// N人打ちのうちN-1人分の素点が確定していれば、残り1人分を
// 合計素点(持ち点×人数)から逆算し、暫定値として自動入力する。
// 「確定」とは、空欄でなく、かつformScoreAutoがfalse(=自動逆算の仮値では
// ない)状態を指す。まだ仮値のままの欄は「未確定」として扱われるため、
// 他の欄を編集するたびに再計算され続ける(ユーザーがその欄自体を手入力で
// 上書きした瞬間にformScoreAuto=falseになり、以後は再計算されなくなる)。
// 入力される順番は問わない(setFormScore/toggleFormScoreSignの両方から
// 毎回呼ばれるため、どの欄が最後に埋まってもその時点で発動する)。
function autoFillLastPlayerScore(){
  const players = activePlayers();
  const unfixed = players.filter(p => logState.ui.formScores[p] === '' || logState.ui.formScoreAuto[p]);
  if (unfixed.length !== 1) return; // ちょうど1人だけ未確定の時だけ発動
  const target = unfixed[0];
  const others = players.filter(p => p !== target);
  if (others.some(p => isNaN(formScoreActual(p)))) return; // 他の欄がまだ不正な間は逆算しない
  const expectedTotal = logState.settings.startPoints * logState.settings.playerCount;
  const filledSum = others.reduce((sum, p) => sum + formScoreActual(p), 0);
  const remainder = expectedTotal - filledSum;
  logState.ui.formScoreSign[target] = remainder < 0 ? '-' : '+';
  logState.ui.formScores[target] = String(Math.abs(remainder) / SCORE_INPUT_SCALE);
  logState.ui.formScoreAuto[target] = true;
}

// 素点は必ず100点単位（下2桁は常に00）なので、入力フォームでは下2桁を省略した
// 「100点単位の値」を打ってもらい、実際の素点にする時だけ100倍する。
// 例: 入力欄に "350" → 実際の素点は 35,000。
const SCORE_INPUT_SCALE = 100;
function formScoreActual(p){
  const raw = parseFloat(logState.ui.formScores[p]);
  if (isNaN(raw)) return NaN;
  const sign = logState.ui.formScoreSign[p] === '-' ? -1 : 1;
  return Math.round(sign * raw * SCORE_INPUT_SCALE);
}
function formTotal(){
  return activePlayers().reduce((sum, p) => {
    const v = formScoreActual(p);
    return sum + (isNaN(v) ? 0 : v);
  }, 0);
}
function formIsValid(){
  const players = activePlayers();
  if (players.some(p => logState.ui.formScores[p] === '' || isNaN(formScoreActual(p)))) return false;
  if (formTotal() !== logState.settings.startPoints * logState.settings.playerCount) return false;
  if (logState.settings.tobiEnabled && logState.settings.tobiRecipient === 'buster') {
    for (const p of players) {
      if ((formScoreActual(p) || 0) < 0 && !logState.ui.formBuster[p]) return false;
    }
  }
  return true;
}
// 素点が同点のプレイヤーが2人以上いるかどうか(1人でもいれば同点順位の
// 確定に親が必要になる)。
function hasScoreTie(scores, players){
  const seen = new Set();
  for (const p of players) {
    if (seen.has(scores[p])) return true;
    seen.add(scores[p]);
  }
  return false;
}
function recordHanchan(){
  if (isRoomViewerOnly()) return; // 閲覧のみの同卓者は記録できない(代表入力者は1卓につき1人)
  if (!formIsValid()) return;
  const players = activePlayers();
  const scores = {};
  players.forEach(p => { scores[p] = formScoreActual(p); });
  const busterOf = {};
  players.forEach(p => { if (scores[p] < 0 && logState.ui.formBuster[p]) busterOf[p] = logState.ui.formBuster[p]; });

  if (hasScoreTie(scores, players)) {
    // 同点者がいる場合、自動で順位を決めず「終局時の親は誰か」を聞いてから
    // 確定する(finalizeRecordHanchanはchooseTiebreakDealer経由で呼ばれる)。
    logState.ui.tiebreakDealerOpen = true;
    logState.ui.pendingHanchanScores = scores;
    logState.ui.pendingHanchanBusterOf = busterOf;
    scheduleRenderApp();
    return;
  }
  finalizeRecordHanchan(scores, busterOf, null);
}
function closeTiebreakDealerPrompt(){
  logState.ui.tiebreakDealerOpen = false;
  logState.ui.pendingHanchanScores = null;
  logState.ui.pendingHanchanBusterOf = null;
  scheduleRenderApp();
}
// 「終局時の親は誰ですか？」で1人選んだ時。選ばれた親を起点に、時計回りの
// 座順(プレイヤー入力欄の並び順=activePlayers())での巡目距離が近い人ほど
// 同点内で上位になる(resolveTiesByDealer参照。親自身が同点者に含まれれば
// 親が自動的に最上位)。
function chooseTiebreakDealer(dealerName){
  const scores = logState.ui.pendingHanchanScores;
  const busterOf = logState.ui.pendingHanchanBusterOf;
  logState.ui.tiebreakDealerOpen = false;
  logState.ui.pendingHanchanScores = null;
  logState.ui.pendingHanchanBusterOf = null;
  finalizeRecordHanchan(scores, busterOf, dealerName);
}
function finalizeRecordHanchan(scores, busterOf, tiebreakDealer){
  if (logState.ui.editingHanchanId !== null) {
    const h = logState.hanchans.find(x => x.id === logState.ui.editingHanchanId);
    if (h) { h.scores = scores; h.busterOf = busterOf; h.tiebreakDealer = tiebreakDealer; }
    logState.ui.editingHanchanId = null;
  } else {
    // この対局で最初の半荘を記録した瞬間の時刻を、あとで履歴に保存する時の
    // startedAtとして使う（既に記録中ならそのまま）。
    if (logState.hanchans.length === 0 && !logState.currentMatchStartedAt) {
      logState.currentMatchStartedAt = new Date().toISOString();
    }
    // ①: 記録するタイミングの対局ルール設定をこの半荘専用のスナップショットとして
    // 固定する。以後ルール設定パネルの値を変えても、この半荘の計算結果は
    // 変わらない(calcHanchanResult参照)。次の半荘は、このスナップショットの
    // 元になったlogState.settingsをそのまま(何もリセットせず)引き継いで開始する。
    logState.hanchans.unshift({ id: logState.hanchanSeq++, scores, busterOf, tiebreakDealer, rulesSnapshot: captureRulesSnapshot(logState.settings) });
  }
  logState.ui.confirmEndMatch = false;
  resetFormScores();
  // 演出モード中に新しい半荘を記録したら、対局が続いている証拠なので
  // 発表済みの結果はまた隠しておく（次の「終局」まで再びネタバレしない）。
  if (logState.settings.presentationMode) {
    logState.ui.revealActive = false;
    logState.ui.revealStep = 0;
    logState.ui.revealPeek = false;
  }
  saveLogState();
  scheduleRenderApp();
  // 卓を立てた人(代表入力者)が半荘を記録するたびに、進行中の卓ドキュメントを
  // Firestore上に作成/更新する(同卓者がアプリを開いていればリアルタイムに届く)。
  ensureRoomForCurrentMatch().then(syncRoomState);
}
function editHanchan(id){
  const h = logState.hanchans.find(x => x.id === id);
  if (!h) return;
  logState.ui.editingHanchanId = id;
  logState.ui.formScores = {};
  logState.ui.formScoreSign = {};
  logState.ui.formScoreAuto = {};
  logState.ui.formBuster = {};
  activePlayers().forEach(p => {
    // 保存されている実際の素点(例:35,000 / -5,000)を、入力欄用の100点単位の
    // 絶対値表記(例:350 / 50)と符号トグル(formScoreSign)に分けて戻す。
    const actual = h.scores[p];
    if (actual === undefined) {
      logState.ui.formScores[p] = '';
      logState.ui.formScoreSign[p] = '+';
    } else {
      const scaled = actual / SCORE_INPUT_SCALE;
      logState.ui.formScoreSign[p] = scaled < 0 ? '-' : '+';
      logState.ui.formScores[p] = String(Math.abs(scaled));
    }
    logState.ui.formScoreAuto[p] = false; // 保存済みの実データなので仮値扱いにはしない
    if (h.busterOf && h.busterOf[p]) logState.ui.formBuster[p] = h.busterOf[p];
  });
  scheduleRenderApp(() => {
    const el = document.getElementById('hanchanFormAnchor');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}
function cancelEditHanchan(){
  logState.ui.editingHanchanId = null;
  resetFormScores();
  scheduleRenderApp();
}
function deleteHanchan(id){
  if (isRoomViewerOnly()) return;
  logState.hanchans = logState.hanchans.filter(x => x.id !== id);
  if (logState.ui.editingHanchanId === id) cancelEditHanchan();
  saveLogState();
  scheduleRenderApp();
  syncRoomState();
}
function chipStep(name, delta){
  if (isRoomViewerOnly()) return;
  logState.chips[name] = (logState.chips[name] || 0) + delta;
  saveLogState(); scheduleRenderApp();
  syncRoomState();
}
// 枚数が多い時に＋/−ボタンを連打しなくて済むよう、数値表示部分をタップすると
// 直接入力できるようにする(ステッパー自体は残したまま追加する導線)。
function startEditChip(name){
  logState.ui.editingChipFor = name;
  scheduleRenderApp(() => {
    const el = document.getElementById('chipEditInput');
    if (el) { el.focus(); el.select(); }
  });
}
function setChipAbsolute(name, value){
  if (isRoomViewerOnly()) return;
  if (logState.ui.editingChipFor !== name) return; // 二重発火(change+blur)による重複保存を防ぐ
  const n = parseInt(value, 10);
  logState.chips[name] = isNaN(n) ? 0 : n;
  logState.ui.editingChipFor = null;
  saveLogState(); scheduleRenderApp();
  syncRoomState();
}
function cancelEditChip(){
  logState.ui.editingChipFor = null;
  scheduleRenderApp();
}

/* =========================================================================
   マルチプレイヤー: アカウント・フレンド・同卓者指定 UIハンドラ
   ========================================================================= */

/* ---- ログイン誘導(匿名のままでは困る操作をした時) ---- */
// 「フレンドを追加する」等の操作をしようとしたタイミングでのみ表示する。
// 連携は必須ではないため、スキップしてそのまま進める導線も必ず用意する。
function needsLoginPromptFirst(){
  const p = logState.account.linkedProviders;
  return logState.account.isAnonymous && !p.google && !p.apple;
}
function openLoginPrompt(reason, afterAction){
  // ログイン誘導は常に単独の最前面モーダルとして表示する。「フレンド一覧を
  // 見ている最中にフレンドを追加しようとした」場合のように、既に別のモーダルを
  // 開いた状態からこの誘導が挟まれることがあるため、先に他のモーダルを閉じて
  // 重なり表示(タップ判定のズレ)を防ぐ。呼び出し元は afterAction 側で必要な
  // モーダルを改めて開き直す設計になっている。
  logState.ui.accountModalOpen = false;
  logState.ui.friendPickerOpen = false;
  logState.ui.friendsListOpen = false;
  logState.ui.addFriendOpen = false;
  logState.ui.historyLinkShareOpen = false;
  logState.ui.claimOpen = false;
  logState.ui.loginPromptOpen = true;
  logState.ui.loginPromptReason = reason;
  logState.ui._loginPromptAfterAction = afterAction; // ログイン後 or スキップ後に続ける処理
  scheduleRenderApp();
}
function closeLoginPrompt(){
  logState.ui.loginPromptOpen = false;
  logState.ui.loginPromptReason = null;
  logState.ui._loginPromptAfterAction = null;
  scheduleRenderApp();
}
async function loginPromptContinue(provider){
  const after = logState.ui._loginPromptAfterAction;
  if (provider === 'google') await CloudSync.linkGoogle();
  else if (provider === 'apple') await CloudSync.linkApple();
  // 連携に失敗しても(オフライン等)、匿名のまま続行できるようにする。
  closeLoginPrompt();
  if (after) after();
}

/* ---- ユーザーネーム設定・アカウントモーダル ---- */
function openAccountModal(){
  logState.ui.accountModalOpen = true;
  logState.ui.usernameInput = logState.account.username || '';
  logState.ui.usernameError = null;
  scheduleRenderApp();
}
function closeAccountModal(){
  logState.ui.accountModalOpen = false;
  scheduleRenderApp();
}
// ⚠️ ここでscheduleRenderApp()を呼ばないこと。renderAccountModal()は
// root.innerHTML = ... でモーダル全体(input要素含む)を毎回作り直すため、
// 1文字入力するたびに再描画するとinput要素そのものが差し替わってフォーカスが
// 失われ、iOSでソフトウェアキーボードが閉じてしまう(input自身のDOM値は
// ブラウザが保持するので、再描画しなくても入力内容の表示は崩れない)。
function setUsernameInput(v){ logState.ui.usernameInput = v; }
async function submitUsername(){
  const name = (logState.ui.usernameInput || '').trim();
  if (!isValidUsernameFormat(name)) {
    logState.ui.usernameError = '半角英数字・アンダースコア・ひらがな・カタカナ・漢字のみ、3〜20文字で入力してください';
    scheduleRenderApp();
    return;
  }
  logState.ui.usernameChecking = true;
  logState.ui.usernameError = null;
  scheduleRenderApp();
  const result = await CloudSync.claimUsername(name);
  logState.ui.usernameChecking = false;
  if (result.ok) {
    logState.ui.accountModalOpen = false;
    scheduleRenderApp();
  } else {
    logState.ui.usernameError = result.error === 'taken'
      ? 'そのユーザーネームは既に使われています'
      : result.error === 'unavailable'
        ? 'この画面はストアアプリ内でのみ利用できます'
        : '通信環境をご確認のうえ、もう一度お試しください';
    scheduleRenderApp();
  }
}
async function loginFromAccountModal(provider){
  // ボタンのタップ自体がハンドラまで届いているかをまず画面上で確認できる
  // ようにする(成功すればdismissDebugError()で消える)。
  showDebugError(`ログインボタン(${provider})`, 'タップを検知しました。サインイン処理を呼び出します…');
  const ok = provider === 'google' ? await CloudSync.linkGoogle() : await CloudSync.linkApple();
  if (ok) {
    dismissDebugError();
  } else if (logState.ui.debugError && logState.ui.debugError.context === `ログインボタン(${provider})`) {
    // linkGoogle/linkAppleが例外も投げず詳細も出せなかった(=想定外の失敗経路)場合の最終フォールバック。
    showDebugError(`ログインボタン(${provider})`, '処理は呼ばれましたが、詳細不明のまま失敗しました(例外なし・エラー情報なし)。');
  }
  scheduleRenderApp();
}

/* ---- 同卓者指定(ユーザーネーム検索/フレンド選択/ゲストのまま) ---- */
function openFriendPicker(playerName){
  // プッシュ通知の許可は、ユーザーが初めて「同卓者を指定する」操作を行った
  // タイミングまで遅らせてリクエストする(iOSの許可ダイアログ提示タイミング対策)。
  CloudSync.requestPushPermissionIfNeeded();
  const doOpen = () => {
    logState.ui.friendPickerOpen = true;
    logState.ui.friendPickerSlot = playerName;
    logState.ui.friendSearchInput = '';
    logState.ui.friendSearchResult = null;
    logState.ui.friendSearchError = null;
    scheduleRenderApp();
  };
  if (needsLoginPromptFirst()) {
    openLoginPrompt('friend_link', doOpen);
  } else {
    doOpen();
  }
}
function closeFriendPicker(){
  logState.ui.friendPickerOpen = false;
  logState.ui.friendPickerSlot = null;
  scheduleRenderApp();
}
// ⚠️ ここでscheduleRenderApp()を呼ばないこと(setUsernameInput参照)。
// renderFriendPickerModal()はroot.innerHTML = ...でモーダル全体(input要素
// 含む)を毎回作り直すため、1文字入力するたびに再描画するとinput要素そのものが
// 差し替わってフォーカスが失われ、iOSでソフトウェアキーボードが閉じてしまう。
function setFriendSearchInput(v){
  logState.ui.friendSearchInput = v;
  logState.ui.friendSearchResult = null;
  logState.ui.friendSearchError = null;
}
async function searchFriendByUsername(){
  const name = (logState.ui.friendSearchInput || '').trim();
  if (!isValidUsernameFormat(name)) {
    logState.ui.friendSearchError = 'ユーザーネームを入力してください';
    scheduleRenderApp();
    return;
  }
  logState.ui.friendSearchChecking = true;
  logState.ui.friendSearchError = null;
  scheduleRenderApp();
  const result = await CloudSync.searchUsername(name);
  logState.ui.friendSearchChecking = false;
  if (!result) {
    logState.ui.friendSearchError = '見つかりませんでした';
  } else if (result.isSelf) {
    logState.ui.friendSearchError = '自分自身は指定できません';
  } else {
    logState.ui.friendSearchResult = result;
  }
  scheduleRenderApp();
}
// 同卓者に指定した瞬間、確認フローなしで即座に処理を進め、同時に自動でフレンド関係になる。
async function linkParticipant(uid, username){
  const slot = logState.ui.friendPickerSlot;
  if (!slot) return;
  logState.settings.participantLinks[slot] = { uid, username };
  // 指定した瞬間、同じ行のプレイヤー名入力欄にもそのユーザーネームを自動入力する。
  // setPlayerName()はrenamePlayerEverywhere()経由でparticipantLinksのキーも
  // 追従して書き換えるため、直前に設定した上のリンクもslot→usernameへ正しく
  // 引き継がれる(以後プレイヤー名を手動で書き換えても、renamePlayerEverywhere()が
  // 都度リンクのキーを追従させるので紐付け自体は解除されない)。
  const idx = logState.settings.playerNames.indexOf(slot);
  if (idx !== -1) {
    setPlayerName(idx, username);
  } else {
    saveLogState();
  }
  closeFriendPicker();
  await CloudSync.addFriend(uid, username);
  scheduleRenderApp();
}
function unlinkParticipant(){
  const slot = logState.ui.friendPickerSlot;
  if (!slot) return;
  delete logState.settings.participantLinks[slot];
  logState.ui.activeMemberPresetId = null; // ④: フレンド指定の変更もメンバー構成の変更として扱う
  saveLogState();
  closeFriendPicker();
}

/* ---- ③ 控えメンバー・メンバー入れ替え ---- */
function toggleBenchEnabled(){
  logState.settings.benchEnabled = !logState.settings.benchEnabled;
  saveLogState(); scheduleRenderApp();
}
function addBenchMember(){
  const n = logState.settings.benchNames.length + 1;
  logState.settings.benchNames.push(`控え${n}`);
  saveLogState(); scheduleRenderApp();
}
function setBenchName(i, value){
  const trimmed = (value || '').trim();
  logState.settings.benchNames[i] = trimmed || `控え${i + 1}`;
  saveLogState(); scheduleRenderApp();
}
function removeBenchMember(i){
  logState.settings.benchNames.splice(i, 1);
  saveLogState(); scheduleRenderApp();
}
// 交代アイコンは控えメンバーの行にある。タップした控えメンバーを、次に
// 選ぶアクティブメンバーと入れ替える(誰と交代するかは後のポップアップで選ぶ)。
function openSubstituteModal(benchIndex){
  logState.ui.substituteOpen = true;
  logState.ui.substituteBenchIndex = benchIndex;
  scheduleRenderApp();
}
function closeSubstituteModal(){
  logState.ui.substituteOpen = false;
  logState.ui.substituteBenchIndex = null;
  scheduleRenderApp();
}
// slotIndexで指定したアクティブな枠(playerNames[slotIndex])を、控えメンバー
// (benchNames[benchIndex])と入れ替える。「進行中かどうか」は問わず、まだ
// 記録していない半荘の入力欄であればいつでも呼べる(呼び出し元のUI側で
// 常時表示することでこれを満たす)。
//
// ⚠️ ここではrenamePlayerEverywhere()を意図的に呼ばない。通常のプレイヤー名
// 変更(setPlayerName)は「同じ人の表示名を変える」操作なので過去の半荘記録
// にも遡って反映するが、交代は「別の人に入れ替わる」操作なので、既に
// 「半荘を記録する」が押された過去の半荘のscoresキー(=退いた人の名前の
// ままでよい、その人自身の記録として正しい)を書き換えてはならない。
// 今後(まだ記録していない)入力欄からのみ、新しい名前(控えメンバーの名前)
// が使われるようにする。
function confirmSubstitute(slotIndex){
  const benchIndex = logState.ui.substituteBenchIndex;
  if (benchIndex == null) return;
  const benchNames = logState.settings.benchNames;
  const incoming = benchNames[benchIndex];
  const outgoing = logState.settings.playerNames[slotIndex];
  if (incoming == null || outgoing == null) return;
  logState.settings.playerNames[slotIndex] = incoming;
  benchNames.splice(benchIndex, 1, outgoing); // 退いた人がそのまま控えメンバー欄に入る(入れ替え)
  // まだ記録していない入力欄に、退いた人の分として未確定の点数が入力途中
  // だった場合、別人の点数を新しい人が引き継いでしまわないようクリアする。
  delete logState.ui.formScores[outgoing];
  delete logState.ui.formScoreSign[outgoing];
  delete logState.ui.formScoreAuto[outgoing];
  logState.ui.formScores[incoming] = '';
  logState.ui.formScoreSign[incoming] = '+';
  logState.ui.formScoreAuto[incoming] = false;
  logState.ui.activeMemberPresetId = null; // ④: メンバー構成が変わったので適用状態を外す
  closeSubstituteModal();
  saveLogState();
  scheduleRenderApp();
}

/* ---- ②④共通: プリセット(ルール/メンバー構成)の汎用管理 ----
   kindは'rule'|'member'。「1タップで適用・⋮メニューから名前変更/上書き・
   削除確認・件数上限なし・+新規保存」というUI/挙動パターンを②③どちらの
   プリセット種別でも共有するための共通実装。 */
function getPresetList(kind){
  return kind === 'rule' ? logState.rulePresets : logState.memberPresets;
}
function getActivePresetId(kind){
  return kind === 'rule' ? logState.ui.activeRulePresetId : logState.ui.activeMemberPresetId;
}
function setActivePresetId(kind, id){
  if (kind === 'rule') logState.ui.activeRulePresetId = id;
  else logState.ui.activeMemberPresetId = id;
}
function captureMemberPreset(){
  const names = activePlayers();
  const participantLinks = {};
  names.forEach(p => { if (logState.settings.participantLinks[p]) participantLinks[p] = logState.settings.participantLinks[p]; });
  return { playerNames: [...names], participantLinks };
}
function applyRulePreset(id){
  const preset = logState.rulePresets.find(p => p.id === id);
  if (!preset) return;
  Object.assign(logState.settings, preset.rules);
  logState.ui.activeRulePresetId = id;
  saveLogState();
  scheduleRenderApp();
}
function applyMemberPreset(id){
  const preset = logState.memberPresets.find(p => p.id === id);
  if (!preset) return;
  const names = preset.members.playerNames;
  logState.settings.playerCount = names.length;
  logState.settings.playerNames = [...names];
  names.forEach(p => {
    if (preset.members.participantLinks[p]) logState.settings.participantLinks[p] = preset.members.participantLinks[p];
  });
  resetFormScores();
  logState.ui.activeMemberPresetId = id;
  saveLogState();
  scheduleRenderApp();
}
function applyPreset(kind, id){
  if (kind === 'rule') applyRulePreset(id);
  else applyMemberPreset(id);
}
function openPresetMenu(kind, id){
  logState.ui.presetMenuOpen = { kind, id };
  scheduleRenderApp();
}
function closePresetMenu(){
  logState.ui.presetMenuOpen = null;
  scheduleRenderApp();
}
// id=nullなら「+ 新規保存」(新規作成モード)、idがあれば既存プリセットの名前変更モード。
function _focusPresetNameInput(){
  scheduleRenderApp(() => {
    const el = document.getElementById('presetNameInput');
    if (el) { el.focus(); el.select(); }
  });
}
function startRenamePreset(kind, id){
  logState.ui.presetMenuOpen = null;
  logState.ui.renamingPreset = { kind, id };
  _focusPresetNameInput();
}
function startNewPreset(kind){
  logState.ui.renamingPreset = { kind, id: null };
  _focusPresetNameInput();
}
function cancelRenamePreset(){
  logState.ui.renamingPreset = null;
  scheduleRenderApp();
}
function saveRenamePreset(name){
  const target = logState.ui.renamingPreset;
  if (!target) return;
  const trimmed = (name || '').trim();
  if (!trimmed) { cancelRenamePreset(); return; }
  const { kind, id } = target;
  if (id) {
    const preset = getPresetList(kind).find(p => p.id === id);
    if (preset) preset.name = trimmed;
  } else {
    const preset = {
      id: 'preset_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      name: trimmed,
      createdAt: Date.now(),
    };
    if (kind === 'rule') {
      preset.rules = captureRulePreset(logState.settings);
      logState.rulePresets.push(preset);
    } else {
      preset.members = captureMemberPreset();
      logState.memberPresets.push(preset);
    }
    setActivePresetId(kind, preset.id);
  }
  logState.ui.renamingPreset = null;
  saveLogState();
  scheduleRenderApp();
}
function overwritePreset(kind, id){
  const preset = getPresetList(kind).find(p => p.id === id);
  if (!preset) return;
  if (kind === 'rule') preset.rules = captureRulePreset(logState.settings);
  else preset.members = captureMemberPreset();
  logState.ui.presetMenuOpen = null;
  setActivePresetId(kind, id);
  saveLogState();
  scheduleRenderApp();
}
function requestDeletePreset(kind, id){
  logState.ui.presetMenuOpen = null;
  logState.ui.confirmDeletePreset = { kind, id };
  scheduleRenderApp();
}
function cancelDeletePreset(){
  logState.ui.confirmDeletePreset = null;
  scheduleRenderApp();
}
function confirmDeletePresetAction(){
  const target = logState.ui.confirmDeletePreset;
  if (!target) return;
  const { kind, id } = target;
  if (kind === 'rule') {
    logState.rulePresets = logState.rulePresets.filter(p => p.id !== id);
    if (logState.ui.activeRulePresetId === id) logState.ui.activeRulePresetId = null;
  } else {
    logState.memberPresets = logState.memberPresets.filter(p => p.id !== id);
    if (logState.ui.activeMemberPresetId === id) logState.ui.activeMemberPresetId = null;
  }
  logState.ui.confirmDeletePreset = null;
  saveLogState();
  scheduleRenderApp();
}

/* ---- 対局履歴: ゲストプレイヤーへの結果受け取りリンクを送る ----
   「既存の指定ボタンの選択肢に追加する」という要望に対応するため、専用の新しい
   ボタンを画面に増やすのではなく、対局履歴詳細のプレイヤーカード(既存の
   .total-card、totalCardsHtml参照)自体をタップ対象にし、renderFriendPickerModal
   と同じ見た目(.history-modal-overlay/.history-modal)を流用したモーダルを開く。
   対局履歴は確定後は書き換えられない(firestore.rulesのmatchHistory.update=false)
   ため、既存の「ユーザーネーム検索/フレンドから選ぶ」即時リンクの仕組みはここでは
   使わず、「リンクを送る」(トークン発行+共有)だけを提供する。 */
function openHistoryLinkShare(matchId, playerSlot){
  const doOpen = () => {
    logState.ui.historyLinkShareOpen = true;
    logState.ui.historyLinkShareMatchId = matchId;
    logState.ui.historyLinkSharePlayerSlot = playerSlot;
    logState.ui.historyLinkShareBusy = false;
    logState.ui.historyLinkShareError = null;
    scheduleRenderApp();
  };
  if (needsLoginPromptFirst()) {
    openLoginPrompt('history_link_share', doOpen);
  } else {
    doOpen();
  }
}
function closeHistoryLinkShare(){
  logState.ui.historyLinkShareOpen = false;
  logState.ui.historyLinkShareMatchId = null;
  logState.ui.historyLinkSharePlayerSlot = null;
  logState.ui.historyLinkShareError = null;
  scheduleRenderApp();
}
async function generateAndShareClaimLink(){
  const matchId = logState.ui.historyLinkShareMatchId;
  const slot = logState.ui.historyLinkSharePlayerSlot;
  if (!matchId || !slot) return;
  logState.ui.historyLinkShareBusy = true;
  logState.ui.historyLinkShareError = null;
  scheduleRenderApp();
  const result = await CloudSync.createClaimToken(matchId, slot);
  logState.ui.historyLinkShareBusy = false;
  if (!result.ok) {
    logState.ui.historyLinkShareError = 'リンクの作成に失敗しました。通信環境をご確認のうえ、もう一度お試しください。';
    scheduleRenderApp();
    return;
  }
  const url = `${CLAIM_LINK_BASE_URL}?token=${encodeURIComponent(result.token)}`;
  closeHistoryLinkShare();
  const text = `${slot}さんへ、麻雀対局の結果をお送りします。\nリンクをタップして受け取ってください(有効期限: 3日間)\n${url}`;
  await shareText(text, '対局結果を送る');
}

/* ---- 受け取ったリンク(?token=)の確認 ---- */
// Universal Links経由(App.addListener('appUrlOpen')、下部の起動処理参照)、または
// このWebページ自体を直接 ?token=... 付きで開いた場合の両方から呼ばれる。
function handleIncomingUrl(urlString){
  try {
    const url = new URL(urlString, location.href);
    const token = url.searchParams.get('token');
    if (token) openClaimFlow(token);
  } catch (e) { /* 不正なURLは無視 */ }
}
async function openClaimFlow(token){
  logState.ui.claimOpen = true;
  logState.ui.claimToken = token;
  logState.ui.claimData = null;
  logState.ui.claimError = null;
  logState.ui.claimDone = false;
  logState.ui.claimBusy = true;
  scheduleRenderApp();
  const result = await CloudSync.fetchClaimToken(token);
  logState.ui.claimBusy = false;
  if (!result.ok) {
    logState.ui.claimError = result.error === 'expired' ? 'このリンクの有効期限(3日間)が切れています。'
      : result.error === 'used' ? 'このリンクは既に使用されています。'
      : result.error === 'notfound' ? 'このリンクは見つかりませんでした。'
      : 'リンクを確認できませんでした。通信環境をご確認のうえ、もう一度お試しください。';
    scheduleRenderApp();
    return;
  }
  logState.ui.claimData = result.data;
  scheduleRenderApp();
}
function closeClaimFlow(){
  logState.ui.claimOpen = false;
  logState.ui.claimToken = null;
  logState.ui.claimData = null;
  logState.ui.claimError = null;
  logState.ui.claimDone = false;
  scheduleRenderApp();
}
// 「受け取る」ボタン。匿名のままだと後で機種変更時にデータを失うため、
// openFriendPicker/openHistoryLinkShareと同じくログインを先に促す
// (スキップして匿名のまま続けることも可能)。
function requestClaimMatch(){
  const doClaim = () => {
    logState.ui.claimOpen = true;
    scheduleRenderApp();
    confirmClaimLink();
  };
  if (needsLoginPromptFirst()) {
    openLoginPrompt('claim_link', doClaim);
  } else {
    doClaim();
  }
}
async function confirmClaimLink(){
  if (!logState.ui.claimData || !logState.ui.claimToken) return;
  logState.ui.claimBusy = true;
  logState.ui.claimError = null;
  scheduleRenderApp();
  const result = await CloudSync.claimMatchToken(logState.ui.claimToken, logState.ui.claimData);
  logState.ui.claimBusy = false;
  if (!result.ok) {
    logState.ui.claimError = '受け取りに失敗しました。通信環境をご確認のうえ、もう一度お試しください。';
    scheduleRenderApp();
    return;
  }
  if (!logState.matchHistory.some(m => m.id === result.entry.id)) {
    logState.matchHistory.push(result.entry);
    logState.matchHistory.sort((a, b) => new Date(b.endedAt || b.startedAt || 0) - new Date(a.endedAt || a.startedAt || 0));
    saveLogState();
  }
  logState.ui.claimDone = true;
  scheduleRenderApp();
}

// ⚠️ ここでscheduleRenderApp()を呼ばないこと(setUsernameInput参照)。

// 含む)を毎回作り直すため、1文字入力するたびに再描画するとinput要素そのものが
// 差し替わってフォーカスが失われ、iOSでソフトウェアキーボードが閉じてしまう。
function setAddFriendSearchInput(v){

  logState.ui.addFriendSearchResult = null;
  logState.ui.addFriendSearchError = null;

async function searchAddFriend(){
  const name = (logState.ui.addFriendSearchInput || '').trim();
  if (!isValidUsernameFormat(name)) {
    logState.ui.addFriendSearchError = 'ユーザーネームを入力してください';
    scheduleRenderApp();
    return;
  }
  logState.ui.addFriendSearchChecking = true;
  logState.ui.addFriendSearchError = null;
  scheduleRenderApp();
  const result = await CloudSync.searchUsername(name);
  logState.ui.addFriendSearchChecking = false;
  if (!result) {
    logState.ui.addFriendSearchError = '見つかりませんでした';
  } else if (result.isSelf) {
    logState.ui.addFriendSearchError = '自分自身は追加できません';
  } else if (logState.friends.some(f => f.uid === result.uid)) {
    logState.ui.addFriendSearchError = '既にフレンドです';
  } else {
    logState.ui.addFriendSearchResult = result;
  }
  scheduleRenderApp();
}

function renderHanchanForm(){
  if (isRoomViewerOnly()) {
    const hostName = (logState.room.participants.find(p => p.uid === logState.room.hostUid) || {}).name;
    return `<section><div class="sec-title">半荘の結果を入力<span class="hint">閲覧のみ</span></div>
      <div class="log-empty">${hostName ? escapeHtml(hostName) + 'さん' : '代表入力者'}が記録中です。この端末では入力できません。</div>
    </section>`;
  }
  const s = logState.settings;
  const players = activePlayers();
  const total = formTotal();
  const expected = s.startPoints * s.playerCount;
  const allFilled = players.every(p => logState.ui.formScores[p] !== '' && !isNaN(formScoreActual(p)));
  const bustedPlayers = players.filter(p => (formScoreActual(p)||0) < 0);
  const needsBuster = s.tobiEnabled && s.tobiRecipient === 'buster';
  const busterOk = !needsBuster || bustedPlayers.every(p => logState.ui.formBuster[p]);
  const valid = allFilled && total === expected && busterOk;
  const editing = logState.ui.editingHanchanId !== null;
  // 「第◯半荘」は作成時の連番(id)ではなく、削除後も欠番が出ないよう
  // 現在残っている対局ログの中での順番（古い方から1,2,3...）で数え直す。
  const editingIdx = editing ? logState.hanchans.findIndex(x => x.id === logState.ui.editingHanchanId) : -1;
  const editingDispNum = editingIdx >= 0 ? logState.hanchans.length - editingIdx : '';

  return `
    <section id="hanchanFormAnchor">
      <div class="sec-title">${editing?`第${editingDispNum}半荘を編集中`:'半荘の結果を入力'}<span class="hint">${editing?'':`第${logState.hanchans.length+1}半荘`}</span></div>
      <div class="score-scale-hint">下2桁(00)は省略できます　例: 25,000点 → <b>250</b></div>
      <div class="score-input-grid">
        ${players.map(p=>{
          const val = formScoreActual(p);
          const busted = !isNaN(val) && val < 0;
          return `
          <div class="score-input-row">
            <span class="pname">${escapeHtml(p)}</span>
            <button type="button" class="sign-toggle-btn ${logState.ui.formScoreSign[p]==='-'?'minus':'plus'}" onclick="toggleFormScoreSign('${escKey(p)}')">${logState.ui.formScoreSign[p]==='-'?'−':'+'}</button>
            <input class="num-input ${logState.ui.formScoreAuto[p]?'auto-filled':''}" type="number" step="1" inputmode="numeric" placeholder="例:250"
              value="${logState.ui.formScores[p]}" onchange="setFormScore('${escKey(p)}', this.value)">
            ${busted && needsBuster ? `
              <select class="text-input buster-select" onchange="setFormBuster('${escKey(p)}', this.value)">
                <option value="">誰が飛ばした？</option>
                ${players.filter(x=>x!==p).map(x=>`<option value="${escapeHtml(x)}" ${logState.ui.formBuster[p]===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}
              </select>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="check-banner ${(allFilled && total===expected)?'ok':'bad'}" style="margin-top:9px;">
        ${!allFilled ? '素点を入力してください' : total===expected ? `✓ 合計 ${total.toLocaleString()}点` : `⚠ 合計 ${total.toLocaleString()}点（${total-expected>0?'+':''}${(total-expected).toLocaleString()}点のズレ）`}
      </div>
      <button class="record-btn" style="margin-top:9px;width:100%;" ${valid?'':'disabled'} onclick="recordHanchan()">${editing?'この内容で更新する':'この半荘を記録'}</button>
      ${editing ? `<button class="mentsu-add" style="margin-top:7px;" onclick="cancelEditHanchan()">編集をキャンセル</button>` : ''}
    </section>`;
}

// hanchansList/sは対局履歴の詳細画面からも(settingsSnapshotを渡して)再利用できるよう
// パラメータ化してある。opts.readOnly=trueで編集・削除ボタンを非表示にする
// (過去の確定済み対局は書き換えさせない)。
function renderHanchanLog(hanchansList, s, opts){
  opts = opts || {};
  const readOnly = !!opts.readOnly;
  if (hanchansList.length === 0) {
    return `<section><div class="sec-title">対局ログ</div><div class="log-empty">まだ記録がありません</div></section>`;
  }
  // 「第◯半荘」は作成時の連番(id)ではなく、削除しても欠番が出ないよう
  // 現在残っている対局ログの中での順番（一番古いものを1として数え直す）で表示する。
  const cards = hanchansList.map((h, idx)=>{
    const dispNum = hanchansList.length - idx;
    const { pt, ranked } = calcHanchanResult(h, s);
    const rows = [...ranked].sort((a,b)=>a.loRank-b.loRank).map(r=>`
      <div class="hc-row ${r.loRank===1?'rank1':''}">
        <span class="hc-rank">${r.loRank===r.hiRank ? r.loRank : `${r.loRank}-${r.hiRank}`}</span>
        <span class="hc-name${premiumNameClass(r.name, s.participantLinks)}">${escapeHtml(r.name)}</span>
        <span class="hc-score">${r.score.toLocaleString()}</span>
        <span class="hc-pt ${pt[r.name]>=0?'plus':'minus'}">${formatPt(pt[r.name])}</span>
      </div>`).join('');
    return `
      <div class="hanchan-card">
        <div class="hc-head">
          <span class="hc-title">第${dispNum}半荘</span>
          ${readOnly ? '' : `<span class="hc-actions">
            <button onclick="editHanchan(${h.id})">✎</button>
            <button onclick="deleteHanchan(${h.id})">×</button>
          </span>`}
        </div>
        <div class="hc-rows">${rows}</div>
      </div>`;
  }).join('');
  return `<section><div class="sec-title">対局ログ<span class="hint">${hanchansList.length}半荘</span></div><div style="display:flex;flex-direction:column;gap:8px;">${cards}</div></section>`;
}

// shareMatchId: 対局履歴の詳細画面(renderHistoryDetail)からだけ渡される。指定時、
// まだアカウント紐付けの無い(=ゲストの)プレイヤーのカードをタップ可能にし、
// そのプレイヤー枠専用の結果受け取りリンクを送れるようにする(openHistoryLinkShare
// 参照)。ライブ対局中の表示(renderStickyHeader)では渡さないため、既存の見た目・
// 挙動は変わらない。新しいボタン要素は増やさず、既存のカード自体をタップ対象にする。
function totalCardsHtml(order, totals, topMoney, participantLinks, shareMatchId){
  return `
    <div class="total-cards">
      ${order.map(p=>{
        const isTop = totals.money[p]===topMoney && topMoney > 0;
        const isGuest = !(participantLinks && participantLinks[p]);
        const shareable = !!shareMatchId && isGuest;
        return `
        <div class="total-card ${isTop?'top':''} ${shareable?'shareable':''}" ${shareable?`onclick="openHistoryLinkShare('${escKey(shareMatchId)}','${escKey(p)}')"`:''}>
          <div class="pname${premiumNameClass(p, participantLinks)}">${isTop?'<span class="crown">👑</span>':''}${escapeHtml(p)}${shareable?' <span class="share-hint">🔗</span>':''}</div>
          ${moneyStackInnerHtml(totals.money[p], totals.chipMoney[p], 'pmoney')}
          <div class="ppt">${formatPt(totals.pt[p])}pt</div>
        </div>`;
      }).join('')}
    </div>`;
}

// 演出モード用: 現在の合計収支(円)で順位グループ(同着はまとめる)を作り、
// 「2位→3位→…→1位」の順に並べ替える。同着で複数の順位にまたがる場合は
// そのグループのいちばん良い方の順位（loRank）を発表順の基準にする。
function revealGroupsFor(players, totals, playerCount){
  const entries = players.map(p => ({ name: p, score: Math.round((totals.money[p]||0) * 100) / 100 }));
  const ranked = rankPlayers(entries);
  const order = revealOrderFor(playerCount);
  const seen = new Set();
  const groups = [];
  ranked.forEach(r => {
    const key = `${r.loRank}-${r.hiRank}`;
    if (seen.has(key)) return;
    seen.add(key);
    groups.push({ loRank: r.loRank, hiRank: r.hiRank, members: ranked.filter(x => x.loRank===r.loRank && x.hiRank===r.hiRank) });
  });
  groups.sort((a,b) => order.indexOf(a.loRank) - order.indexOf(b.loRank));
  return groups;
}
function revealRankLabel(group){
  return group.loRank===group.hiRank ? `${group.loRank}位` : `${group.loRank}〜${group.hiRank}位`;
}
function revealGroupInnerHtml(group, totals){
  const isTop = group.loRank === 1;
  return `
      <div class="reveal-rank">${isTop?'👑 ':''}${revealRankLabel(group)}</div>
      ${group.members.map(m => `
        <div class="reveal-member">
          <span class="reveal-name${premiumNameClass(m.name)}">${escapeHtml(m.name)}</span>
          <div class="reveal-money-stack">${moneyStackInnerHtml(totals.money[m.name], totals.chipMoney[m.name], 'reveal-money')}</div>
          <span class="reveal-pt">${formatPt(totals.pt[m.name])}pt</span>
        </div>`).join('')}`;
}
function revealGroupCardHtml(group, totals){
  const isTop = group.loRank === 1;
  return `<div class="reveal-card ${isTop?'top':''}">${revealGroupInnerHtml(group, totals)}</div>`;
}
// 発表中で、まだ名前・得点をタップしていない順位のラベルのみカード(1段階目)。
function revealPendingLabelHtml(group){
  return `
    <div class="reveal-card reveal-pending" onclick="revealCurrentGroup()">
      <div class="reveal-rank">${revealRankLabel(group)}</div>
      <div class="reveal-tap-hint">👆 タップして発表</div>
    </div>`;
}
// まだ発表の順番が回ってきていない順位の、位置だけ確保しておくプレースホルダー。
// 最終的な表示順(1位が一番上)を発表開始時点から固定しておくために、
// 全ての順位の枠を最初から用意しておく。
function revealNotYetCardHtml(group){
  return `
    <div class="reveal-card reveal-not-yet">
      <div class="reveal-rank">${revealRankLabel(group)}</div>
    </div>`;
}
// 発表中で、タップして名前・得点まで見えている順位のカード(2段階目)。
// もう一度タップすると次の順位へ進む(startReveal/advanceReveal参照)。
function revealPeekedCardHtml(group, totals, isLast){
  const isTop = group.loRank === 1;
  return `
    <div class="reveal-card reveal-peeked ${isTop?'top':''}" onclick="advanceReveal()">
      ${revealGroupInnerHtml(group, totals)}
      <div class="reveal-next-hint">👆 タップして${isLast ? '発表を終える' : '次の順位へ'}</div>
    </div>`;
}

// 「対局を終了する」系のボタン・確認UI。isPresentationDone=trueの時だけ
// 「対局を終了して履歴に保存」の文言・演出後の見た目にする(演出モードでは
// 発表が終わるまでこのボタン自体を出さない＝呼び出し側で制御)。
function renderEndMatchControls(isPresentationDone){
  if (isRoomViewerOnly()) return ''; // 対局の終了(確定保存)は代表入力者だけの操作
  if (logState.hanchans.length === 0) return '';
  if (logState.ui.confirmEndMatch) {
    return `
      <div class="end-match-confirm">
        <span>この対局を終了して履歴に保存しますか？</span>
        <div class="end-match-confirm-btns">
          <button class="preset-btn" onclick="cancelEndMatch()">キャンセル</button>
          <button class="preset-btn danger" onclick="confirmEndMatch()">終了して保存</button>
        </div>
      </div>`;
  }
  const label = isPresentationDone ? '🏁 対局を終了して履歴に保存' : '対局を終了する';
  // ④: 終局(結果発表)のタイミングで、今のメンバー構成をプリセットとして
  // 保存できる導線。保存自体のロジックはプレイヤー名入力欄まわりの
  // 「+ 新規保存」(renderPresetChipRow('member'))と同じstartNewPreset()を使う。
  return `
    <button class="mentsu-add" style="margin-bottom:8px;" onclick="startNewPreset('member')">📋 このメンバーをプリセットとして保存</button>
    <button class="end-match-btn" onclick="requestEndMatch()">${label}</button>`;
}

function renderRoomStatusHtml(){
  if (!logState.room) return '';
  if (isRoomViewerOnly()) {
    const hostP = logState.room.participants.find(p => p.uid === logState.room.hostUid);
    return `<div class="room-status-row">👀 ${hostP ? escapeHtml(hostP.name) + 'さん' : '代表入力者'}の卓に参加中(閲覧のみ・リアルタイム更新)</div>`;
  }
  const linkedCount = (logState.room.participants || []).filter(p => p.uid).length;
  return `<div class="room-status-row">🔴 卓を公開中・同卓${linkedCount}人にリアルタイム配信中</div>`;
}

function renderStickyHeader(s, totals){
  const players = activePlayers();
  const presentation = logState.settings.presentationMode;
  const viewerOnly = isRoomViewerOnly();
  const modeSwitchHtml = `
    <div class="mode-switch-row">
      <button class="share-icon-btn" onclick="shareCurrentResult()" title="現在の収支をシェア">📤</button>
      <span class="mode-label">演出モード</span>
      <span class="switch ${presentation?'on':''} ${viewerOnly?'disabled':''}" onclick="${viewerOnly?'':'togglePresentationMode()'}"></span>
    </div>`;
  const roomStatusHtml = renderRoomStatusHtml();

  if (!presentation) {
    const order = [...players].sort((a,b)=> totals.money[b]-totals.money[a]);
    const topMoney = order.length ? totals.money[order[0]] : 0;
    return `<div class="sticky-header">${roomStatusHtml}${modeSwitchHtml}${totalCardsHtml(order, totals, topMoney, s.participantLinks)}${renderEndMatchControls(false)}</div>`;
  }

  if (!logState.ui.revealActive) {
    const noLog = logState.hanchans.length === 0;
    return `<div class="sticky-header">${roomStatusHtml}${modeSwitchHtml}
      <button class="reveal-btn" ${(noLog||viewerOnly) ? 'disabled' : ''} onclick="startReveal()">🎤 終局！結果を発表する</button>
    </div>`;
  }

  const groups = revealGroupsFor(players, totals, logState.settings.playerCount);
  const done = logState.ui.revealStep >= groups.length;
  // 発表順(2位→3位→…→1位)とは別に、表示位置は最初から常に「1位が一番上、
  // 以下2位・3位…」という通常の順位順に固定しておく(案1)。各順位の枠は
  // revealStepがそこまで到達するまで「？」のプレースホルダーのまま、到達したら
  // タップ待ち→タップで名前・得点、の順に同じ枠の中身だけが変わっていく。
  // こうすることで、最後に発表される1位のカードが一番下に積み上がってしまう
  // (発表順で表示していた頃の)問題を避け、発表が終わった瞬間には既に
  // 1位が一番上に来ている状態になる。
  const rankedGroups = [...groups].sort((a,b) => a.loRank - b.loRank);
  const slotsHtml = rankedGroups.map(g => {
    const revealIndex = groups.indexOf(g);
    if (done || revealIndex < logState.ui.revealStep) return revealGroupCardHtml(g, totals);
    if (revealIndex > logState.ui.revealStep) return revealNotYetCardHtml(g);
    return logState.ui.revealPeek
      ? revealPeekedCardHtml(g, totals, revealIndex === groups.length - 1)
      : revealPendingLabelHtml(g);
  }).join('');

  // 発表中〜発表後は順位カードが積み重なって縦に長くなり得るため、sticky解除
  // (header-block)にして、スクロール時に下のフォームなどを覆い隠さないようにする。
  // 発表は完全にタップ駆動(自動タイマーなし): 現在の順位のラベルをタップすると
  // 名前・得点が表示され(revealCurrentGroup)、さらにタップすると次の順位へ進む
  // (advanceReveal)。
  return `<div class="header-block">${roomStatusHtml}${modeSwitchHtml}
    <div class="reveal-area">
      ${slotsHtml}
    </div>
    ${done
      ? `<div class="reveal-done">🎉 発表終了！次の半荘を記録するとまた隠れます</div>${renderEndMatchControls(true)}`
      : ''}
  </div>`;
}

function renderLog(){
  const s = settingsWithPlayers();
  const totals = calcTotals(logState.hanchans, logState.chips, s);
  const headerHtml = renderStickyHeader(s, totals);

  document.getElementById('logTab').innerHTML =
    headerHtml + renderPlayerRosterPanel() + renderSettingsAccordion() + renderChipsAccordion() + renderHanchanForm()
    + renderHanchanLog(logState.hanchans, s, { readOnly: isRoomViewerOnly() });
}

/* =========================================================================
   対局履歴モーダル（ハンバーガーメニュー）
   ========================================================================= */

function memberKey(names){ return [...names].slice().sort().join('・'); }

function formatMatchDate(startedAt, endedAt){
  const d = new Date(endedAt || startedAt || Date.now());
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  logState.ui.historyOpen = true;
  logState.ui.historyView = 'list';
  logState.ui.historyDetailId = null;
  logState.ui.historyFriendFilter = null; // ハンバーガーメニューからは常に全履歴を表示する

  logState.ui.historyDetailId = null;
  logState.ui.friendsListOpen = false;

  logState.ui.historyView = 'list';

function closeHistoryModal(){

/* ---- フレンド絞り込み: このuidが参加者に含まれる対局だけを返す ---- */
function filterMatchHistoryByFriend(matchHistory, filter){
  if (!filter) return matchHistory;
  return matchHistory.filter(m => Array.isArray(m.participantUids) && m.participantUids.includes(filter.uid));
}

/* ---- 一覧 ---- */
function renderHistoryList(){
  const filter = logState.ui.historyFriendFilter;
  const list = filterMatchHistoryByFriend(logState.matchHistory, filter);
  if (list.length === 0) {
    return filter
      ? `<div class="history-empty">${escapeHtml(filter.username)}さんと同卓した対局はまだありません<br>同卓者に指定して対局すると、ここに記録が残ります</div>`
      : `<div class="history-empty">まだ保存された対局はありません<br>「対局を終了する」を押すと、ここに記録が残ります</div>`;
  }
  const cards = list.map(m => {

    const players = s.playerNames.slice(0, s.playerCount);

    const order = [...players].sort((a,b)=>totals.money[b]-totals.money[a]);

      <div class="history-card" onclick="openHistoryDetail('${escKey(m.id)}')">

        <div class="history-title">${m.title ? escapeHtml(m.title) : escapeHtml(players.join('・'))}</div>
        ${winner ? `<div class="history-winner">🏆 ${escapeHtml(winner)}<span class="history-winner-money">${formatMoney(totals.money[winner])}</span></div>` : ''}
      </div>`;
  }).join('');
  return `<div class="history-list">${cards}</div>`;
}

/* ---- 詳細 ---- */
function renderHistoryDetail(id){
  const m = logState.matchHistory.find(x => x.id === id);
  if (!m) return `<div class="history-empty">見つかりませんでした</div>`;
  const s = m.settingsSnapshot;
  const players = s.playerNames.slice(0, s.playerCount);
  const settingsForCalc = { ...s, players };
  const totals = calcTotals(m.hanchans, m.chips, settingsForCalc);
  const order = [...players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const topMoney = order.length ? totals.money[order[0]] : 0;
  const editingTitle = logState.ui.editingArchiveTitleId === id;
  const chipSum = players.reduce((sum,p)=> sum + (m.chips[p]||0), 0);

  const titleHtml = editingTitle
    ? `<input class="text-input" id="archiveTitleInput" value="${escapeHtml(m.title||'')}" placeholder="対局メモ・タイトル（例: 〇〇杯 第3戦）" onchange="saveArchiveTitle('${escKey(id)}', this.value)" onblur="saveArchiveTitle('${escKey(id)}', this.value)">`
    : `<div class="history-detail-title" onclick="startEditArchiveTitle('${escKey(id)}')">${m.title ? escapeHtml(m.title) : '📝 タイトル・メモを追加'}</div>`;

  const deleteHtml = logState.ui.confirmDeleteArchiveId === id
    ? `<div class="end-match-confirm">
        <span>この対局の記録を削除しますか？元に戻せません。</span>
        <div class="end-match-confirm-btns">
          <button class="preset-btn" onclick="cancelDeleteArchive()">キャンセル</button>
          <button class="preset-btn danger" onclick="confirmDeleteArchive('${escKey(id)}')">削除する</button>
        </div>
      </div>`
    : `<button class="mentsu-add danger-text" onclick="requestDeleteArchive('${escKey(id)}')">🗑 この記録を削除</button>`;

  return `
    <div class="history-detail">
      <div class="history-detail-title-row">${titleHtml}</div>
      <div class="history-detail-meta">${formatMatchDate(m.startedAt, m.endedAt)}・${players.map(p=>`<span class="${premiumNameClass(p, s.participantLinks).trim()}">${escapeHtml(p)}</span>`).join('・')}</div>
      ${totalCardsHtml(order, totals, topMoney, s.participantLinks, CloudSync.isAvailable() ? id : null)}
      ${CloudSync.isAvailable() && order.some(p => !s.participantLinks[p]) ? `<div class="history-reminder">💡 ゲストのプレイヤー名をタップすると、結果受け取りリンクを送れます</div>` : ''}
      ${chipSum !== 0 ? `<div class="check-banner bad" style="margin-top:8px;">⚠ チップ合計 ${chipSum>0?'+':''}${chipSum}枚（ゼロサムになっていません）</div>` : ''}
      ${renderHanchanLog(m.hanchans, settingsForCalc, { readOnly: true })}
      <div class="history-detail-actions">
        <button class="mentsu-add" onclick="shareMatchResult('${escKey(id)}')">📤 結果をシェア</button>
        ${deleteHtml}
      </div>

}

/* ---- 通算成績 ---- */
// matchHistory中、playerNameが参加していた全対局の全半荘を対象に集計する。
// 「試合数」は半荘数（1半荘あたりの平均収支などと単位を揃えるため）。
function calcCareerStats(matchHistory, playerName){
  // ③: 控え交代で試合途中から/までしか出場していない場合、最終ロースター
  // (settingsSnapshot.playerNames)には名前が残らないことがあるため、
  // 「いずれかの半荘に一度でも登場したか」で対象の対局を絞り込む
  // (実際のカウントは下のhanchansループがhanchanごとに個別判定する)。
  const relevant = matchHistory.filter(m =>
    (m.hanchans || []).some(h => playerName in h.scores));
  if (relevant.length === 0) return null;

  let games = 0, rankSum = 0, top1 = 0, top2 = 0, last = 0, tobiCount = 0, moneySum = 0, maxScore = -Infinity;
  relevant.forEach(m => {
    const s = m.settingsSnapshot;
    const players = s.playerNames.slice(0, s.playerCount);
    const settingsForCalc = { ...s, players };
    m.hanchans.forEach(h => {
      if (!(playerName in h.scores)) return;
      games++;
      // ③: この半荘に実際に参加した人だけを対象にする(現在の/最終的な
      // ロースターではなく、hanchan.scoresのキー=その半荘の実参加者)。
      const hanchanPlayers = Object.keys(h.scores);
      const entries = hanchanPlayers.map(p => ({ name: p, score: h.scores[p] }));
      const ranked = rankPlayers(entries);
      const me = ranked.find(r => r.name === playerName);
      rankSum += (me.loRank + me.hiRank) / 2; // 同着は帯の平均順位として数える
      if (me.loRank === 1) top1++;
      if (me.hiRank <= 2) top2++;
      if (me.hiRank === hanchanPlayers.length) last++;
      if (h.scores[playerName] < 0) tobiCount++;
      if (h.scores[playerName] > maxScore) maxScore = h.scores[playerName];
      // ①: 半荘ごとのルールスナップショットがあればそちらのレートを使う
      // (calcHanchanResult自身もhanchan.rulesSnapshotを優先するため、
      // ここで渡すsettingsForCalcのルール値は「スナップショットが無い
      // 古いデータ」の時だけ実際に使われるフォールバックになる)。
      const { pt } = calcHanchanResult(h, settingsForCalc);
      const rate = (h.rulesSnapshot && h.rulesSnapshot.rate != null) ? h.rulesSnapshot.rate : s.rate;
      moneySum += pt[playerName] * rate;
    });
    moneySum += ((m.chips && m.chips[playerName]) || 0) * s.chipUnitYen;
  });
  if (games === 0) return null;

  return {
    games,
    avgRank: rankSum / games,
    topRate: top1 / games,
    top2Rate: top2 / games,     // 連対率（4人打ち用）
    lastRate: last / games,
    lastAvoidRate: 1 - (last / games), // ラス回避率（3人打ち用）
    maxScore: maxScore === -Infinity ? 0 : maxScore,
    avgMoneyPerHanchan: moneySum / games,
    totalMoney: moneySum,
    tobiCount,
  };
}

// calcCareerStats()の結果1人分を、成績タブの「メンバー構成ごとの成績」
// カードと全く同じ指標・見せ方で描画する共通ヘルパー。playerCountは
// 連対率(4人打ち)/ラス回避率(3人打ち)のどちらの表現を使うかの分岐にのみ使う。
function renderCareerStatCard(name, st, playerCount){
  const primaryLine = playerCount === 4
    ? `<div class="stat-row">連対率 <b>${(st.top2Rate*100).toFixed(0)}%</b></div>`
    : `<div class="stat-row">トップ率 <b>${(st.topRate*100).toFixed(0)}%</b> ／ ラス回避率 <b>${(st.lastAvoidRate*100).toFixed(0)}%</b></div>`;
  const secondaryLine = playerCount === 4
    ? `<div class="stat-row">トップ率 <b>${(st.topRate*100).toFixed(0)}%</b> ／ ラス率 <b>${(st.lastRate*100).toFixed(0)}%</b></div>`
    : `<div class="stat-row">ラス率 <b>${(st.lastRate*100).toFixed(0)}%</b></div>`;
  const moneyColor = v => v >= 0 ? '#9fe0bd' : 'var(--red-soft)';
  return `
    <div class="stat-card">
      <div class="stat-name${premiumNameClass(name)}">${escapeHtml(name)}</div>
      <div class="stat-row">平均順位 <b>${st.avgRank.toFixed(2)}</b></div>
      <div class="stat-row">試合数 <b>${st.games}半荘</b></div>
      ${primaryLine}
      ${secondaryLine}
      <div class="stat-row">MAX得点 <b>${st.maxScore.toLocaleString()}</b></div>
      <div class="stat-row">飛んだ回数 <b>${st.tobiCount}回</b></div>
      <div class="stat-row">平均収支(半荘あたり) <b style="color:${moneyColor(st.avgMoneyPerHanchan)}">${formatMoney(st.avgMoneyPerHanchan)}</b></div>
      <div class="stat-row">通算収支 <b style="color:${moneyColor(st.totalMoney)}">${formatMoney(st.totalMoney)}</b></div>
    </div>`;
}
// 選んだ人が参加した対局の中で最も多い卓の人数(3人打ち/4人打ち)を返す。
// 総成績はメンバー構成を問わず全対局を合算するため、3人打ち・4人打ちが
// 混在している場合に連対率/ラス回避率どちらの表現を使うか決めるために使う
// (多数決。1件も無ければ4人打ちを既定値とする)。
function dominantPlayerCountFor(matchHistory, playerName){
  const counts = {};
  matchHistory.forEach(m => {
    const s = m.settingsSnapshot;
    // ③: 控え交代で最終ロースターに残っていなくても、この対局のどこかの
    // 半荘に実際に参加していれば数える(getAllPlayerNamesEverPlayed参照)。
    if (!s || !(m.hanchans || []).some(h => playerName in h.scores)) return;
    counts[s.playerCount] = (counts[s.playerCount] || 0) + 1;
  });
  const keys = Object.keys(counts);
  if (keys.length === 0) return 4;
  return Number(keys.reduce((a, b) => counts[a] >= counts[b] ? a : b));
}

/* ---- 通算成績(「成績」タブに統合。旧ハンバーガーメニュー「アカウント」) ----
   フレンド・卓の概念とは無関係に、この端末に保存されている対局記録
   (logState.matchHistory)だけを対象にした、プレイヤー1人分の通算成績。
   複数の相手グループを跨いでも「自分がどの順位を何回取ったか」「平均着順が
   どう推移しているか」が分かるようにする。 ---- */

// これまでの全対局に一度でも登場したプレイヤー名を、実際に半荘へ参加した
// 回数が多い順に返す(先頭が「自分」である可能性が最も高い名前になる)。
function getAllPlayerNamesEverPlayed(matchHistory){
  const counts = {};
  matchHistory.forEach(m => {
    // ③: 各半荘の実際の参加者(hanchan.scoresのキー)を直接数える。控え交代で
    // 対局終盤に控えに回り、最終ロースター(settingsSnapshot.playerNames)には
    // 残っていない人も、実際に出場した半荘の分はここに含める。
    (m.hanchans || []).forEach(h => {
      Object.keys(h.scores).forEach(p => { counts[p] = (counts[p] || 0) + 1; });
    });
  });
  return Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
}

const OVERALL_STATS_MOVING_AVG_WINDOW = 10; // 平均着順グラフの移動平均の対象半荘数

// calcOverallStats(matchHistory, playerName) -> プレイヤー1人分の通算成績。
// matchHistoryはstartedAt昇順(=対局が行われた時系列順)に並べ替えてから、
// 各対局のhanchans(こちらも記録された順)を順番に走査し、「このプレイヤーが
// 実際にプレイした半荘」だけを対象に通し番号を振る。
function calcOverallStats(matchHistory, playerName){
  if (!playerName) return null;
  const sorted = [...matchHistory].sort((a, b) =>
    new Date(a.startedAt || a.endedAt || 0) - new Date(b.startedAt || b.endedAt || 0));

  const rankCounts = {}; // { 1: 回数, 2: 回数, ... }
  const series = [];     // [{ index, rank, pc(その半荘の人数), movingAvg }]

  sorted.forEach(m => {
    const s = m.settingsSnapshot;
    if (!s || !Array.isArray(s.playerNames) || !Array.isArray(m.hanchans)) return;
    const players = s.playerNames.slice(0, s.playerCount);
    if (!players.includes(playerName)) return;
    m.hanchans.forEach(h => {
      if (!h || !h.scores || !(playerName in h.scores)) return;
      // 一部のプレイヤーだけ素点が未記録の不完全なデータ(インポート由来等)は
      // 順位判定ができないため、この半荘の集計自体をスキップする。
      if (!players.every(p => typeof h.scores[p] === 'number')) return;
      const entries = players.map(p => ({ name: p, score: h.scores[p] }));
      const ranked = rankPlayers(entries);
      const me = ranked.find(r => r.name === playerName);
      if (!me) return;
      // 順位分布の集計は、既存のcalcCareerStats()のtopRate等と同じく、
      // 同着なら上位側(loRank)のバケットにまとめて数える。
      rankCounts[me.loRank] = (rankCounts[me.loRank] || 0) + 1;
      series.push({
        index: series.length + 1,
        rank: (me.loRank + me.hiRank) / 2, // 平均着順の推移では帯の平均順位を使う
        pc: players.length,
      });
    });
  });

  series.forEach((pt, i) => {
    const from = Math.max(0, i - OVERALL_STATS_MOVING_AVG_WINDOW + 1);
    const windowPts = series.slice(from, i + 1);
    pt.movingAvg = windowPts.reduce((sum, w) => sum + w.rank, 0) / windowPts.length;
  });

  return { totalHanchans: series.length, rankCounts, series };
}

// 1位〜4位の獲得回数を横棒グラフで表示する(3人打ちのみの記録なら4位は0件になる)。
function renderRankBars(stats){
  const rows = [1, 2, 3, 4].map(rank => {
    const count = stats.rankCounts[rank] || 0;
    const pct = stats.totalHanchans > 0 ? (count / stats.totalHanchans) * 100 : 0;
    return `
      <div class="rank-bar-row">
        <span class="rank-bar-label">${rank}位</span>
        <div class="rank-bar-track"><div class="rank-bar-fill rank-bar-${rank}" style="width:${pct.toFixed(1)}%"></div></div>
        <span class="rank-bar-value">${count}回(${pct.toFixed(1)}%)</span>
      </div>`;
  }).join('');
  return `<div class="rank-bars">${rows}</div>`;
}

// 平均着順の推移を折れ線(SVG)で表示する。縦軸は1位を上端、実際に記録の
// あった最大人数(3 or 4)を下端にした反転スケール(=上に行くほど好成績)。
function renderRankTrendChart(series){
  if (series.length === 0) return '';
  const w = 300, h = 150, padL = 24, padR = 10, padT = 10, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const yMax = Math.max(...series.map(p => p.pc || 4), 3);
  const n = series.length;
  const xAt = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const yAt = rank => padT + ((rank - 1) / (yMax - 1)) * plotH;

  const points = series.map((p, i) => `${xAt(i).toFixed(1)},${yAt(p.movingAvg).toFixed(1)}`).join(' ');

  let yTicks = '';
  for (let r = 1; r <= yMax; r++) {
    const yy = yAt(r);
    yTicks += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${w - padR}" y2="${yy.toFixed(1)}" class="chart-gridline" />`;
    yTicks += `<text x="${padL - 4}" y="${(yy + 2.5).toFixed(1)}" class="chart-axis-label" text-anchor="end">${r}位</text>`;
  }
  const dots = series.map((p, i) =>
    `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.movingAvg).toFixed(1)}" r="1.6" class="chart-point" />`).join('');
  const xLabels = `
    <text x="${xAt(0).toFixed(1)}" y="${h - 4}" class="chart-axis-label" text-anchor="start">${series[0].index}半荘目</text>
    ${n > 1 ? `<text x="${xAt(n - 1).toFixed(1)}" y="${h - 4}" class="chart-axis-label" text-anchor="end">${series[n - 1].index}半荘目</text>` : ''}
  `;

  return `
    <div class="rank-trend">
      <div class="rank-trend-title">平均着順の推移<span class="hint">直近${OVERALL_STATS_MOVING_AVG_WINDOW}半荘の移動平均</span></div>
      <svg viewBox="0 0 ${w} ${h}" class="rank-trend-svg" preserveAspectRatio="none">
        ${yTicks}
        <polyline points="${points}" class="chart-line" />
        ${dots}
        ${xLabels}
      </svg>
    </div>`;
}

// 選んだ人の通算成績(総半荘数・順位分布・平均着順の推移)部分のHTML片を返す。
// データが無ければ空文字を返す(呼び出し側で他の内容と合わせて空欄判定する)。
function renderOverallStatsSection(matchHistory, selected){
  const stats = calcOverallStats(matchHistory, selected);
  if (!stats || stats.totalHanchans === 0) return '';
  return `
    <div class="overall-stats-summary">
      <div class="overall-stats-total">総半荘数 <b>${stats.totalHanchans}</b>半荘</div>
      ${renderRankBars(stats)}
    </div>
    ${renderRankTrendChart(stats.series)}
  `;
}

// 成績を見たい人を選ぶUI。タップで開閉するスクロール一覧で、一覧内の項目を
// 直接タップして選択が完結する(候補が1人だけの時は選ぶ意味がないため出さない)。
function renderStatsPlayerPicker(names, selected){
  if (names.length <= 1) return '';
  const open = logState.ui.statsPlayerPickerOpen;
  return `
    <div class="stats-player-picker">
      <button class="stats-player-picker-btn" onclick="toggleStatsPlayerPicker()">
        <span>👤 ${escapeHtml(selected)}さんの成績</span>
        <span class="picker-caret">${open ? '▲' : '▼'}</span>
      </button>
      ${open ? `
        <div class="stats-player-picker-list">
          ${names.map(n => `<button class="stats-player-picker-item ${n === selected ? 'active' : ''}" onclick="setStatsPlayer('${escKey(n)}')">${escapeHtml(n)}</button>`).join('')}
        </div>` : ''}
    </div>`;
}

function renderHistoryStats(){
  const filter = logState.ui.historyFriendFilter;
  const source = filterMatchHistoryByFriend(logState.matchHistory, filter);
  if (source.length === 0) {
    return filter
      ? `<div class="history-empty">${escapeHtml(filter.username)}さんと同卓した対局はまだありません</div>`
      : `<div class="history-empty">まだ成績データがありません<br>対局を終了すると、ここに成績が表示されます</div>`;
  }

  // 成績を見たい人を選ぶ(先頭は最も多く登場した名前=「自分」である可能性が高い)。
  const names = getAllPlayerNamesEverPlayed(source);
  if (names.length === 0) {
    return `<div class="history-empty">まだ成績データがありません<br>対局を終了すると、ここに成績が表示されます</div>`;
  }
  const selected = (logState.ui.statsPlayer && names.includes(logState.ui.statsPlayer))
    ? logState.ui.statsPlayer
    : names[0];
  logState.ui.statsPlayer = selected; // 選んだ結果を覚えておく

  // a) 総成績: メンバー構成を問わず、選んだ人が参加した全対局(このタブに
  //    表示中の範囲=source)を合算する。「メンバー構成ごとの成績」(b)と
  //    全く同じ指標・カード形式(renderCareerStatCard)で表示したうえで、
  //    順位分布・平均着順の推移グラフ(旧ハンバーガーメニュー「アカウント」
  //    タブの内容)も続けて表示する。例外が起きてもb)の表示は道連れにせず、
  //    画面上にも表示する(showDebugError参照)。
  const overallCareer = calcCareerStats(source, selected);
  const overallCardHtml = overallCareer
    ? renderCareerStatCard(selected, overallCareer, dominantPlayerCountFor(source, selected))
    : '';
  let overallChartHtml = '';
  try {
    overallChartHtml = renderOverallStatsSection(source, selected);
  } catch (e) {
    console.error('[renderHistoryStats] renderOverallStatsSection failed:', e);
    showDebugError('成績タブ(総成績)', e);
  }
  const overallHtml = (overallCardHtml || overallChartHtml) ? `
    <div class="stat-group">
      <div class="stat-group-head"><span>🏆 総成績</span><span class="hint">全メンバー構成の合算</span></div>
      ${overallCardHtml ? `<div class="stat-cards">${overallCardHtml}</div>` : ''}
      ${overallChartHtml}
    </div>` : '';

  // b) メンバー構成(参加者の組み合わせ)ごとの成績カード。選んだ人が参加した
  //    対局だけを対象に、組み合わせごとに分けて表示する。
  const groups = {};
  source.forEach(m => {
    const s = m.settingsSnapshot;
    const players = s.playerNames.slice(0, s.playerCount);
    if (!players.includes(selected)) return;
    const key = memberKey(players);
    if (!groups[key]) groups[key] = { players, playerCount: s.playerCount, matches: [] };
    groups[key].matches.push(m);
  });
  const groupList = Object.values(groups).sort((a,b) => b.matches.length - a.matches.length);

  const groupsHtml = groupList.map(g => {
    const totalHanchans = g.matches.reduce((sum,m)=>sum+m.hanchans.length, 0);
    const st = calcCareerStats(g.matches, selected);
    if (!st) return '';
    return `
      <div class="stat-group">
        <div class="stat-group-head"><span>${escapeHtml(g.players.join('・'))}</span><span class="hint">${g.matches.length}対局・${totalHanchans}半荘</span></div>
        <div class="stat-cards">${renderCareerStatCard(selected, st, g.playerCount)}</div>
      </div>`;
  }).join('');

  const picker = renderStatsPlayerPicker(names, selected);
  if (!overallHtml && !groupsHtml) {
    return `${picker}<div class="history-empty">${escapeHtml(selected)}さんの記録がありません</div>`;
  }
  // 総成績(a)を個別対局履歴(b)より上に表示する。
  return `
    ${picker}
    ${overallHtml}
    ${groupsHtml ? `<div class="hint" style="margin:14px 0 8px;font-weight:700;">メンバー構成ごとの成績</div>${groupsHtml}` : ''}
  `;
}

/* ---- エクスポート / インポート / シェア ---- */
async function exportMatchHistory(includeInProgress){
  const payload = {
    exportedAt: new Date().toISOString(),
    appVersion: 'mahjong-score-log-v2',
    matchHistory: logState.matchHistory,
  };
  if (includeInProgress && logState.hanchans.length > 0) {
    payload.inProgress = {
      settings: logState.settings,
      hanchans: logState.hanchans,
      chips: logState.chips,
      startedAt: logState.currentMatchStartedAt,
    };
  }
  const json = JSON.stringify(payload, null, 2);
  const filename = `mahjong-log-${new Date().toISOString().slice(0,10)}.json`;
  const blob = new Blob([json], { type: 'application/json' });

  if (navigator.share && navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: '麻雀対局履歴' });
        return;
      }
    } catch (e) { /* キャンセル・失敗時は下のダウンロードにフォールバック */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function triggerImport(){
  const el = document.getElementById('importFileInput');
  if (el) el.click();
}
function handleImportFile(files){
  const file = files && files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data.matchHistory) ? data.matchHistory
        : Array.isArray(data) ? data : [];
      const existingIds = new Set(logState.matchHistory.map(m => m.id));
      let added = 0, skipped = 0;
      incoming.forEach(m => {
        if (!m || !m.id || !m.settingsSnapshot || !Array.isArray(m.hanchans)) { skipped++; return; }
        if (existingIds.has(m.id)) { skipped++; return; }
        existingIds.add(m.id);
        logState.matchHistory.push(m);
        added++;
      });
      logState.matchHistory.sort((a,b) => new Date(b.endedAt||b.startedAt||0) - new Date(a.endedAt||a.startedAt||0));
      saveLogState();
      logState.ui.importResultMsg = `${added}件を読み込みました${skipped>0?`（${skipped}件は重複・不正な形式のためスキップ）`:''}`;
    } catch (e) {
      logState.ui.importResultMsg = '読み込みに失敗しました。ファイル形式を確認してください。';
    }
    scheduleRenderApp();
  };
  reader.readAsText(file);
  const el = document.getElementById('importFileInput');
  if (el) el.value = '';
}

function buildShareText(players, totals, headerLine){
  const order = [...players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const lines = order.map((p,i) => `${i+1}位 ${p}　${formatMoney(totals.money[p])}`);
  return `${headerLine ? headerLine + '\n\n' : ''}${lines.join('\n')}`;
}
async function shareText(text, title){
  if (navigator.share) {
    try {
      await navigator.share({ text, title: title || '麻雀対局結果' });
      return;
    } catch (e) { /* キャンセル・未対応時は下のフォールバックへ */ }
  }
  try {
    await navigator.clipboard.writeText(text);
    logState.ui.shareFallbackMsg = 'クリップボードにコピーしました';
  } catch (e) {
    logState.ui.shareFallbackMsg = text; // コピーもできない環境ではテキストをそのまま表示する
  }
  scheduleRenderApp();
  setTimeout(() => { logState.ui.shareFallbackMsg = null; scheduleRenderApp(); }, 4000);
}
function shareCurrentResult(){
  const s = settingsWithPlayers();
  const totals = calcTotals(logState.hanchans, logState.chips, s);
  const order = [...s.players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const header = order.length ? `🀄 現在${order[0]}さんがトップ！収支${formatMoney(totals.money[order[0]])}` : '';
  shareText(buildShareText(s.players, totals, header));
}
function shareMatchResult(id){
  const m = logState.matchHistory.find(x => x.id === id);
  if (!m) return;
  const s = m.settingsSnapshot;
  const players = s.playerNames.slice(0, s.playerCount);
  const totals = calcTotals(m.hanchans, m.chips, { ...s, players });
  const order = [...players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const header = order.length ? `🀄 ${order[0]}さん第1位！収支${formatMoney(totals.money[order[0]])}` : '';
  shareText(buildShareText(players, totals, header));
}

async function confirmDeleteAccountFromMenu(){

  logState.ui.deleteAccountErrorMsg = null;
  scheduleRenderApp();
  const result = await CloudSync.deleteAccount();
  logState.ui.deletingAccount = false;

  if (!result.ok && !result.dataDeleted) {
    logState.ui.deleteAccountErrorMsg = result.error === 'reauth'
      ? 'サインイン情報が古くなっている可能性があります。一度ログアウトのうえ再度ログインしてから、もう一度お試しください。'
      : '削除に失敗しました。通信環境をご確認のうえ、もう一度お試しください。';
    scheduleRenderApp();
    return;
  }

  // クラウド側のデータ(ユーザーネーム・フレンド・対局記録)は削除済み。ローカルの
  // アカウント・フレンド・進行中の卓もリセットし、次回から新しい匿名アカウントとして

  logState.account = defaultLogState().account;

  logState.room = null;

  logState.ui.accountModalOpen = false;
  saveLogState();
  scheduleRenderApp();
  CloudSync.init(); // 新しい匿名アカウントとして再初期化

  if (result.error === 'auth') {
    // Firestore側のデータは削除済みだが、Authユーザー自体の削除には失敗している
    // (多くはFirebaseの「最近のログインが必要」制約による)。致命的ではないので
    // トーストで案内するのみに留める。
    logState.ui.notifyBanner = 'データは削除されましたが、サインイン情報の削除には失敗しました(お手数ですが再度ログインのうえお試しください)';

// この端末上のログインセッションをサインアウトし、ローカルのaccount/friends/
// roomをリセットして、新しい匿名アカウントとして再初期化するだけ。
async function debugSignOut(){
  try {
    const Auth = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseAuthentication;
    if (Auth && Auth.signOut) {
      await Auth.signOut();
    }
  } catch (e) {
    showDebugError('デバッグ:サインアウト', e);

  logState.account = defaultLogState().account;
  logState.friends = [];
  logState.room = null;

  logState.ui.notifyBanner = 'デバッグ:サインアウトしました。新しい匿名アカウントとして再初期化します。';

  scheduleRenderApp();

/* ---- 受け取ったリンク(?token=)の確認モーダル(同じく.history-modalを流用) ---- */
function renderClaimModal(){
  const root = document.getElementById('claimModalRoot');
  if (!root) return;
  if (!logState.ui.claimOpen) { root.innerHTML = ''; return; }
  const busy = logState.ui.claimBusy;
  const data = logState.ui.claimData;
  const err = logState.ui.claimError;
  const done = logState.ui.claimDone;

  let bodyHtml;
  if (done) {
    bodyHtml = `
      <div class="check-banner ok" style="margin-bottom:10px;">✓ 受け取りました</div>
      <p class="paywall-copy">この対局結果を、あなたの成績・対局履歴に反映しました。</p>
      <button class="record-btn" style="width:100%;" onclick="closeClaimFlow()">閉じる</button>`;
  } else if (err) {
    bodyHtml = `
      <div class="check-banner bad" style="margin-bottom:10px;">${escapeHtml(err)}</div>
      <button class="mentsu-add" onclick="closeClaimFlow()">閉じる</button>`;
  } else if (busy || !data) {
    bodyHtml = `<p class="paywall-copy">確認しています…</p>`;
  } else {
    const md = data.matchData;
    const dateLabel = md ? formatMatchDate(md.startedAt, md.endedAt) : '';
    bodyHtml = `
      <p class="paywall-copy">この対局結果はあなた(${escapeHtml(data.playerSlot)}さん)のものです。受け取りますか？</p>
      ${dateLabel ? `<div class="history-detail-meta">${dateLabel}</div>` : ''}
      <div class="end-match-confirm-btns" style="margin-top:12px;">
        <button class="preset-btn" onclick="closeClaimFlow()" ${busy?'disabled':''}>キャンセル</button>
        <button class="preset-btn" onclick="requestClaimMatch()" ${busy?'disabled':''}>${busy?'受け取り中…':'受け取る'}</button>
      </div>`;
  }

  root.innerHTML = `
    <div class="history-modal-overlay">
      <div class="history-modal">
        <div class="history-modal-head">
          <span class="history-modal-title">対局結果の受け取り</span>
          <button class="history-close" onclick="closeClaimFlow()">×</button>
        </div>
        <div class="history-modal-body">${bodyHtml}</div>
      </div>
    </div>`;
}

/* ---- top-level bootstrap ---- */
// テキスト入力のonchange（blur）と、別のボタンへのタップは同じ一連の操作の中で
// 同期的に発火する。renderApp()をその場で同期実行すると、タップ先のボタンごと
// DOMを作り直してしまい、直後に来るはずのクリックイベントが宛先を失って
// 消えてしまう（＝名前変更などの直後だけ他の項目が反応しなくなる不具合の原因）。
// 1フレーム分だけ描画を遅らせることで、先に来ているクリックを本来のボタンで
// 処理させてから、最新のstateで安全に描画し直す。
// (_renderAppQueued/_renderAppCallbacks自体の宣言はスクリプト先頭に移動済み。
// showDebugError()経由でNative.initAds()/initBilling()等の起動直後の処理から
// scheduleRenderApp()が呼ばれることがあり、let宣言がここにあると、その時点では
// まだ未初期化(TDZ)でReferenceErrorになっていたため。)
function scheduleRenderApp(afterRender){
  if (afterRender) _renderAppCallbacks.push(afterRender);
  if (_renderAppQueued) return;
  _renderAppQueued = true;
  requestAnimationFrame(() => {
    _renderAppQueued = false;
    renderApp();
    const cbs = _renderAppCallbacks.splice(0);
    cbs.forEach(cb => cb());
  });
}
// renderApp()内の各描画処理を個別のtry-catchで囲む。1つの関数が例外を
// 投げても、他のモーダル・タブの描画は独立して続行できるようにするため
// (例えば得点記録タブの描画が壊れても、ハンバーガーメニューやペイウォール
// といった他のUIは正常に操作できる状態を保つ)。tabElementIdを渡した場合、
// 失敗時にそのタブの中身を「エラーが発生しました」という最低限のメッセージに
// 差し替える(壊れかけの内容が中途半端に残ったまま・完全な空白のまま、には
// しない)。
function safeRender(fn, label, tabElementId){
  try {
    fn();
  } catch (e) {
    console.error(`[${label}] render error:`, e);
    try { showDebugError(`${label} 描画エラー`, e); } catch (e2) {}
    if (tabElementId) {
      try {
        const el = document.getElementById(tabElementId);
        if (el) el.innerHTML = `<div class="check-banner bad" style="margin:16px;">⚠️ この画面の表示中にエラーが発生しました。お手数ですが、操作をやり直すか、アプリを再起動してください。詳細は上のデバッグ表示をご確認ください。</div>`;
      } catch (e3) {}
    }
  }
}
// renderApp()自体がここより先で例外を投げ、上記のsafeRenderでも拾いきれない
// (例: appTitle/bottomNav等、タブの外側の共通要素を書き換える箇所での失敗)
// ような、最も致命的なケース向けの最終防衛ライン。renderApp()を呼び直すと
// 同じ原因で無限ループしかねないため、renderFatalErrorFallbackは
// scheduleRenderApp/renderAppを一切経由せず直接DOMを書き換える。
let _renderAppCrashed = false;
function renderApp(){
  if (_renderAppCrashed) return; // 既に致命的エラーで停止済みなら何もしない(無限ループ防止)
  try {
    renderAppInner();
  } catch (e) {
    _renderAppCrashed = true;
    console.error('[renderApp] fatal error:', e);
    renderFatalErrorFallback(e);
  }
}
function renderFatalErrorFallback(e){
  const root = document.getElementById('fatalErrorRoot');
  if (!root) return;
  let detail;
  try { detail = formatErrorForDisplay(e); } catch (e2) { detail = String(e); }
  root.innerHTML = `
    <div class="fatal-error-overlay">
      <div class="fatal-error-box">
        <div class="fatal-error-title">⚠️ エラーが発生しました</div>
        <div class="fatal-error-msg">画面の再描画中に問題が発生し、続行できなくなりました。お手数ですが、下のボタンから再読み込みしてください。</div>
        <div class="fatal-error-detail">${escapeHtml(detail)}</div>
        <button class="record-btn" style="width:100%;" onclick="location.reload()">再読み込み</button>
      </div>
    </div>`;
}
function renderAppInner(){
  const onLog = logState._activeTab === 'log';
  document.getElementById('appTitle').innerHTML = onLog
    ? '<span class="tile">📋</span>得点記録票'
    : '<span class="tile">🀄</span>麻雀点数電卓';
  document.getElementById('calcTab').style.display = onLog ? 'none' : '';
  document.getElementById('logTab').style.display = onLog ? '' : 'none';
  // 対局履歴(☰)は「使い方」「その他」「アカウント」等も含む導線になったため、
  // タブに関わらず常に表示する(アカウント項目自体は、対局履歴モーダル内の
  // renderHistoryActionBar()側でストアアプリの中でのみ表示するよう制御する)。
  document.getElementById('historyMenuBtn').style.display = '';
  document.getElementById('bottomNav').innerHTML = `
    <button class="${onLog?'':'active'}" onclick="setActiveTab('calc')"><span class="ic">🀄</span>点数計算</button>
    <button class="${onLog?'active':''}" onclick="setActiveTab('log')"><span class="ic">📋</span>得点記録</button>
  `;
  safeRender(() => { if (onLog) renderLog(); else render(); }, onLog ? 'renderLog' : 'render', onLog ? 'logTab' : 'calcTab');
  safeRender(renderHistoryModal, 'renderHistoryModal');
  safeRender(renderPaywallModal, 'renderPaywallModal');
  safeRender(renderTiebreakDealerModal, 'renderTiebreakDealerModal');
  safeRender(renderAccountModal, 'renderAccountModal');
  safeRender(renderFriendPickerModal, 'renderFriendPickerModal');
  safeRender(renderLoginPromptModal, 'renderLoginPromptModal');
  safeRender(renderFriendsListModal, 'renderFriendsListModal');
  safeRender(renderAddFriendModal, 'renderAddFriendModal');
  safeRender(renderHelpModal, 'renderHelpModal');
  safeRender(renderOtherModal, 'renderOtherModal');
  safeRender(renderHistoryLinkShareModal, 'renderHistoryLinkShareModal');
  safeRender(renderClaimModal, 'renderClaimModal');
  safeRender(renderPresetMenuModal, 'renderPresetMenuModal');
  safeRender(renderPresetNameModal, 'renderPresetNameModal');
  safeRender(renderDeletePresetConfirmModal, 'renderDeletePresetConfirmModal');
  safeRender(renderSubstituteModal, 'renderSubstituteModal');
  safeRender(renderNotifyBanner, 'renderNotifyBanner');
  safeRender(renderDebugError, 'renderDebugError');
  safeRender(() => updateBannerState(onLog), 'updateBannerState');
}

// バナー広告(ネイティブのオーバーレイビュー)の表示/非表示を、得点記録票タブに
// いるか・モーダルが開いていないか・購入済みでないかに応じて切り替える。
// 状態が変わった時だけNative.showBanner/hideBannerを呼び、無駄な呼び出しを避ける。
let _bannerShown = false;       // Native.showBanner()を呼んで表示を試みている状態か
// 実際にバナー広告がロードされ表示されているか(Native.initAds()内の
// bannerAdLoaded/bannerAdFailedToLoadリスナーが更新する)。レイアウトの
// 余白(ad-banner-active/with-ad-bannerクラス)は「表示を試みたか」ではなく
// こちらで判断する。オフライン・広告在庫切れ等でロードに失敗した状態で
// CSS側だけ余白を確保すると、その余白に何も表示されない「隙間」が
// トグルバーの下にできてしまうため。
let _bannerAdLoaded = false;
function updateBannerState(onLog){
  const modalOpen = logState.ui.historyOpen || logState.ui.paywallOpen
    || logState.ui.accountModalOpen || logState.ui.friendPickerOpen
    || logState.ui.loginPromptOpen || logState.ui.friendsListOpen
    || logState.ui.addFriendOpen || logState.ui.helpOpen || logState.ui.otherMenuOpen
    || logState.ui.tiebreakDealerOpen;
  const shouldShow = Native.isNativeApp() && onLog && !modalOpen && !isPremiumUnlocked();
  const showSpacer = shouldShow && _bannerAdLoaded;
  document.body.classList.toggle('ad-banner-active', showSpacer);
  const nav = document.getElementById('bottomNav');
  if (nav) nav.classList.toggle('with-ad-banner', showSpacer);
  if (shouldShow && !_bannerShown) { _bannerShown = true; Native.showBanner(); }
  else if (!shouldShow && _bannerShown) {
    _bannerShown = false;
    _bannerAdLoaded = false;
    document.documentElement.style.removeProperty('--ad-banner-height'); // 次回表示時はフォールバック値に戻す
    Native.hideBanner();
  }
}

// 自分以外の操作で対局記録が自動追加された時の簡易通知トースト。
// 金額・詳細成績は含めない(ロック画面等で収支が見えてしまうのを避けるため)。
function renderNotifyBanner(){
  const root = document.getElementById('notifyBannerRoot');
  if (!root) return;
  if (!logState.ui.notifyBanner) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="share-fallback-toast" onclick="dismissNotifyBanner()">🔔 ${escapeHtml(logState.ui.notifyBanner)}</div>`;
}

renderApp();
</script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
