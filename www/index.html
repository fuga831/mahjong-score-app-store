  async initBilling(){
    if (!this.isNativeApp() || _billingReady) return;
    try {
      const store = window.CdvPurchase && window.CdvPurchase.store;
      if (!store) {
        // cordova-plugin-purchaseはCapacitorプラグインではなくCordovaプラグイン
        // なので、window.Capacitor.Plugins一覧には元々現れない(Cordova互換層
        // 経由でwindow.CdvPurchaseとしてグローバルに公開される設計)。そのため
        // ここでの「見つからない」はwindow.CdvPurchase自体の有無、および
        // cordovaPluginListInfo()(cordova_plugins.js由来の登録済み一覧)で判定する。
        showDebugError('課金初期化 (initBilling)', `window.CdvPurchase.storeが見つかりません(window.CdvPurchase=${!!window.CdvPurchase})。${cordovaPluginListInfo()}`);
        return;
      }
      _billingReady = true;
      const storePlatform = capacitorPlatform() === 'ios' ? store.APPLE_APPSTORE : store.GOOGLE_PLAY;
      store.register([{
        id: MONETIZATION_CONFIG.billingProductId,
        type: store.NON_CONSUMABLE,
        platform: storePlatform,
      }]);
      store.when().approved(transaction => { _traceBilling('approved'); transaction.verify(); });
      store.when().verified(receipt => { _traceBilling('verified'); receipt.finish(); });
      // レシートのサーバー側検証(verify())が失敗した場合はverifiedではなく
      // こちらに来る。When型にはerror()というチェーンメソッド自体が存在しない
      // (store.error()が唯一のグローバルエラーハンドラ)ため、検証失敗はここで拾う。
      store.when().unverified(receipt => {
        _traceBilling('unverified');
        const payload = receipt && receipt.payload; // Validator.Response.ErrorPayload: { ok:false, status, code, message, data }
        showDebugError('課金レシート検証失敗 (unverified)', payload
          ? { code: payload.code, message: `status:${payload.status} ${payload.message || ''}` }
          : receipt);
      });
      store.when().productUpdated(() => {
        const product = store.get(MONETIZATION_CONFIG.billingProductId);
        const owned = !!(product && product.owned);
        _traceBilling(`productUpdated (owned=${owned})`);
        const wasPremium = logState.settings.isPremium;
        if (owned && !wasPremium) {
          logState.settings.isPremium = true;
          saveLogState();
          Native.hideBanner();
          CloudSync.syncPremiumStatus(); // フレンドの表示名を金色にする機能・無料枠判定用
          scheduleRenderApp();
        }
        if (owned) {
          // purchasePremium()が待機中(60秒のタイムアウト前)ならここで解決される。
          const hadPendingResolver = _pendingPurchaseResolvers.length > 0;
          _resolvePendingPurchase(true);
          // 待機中の呼び出しが無いのにowned=trueで届いた場合、それは
          // 「タイムアウト後に遅れて届いたイベント」か「アプリ再起動後の
          // 初回同期」のいずれか。前者(!wasPremiumから今回trueになった)の
          // 場合だけ、ペイウォールが開いたままなら自動で閉じてユーザーに
          // 知らせる(「失敗しました」の表示のまま放置しない)。
          if (!hadPendingResolver && !wasPremium) {
            logState.ui.paywallErrorMsg = null;
            if (logState.ui.paywallOpen) {
              const pendingSource = logState.ui.paywallSource;
              logState.ui.paywallOpen = false;
              logState.ui.paywallSource = null;
              logState.ui.paywallPurchasing = false;
              if (pendingSource === 'archive') archiveCurrentMatch();
            }
            logState.ui.notifyBanner = '購入が反映されました。プレミアム会員になりました🎉';
            scheduleRenderApp();
          }
        }
      });
      // store.order()の失敗など、個別のPromiseの拒否に現れない
      // ストア側の非同期エラー(通信エラー・設定不備等)を拾うためのハンドラ。
      if (store.error) {
        store.error(err => showDebugError('課金ストアエラー (store.error)', err));
      }
      // ⚠️ store.Platform.APPLE_APPSTORE / store.ProductType.NON_CONSUMABLE のように
      // Platform/ProductTypeをネストしたプロパティとして参照しないこと。実機で
      // 「undefined is not an object (evaluating 'store.Platform.APPLE_APPSTORE')」
      // というエラーが発生することを確認した。実際にインストールされている
      // cordova-plugin-purchase 13.18.0 のnode_modules/cordova-plugin-purchase/
      // www/store.js を直接確認したところ、Platform/ProductType/ErrorCode/LogLevel
      // の各enumはstoreインスタンスに `store.Platform = {...}` という形では
      // 一切アタッチされておらず、代わりに initCDVPurchase() 内の
      // `Object.assign(window.CdvPurchase.store, CdvPurchase.LogLevel,
      // CdvPurchase.ProductType, CdvPurchase.ErrorCode, CdvPurchase.Platform)`
      // により、各enumのメンバー(APPLE_APPSTORE, GOOGLE_PLAY, NON_CONSUMABLE等)が
      // storeインスタンス自身にフラットに展開される(「後方互換性のため」との
      // コメントあり)。公式READMEのサンプルコードも `CdvPurchase.Platform.
      // APPLE_APPSTORE`(CdvPurchaseの名前空間経由)であり、`store.Platform.*`
      // という書き方はこのバージョンには存在しない。正しくは store.APPLE_APPSTORE
      // / store.GOOGLE_PLAY / store.NON_CONSUMABLE のようにstore自身に
      // フラットなプロパティとして参照する。
      await store.initialize([storePlatform]);
      // store.initialize()が解決しても、商品の詳細(価格・オファー)が
      // ストアから取得済みとは限らない(それはproductUpdatedイベントで
      // 非同期に届く)。ここで一度状態を確認し、オファーがまだ無ければ
      // その理由(canPurchase/valid/state)を表示する。
      const product = store.get(MONETIZATION_CONFIG.billingProductId);
      if (!product) {
        showDebugError('課金初期化 (initBilling)', `store.register()後もstore.get('${MONETIZATION_CONFIG.billingProductId}')がnullです。プロダクトIDがストア側(App Store Connect/Play Console)の設定と一致していない可能性があります。`);
      } else if (!product.getOffer || !product.getOffer()) {
        showDebugError('課金初期化 (initBilling)', `商品「${MONETIZATION_CONFIG.billingProductId}」は登録されていますが、オファー(価格情報)がまだ取得できていません。canPurchase=${product.canPurchase}, valid=${product.valid}, state=${product.state}, offers件数=${(product.offers||[]).length}`);
      }
    } catch (e) { showDebugError('課金初期化 (initBilling)', e); }
  },
  // 戻り値: true(有効な購入あり) / false(購入なし) / null(判定できなかった＝
  // 非ネイティブ環境か通信エラー等。呼び出し側は既存のisPremium値を維持すること)。
  async restorePurchases(){
    if (!this.isNativeApp()) return null;
    try {
      const store = window.CdvPurchase && window.CdvPurchase.store;
      if (!store) {
        showDebugError('購入情報の復元 (restorePurchases)', `window.CdvPurchase.storeが見つかりません(window.CdvPurchase=${!!window.CdvPurchase})。${cordovaPluginListInfo()}`);
        return null;
      }
      await this.initBilling();
      await store.restorePurchases();
      const product = store.get(MONETIZATION_CONFIG.billingProductId);
      return !!(product && product.owned);
    } catch (e) {
      showDebugError('購入情報の復元 (restorePurchases)', e);
      return null;
    }
  },
  // 戻り値: { success: true } | { success: false, reason: 'not_native'|'error'|'timeout' }
  //   'timeout'は「決済自体は成立しているがイベント受信が遅れているだけ」の
  //   可能性が高いケース(実機で確認済み)。呼び出し側は'error'と区別して、
  //   失敗を断定しない文言を出すこと。タイムアウト後もstore.when().productUpdated()
  //   は生き続けており、遅れて届けば自動的にisPremiumへ反映される。
  async purchasePremium(){
    if (!this.isNativeApp()) return { success: false, reason: 'not_native' };
    try {
      const store = window.CdvPurchase && window.CdvPurchase.store;
      if (!store) {
        showDebugError('購入 (purchasePremium)', `window.CdvPurchase.storeが見つかりません(window.CdvPurchase=${!!window.CdvPurchase})。${cordovaPluginListInfo()}`);
        return { success: false, reason: 'error' };
      }
      await this.initBilling();
      const product = store.get(MONETIZATION_CONFIG.billingProductId);
      const offer = product && product.getOffer && product.getOffer();
      if (!offer) {
        showDebugError('購入 (purchasePremium)', `商品「${MONETIZATION_CONFIG.billingProductId}」の購入可能なオファーが見つかりません。product=${product ? `{valid:${product.valid}, canPurchase:${product.canPurchase}, state:${product.state}, offers件数:${(product.offers||[]).length}}` : 'null'}`);
        return { success: false, reason: 'error' };
      }
      _billingTraceLog = [];
      _billingTraceStart = Date.now();
      _traceBilling('order() 呼び出し開始');
      const resultPromise = new Promise(resolve => {
        _pendingPurchaseResolvers.push(resolve);
        // PURCHASE_TIMEOUT_MS経ってもイベントが来なければUI上は諦める
        // (ユーザーがストアのダイアログをキャンセルした場合など、approved
        // イベントが永遠に来ないケースの保険)。ただしこのタイムアウトは
        // あくまで「これ以上UIを待たせない」ためのものであり、
        // store.when().productUpdated()自体はこの後も生き続けて監視を
        // 継続する(実機で、ストア側は成立しているのにイベント受信だけ
        // 60秒以上遅れるケースを確認したため)。
        setTimeout(() => {
          _pendingPurchaseResolvers = _pendingPurchaseResolvers.filter(r => r !== resolve);
          showDebugError('購入 (purchasePremium)', `${PURCHASE_TIMEOUT_MS / 1000}秒待ってもapproved/verifiedイベントが届きませんでした(ストアの購入ダイアログをキャンセルした場合も含みます)。決済自体は完了しており受信が遅延しているだけの可能性があるため、監視は継続します(遅れて届けば自動的にプレミアム状態へ反映されます)。\n\nイベント受信ログ:\n${_formatBillingTrace()}`);
          resolve(false);
        }, PURCHASE_TIMEOUT_MS);
      });
      await offer.order();
      const ok = await resultPromise;
      return ok ? { success: true } : { success: false, reason: 'timeout' };
    } catch (e) {
      showDebugError('購入 (purchasePremium)', e);
      return { success: false, reason: 'error' };
    }
  },
  getPriceLabel(){
    try {
      const store = window.CdvPurchase && window.CdvPurchase.store;
      const product = store && store.get(MONETIZATION_CONFIG.billingProductId);
      const offer = product && product.getOffer && product.getOffer();
      return (offer && offer.pricing && offer.pricing.price) || MONETIZATION_CONFIG.fallbackPriceLabel;
    } catch (e) { return MONETIZATION_CONFIG.fallbackPriceLabel; }
  },
};

// ストアアプリ以外(このプレビューや素のブラウザ・GitHub Pages版)では常にtrue、
// つまり「常に無制限・広告なし」を返す。ユーザーの指示により、広告/課金/対局数
// 制限はCapacitorでラップしたストア配信版アプリの中だけに適用するため。
function isPremiumUnlocked(){
  if (!Native.isNativeApp()) return true;
  return !!logState.settings.isPremium;
}

// プレイヤー名の表示を金色にするかどうかの判定。ゲスト(participantLinksに
// 紐付けが無い=ユーザーネームを指定していない)は対象外。自分自身は
// logState.settings.isPremium(実際の購入フラグ。isPremiumUnlocked()は
// 非ネイティブ環境で常にtrueを返してしまうため、ここでは使わない)を、
// フレンドはrefreshFriends()で同期済みのfriends[].isPremiumキャッシュを見る。
// participantLinksを省略した場合は現在編集中の対局(logState.settings)を見るが、
// 対局履歴の表示では、その対局が終了した時点のsettingsSnapshot.participantLinks
// を明示的に渡す(現在の紐付け状況ではなく、記録時点の紐付けを使うため)。
function isPlayerPremiumDisplay(playerName, participantLinks){
  const links = participantLinks || logState.settings.participantLinks;
  const link = links && links[playerName];
  if (!link || !link.uid) return false;
  if (link.uid === logState.account.uid) return !!logState.settings.isPremium;
  const friend = logState.friends.find(f => f.uid === link.uid);
  return !!(friend && friend.isPremium);
}
function premiumNameClass(playerName, participantLinks){
  return isPlayerPremiumDisplay(playerName, participantLinks) ? ' premium-name' : '';
}

/* =========================================================================
   マルチプレイヤー(フレンド・卓・成績共有) — ネイティブ橋渡し層
   ---------------------------------------------------------------------
   広告・課金のNativeオブジェクトと同じ設計思想: CloudSync.isAvailable()が
   falseの間(=このプレビュー・素のブラウザ・GitHub Pages版)は全メソッドが
   安全にno-opし、これまで通りローカル単独モードのまま動作する。
   「対象: mahjong-score-app(Capacitorラップ版)」という今回の依頼どおり、
   マルチプレイヤー機能もストアアプリの中だけで有効になる。

   @capacitor-firebase/authentication, @capacitor-firebase/firestore,
   @capacitor-firebase/messaging という3つのCapacitorネイティブプラグイン
   (window.Capacitor.Plugins.FirebaseAuthentication / FirebaseFirestore /
   FirebaseMessaging)を呼び出す設計で書いている。これらプラグインのAPI形状は
   公式ドキュメントに基づく著者の知識であり、このサンドボックスにはnpm
   レジストリへのアクセスもiOS/Androidのネイティブビルド環境も無いため、
   実際にインストール・ビルド・実機確認はできていない(前回のcordova-plugin-
   purchase統合と同じ制約)。MULTIPLAYER_SETUP.mdと各プラグインの公式READMEを
   必ず確認してから本番導入すること。
   ========================================================================= */

function normalizeUsername(name){
  return String(name || '').trim().toLowerCase().replace(/\s+/g, '');
}
// 半角英数字・アンダースコア・ひらがな・カタカナ・漢字のみ、3〜20文字。
// 絵文字・制御文字・記号など表示上問題になりうる文字は招待・検索用の
// 識別子として不可とする。
function isValidUsernameFormat(name){
  return /^[a-z0-9_぀-ゟ゠-ヿ㐀-䶿一-鿿]{3,20}$/.test(normalizeUsername(name));
}
// Firebase AuthのlinkWithX()が「その認証情報は既に別アカウントで使用済み」で
// 失敗した場合のエラーコード/メッセージを判定する(iOS/Androidでコードの表記ゆれが
// あるため、code・messageの両方を緩めに(大文字小文字を無視して)見る)。
function _isCredentialAlreadyInUseError(e){
  const code = String((e && e.code) || '').toLowerCase();
  const msg = String((e && e.message) || '').toLowerCase();
  return code.includes('already-in-use') || code.includes('credential_already_in_use')
    || msg.includes('already-in-use') || msg.includes('already in use');
}

/* ---- ゲストプレイヤーへの結果受け取りリンク(Universal Links + claimTokens) ---- */
// GitHub Pagesのdocs/claim.html(アプリ未インストール時のフォールバック用ページ)と
// 同じパスをリンク先にする。Universal Links(applinks:fuga831.github.io、
// ios/App/App/App.entitlements参照)が有効なら、アプリインストール済みの端末では
// Safariを経由せず直接アプリが起動しこのURLをハンドリングする。
const CLAIM_LINK_BASE_URL = 'https://fuga831.github.io/mahjong-score-app-store/claim';
const CLAIM_TOKEN_TTL_MS = 3 * 24 * 60 * 60 * 1000; // 3日間
// トークンは「知っていれば使える」capability URL方式(このアプリの他の識別子と
// 同様、Firestoreルール側でも推測困難性を前提にしている)。Math.random()は
// 暗号論的に安全な乱数ではないため使わず、crypto.getRandomValues/randomUUIDを使う
// (WKWebView・最近のブラウザなら確実に利用可能。念のため最終フォールバックのみ用意)。
function generateClaimToken(){
  try {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
    if (window.crypto && crypto.getRandomValues) {
      const bytes = new Uint8Array(20);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
}

const CloudSync = {
  isAvailable(){
    // 広告/課金と同じく、マルチプレイヤーもストアアプリの中でのみ有効。
    return Native.isNativeApp();
  },

  _authListenerAdded: false,
  _initPromise: null,
  // CloudSync.init()は起動時に発火のみさせて待たない(fire-and-forget)ため、
  // 匿名認証(signInAnonymously)が完了する前にユーザーがユーザーネーム設定
  // などの書き込み操作を行える。その場合 logState.account.uid が未確定のまま
  // Firestoreへ書き込もうとして権限エラーになるため、書き込み系の操作は
  // 呼び出し前に必ずこれを呼び、認証確立を待ってから進めること。
  async ensureSignedIn(){
    if (!this.isAvailable()) return false;
    if (!logState.account.uid && this._initPromise) {
      await this._initPromise.catch(() => {});
    }
    return !!logState.account.uid;
  },
  init(){
    if (!this.isAvailable()) return Promise.resolve();
    this._initPromise = this._doInit();
    return this._initPromise;
  },
  async _doInit(){
    try {
      const Auth = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseAuthentication;
      if (!Auth) return;
      if (!this._authListenerAdded) {
        this._authListenerAdded = true;
        Auth.addListener('authStateChange', (result) => {
          const user = result && result.user;
          if (user) {
            logState.account.uid = user.uid;
            logState.account.isAnonymous = !!user.isAnonymous;
            saveLogState();
          }
        });
      }
      let current = null;
      try { current = await Auth.getCurrentUser(); } catch (e) {}
      if (current && current.user) {
        logState.account.uid = current.user.uid;
        logState.account.isAnonymous = !!current.user.isAnonymous;
      } else {
        // 初回起動時は匿名認証でそのまま使い始められるようにし、ログインを強制しない。
        const signed = await Auth.signInAnonymously();
        const user = signed && signed.user;
        if (user) { logState.account.uid = user.uid; logState.account.isAnonymous = true; }
      }
      saveLogState();
      await this.refreshFriends();
      await this.syncIncomingMatchHistory();
      if (logState.room && logState.room.roomId) {
        this.subscribeRoom(logState.room.roomId);
      } else {
        await this.checkActiveRoomInvite();
      }
    } catch (e) { /* オフライン等では静かに諦め、ローカル単独モードとして動作継続 */ }
  },

  // 匿名のままでは困る操作(フレンド追加・複数端末利用)をしようとしたタイミングで
  // 呼び出す想定。成功時はaccount.isAnonymousがfalseになり、uidは維持される
  // (匿名ユーザーへのプロバイダlinkとして扱われる設計)。
  //
  // ⚠️ ここでは必ずAuth.linkWithGoogle/linkWithApple(既存の匿名ユーザーに認証情報を
  // 「連携」するAPI)を使うこと。以前はAuth.signInWithGoogle/signInWithApple
  // (「新規サインイン」のAPI)を誤って呼んでおり、匿名時代とは別の新しいuidに
  // 切り替わってしまっていた。その結果、匿名時代に既にusernames/{name}や
  // friends/matchHistoryを保存していたユーザーが後からGoogle/Appleでログインすると、
  // それらのドキュメントは古いuidの持ち物のまま取り残され、以降そのドキュメントへの
  // 書き込み・削除がfirestore.rules側のisSelf(uid)チェックに落ちて
  // 「Missing or insufficient permissions」になる実バグの原因だった
  // (アカウント削除時にusernames/{name}のdeleteDocumentが失敗するケースを実機で確認)。
  // linkWithX()は「その認証情報は既に別のFirebaseアカウントで使用済み」の場合にだけ
  // 失敗する(auth/credential-already-in-use等)。機種変更・再インストール後に
  // 元のアカウントへ戻りたいケースはこれに該当するため、その場合のみ
  // signInWithX()にフォールバックし、既存アカウントへ切り替える。
  async linkGoogle(){
    if (!this.isAvailable()) { showDebugError('Googleログイン', 'Native.isAvailable()がfalse(ストアアプリ内ではない、またはCloudSync未初期化)'); return false; }
    try {
      const Auth = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseAuthentication;
      if (!Auth || !Auth.linkWithGoogle || !Auth.signInWithGoogle) {
        const registered = Object.keys((window.Capacitor && window.Capacitor.Plugins) || {}).join(', ') || '(なし)';
        showDebugError('Googleログイン', `FirebaseAuthenticationプラグインが見つかりません(Auth=${!!Auth}, linkWithGoogle=${!!(Auth&&Auth.linkWithGoogle)})。ネイティブ側でプラグインが正しく登録されていない可能性があります。登録済みプラグイン一覧: ${registered}`);
        return false;
      }
      let result;
      try {
        result = await Auth.linkWithGoogle();
      } catch (e) {
        if (_isCredentialAlreadyInUseError(e)) {
          result = await Auth.signInWithGoogle();
          logState.ui.notifyBanner = 'このGoogleアカウントは既に登録済みのため、既存のアカウントにログインしました。';
        } else {
          throw e;
        }
      }
      if (result && result.user) {
        logState.account.uid = result.user.uid;
        logState.account.isAnonymous = false;
        logState.account.linkedProviders.google = true;
        saveLogState();
        return true;
      }
      showDebugError('Googleログイン', `linkWithGoogle()は例外を投げずに完了しましたが、result.userがありません: ${JSON.stringify(result)}`);
      return false;
    } catch (e) {
      console.error('[CloudSync.linkGoogle] failed:', e);
      showDebugError('Googleログイン (linkGoogle)', e);
      return false;
    }
  },
  // App Store Review Guideline 4.8対応: Googleログインを提供する場合、
  // Sign in with Appleも同格の選択肢として必ず用意する。
  async linkApple(){
    if (!this.isAvailable()) { showDebugError('Appleログイン', 'Native.isAvailable()がfalse(ストアアプリ内ではない、またはCloudSync未初期化)'); return false; }
    try {
      const Auth = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseAuthentication;
      if (!Auth || !Auth.linkWithApple || !Auth.signInWithApple) {
        const registered = Object.keys((window.Capacitor && window.Capacitor.Plugins) || {}).join(', ') || '(なし)';
        showDebugError('Appleログイン', `FirebaseAuthenticationプラグインが見つかりません(Auth=${!!Auth}, linkWithApple=${!!(Auth&&Auth.linkWithApple)})。ネイティブ側でプラグインが正しく登録されていない可能性があります。登録済みプラグイン一覧: ${registered}`);
        return false;
      }
      let result;
      try {
        result = await Auth.linkWithApple();
      } catch (e) {
        if (_isCredentialAlreadyInUseError(e)) {
          result = await Auth.signInWithApple();
          logState.ui.notifyBanner = 'このApple IDは既に登録済みのため、既存のアカウントにログインしました。';
        } else {
          throw e;
        }
      }
      if (result && result.user) {
        logState.account.uid = result.user.uid;
        logState.account.isAnonymous = false;
        logState.account.linkedProviders.apple = true;
        saveLogState();
        return true;
      }
      showDebugError('Appleログイン', `linkWithApple()は例外を投げずに完了しましたが、result.userがありません: ${JSON.stringify(result)}`);
      return false;
    } catch (e) {
      console.error('[CloudSync.linkApple] failed:', e);
      showDebugError('Appleログイン (linkApple)', e);
      return false;
    }
  },

  // ユーザーネームは一意。usernames/{normalized}ドキュメントの有無で申請の
  // 成否を判定する(先着順)。変更時、旧ユーザーネームは予約せず即座に解放する
  // (検討の結果、シンプルさを優先する方針で決定)。
  async claimUsername(name){
    if (!this.isAvailable()) return { ok: false, error: 'unavailable' };
    if (!isValidUsernameFormat(name)) return { ok: false, error: 'invalid' };
    // 匿名認証(signInAnonymously)がまだ完了していない状態でFirestoreに
    // 書き込もうとすると、firestore.rules側でrequest.auth.uidが未確定に
    // なり毎回permission-deniedで失敗する。CloudSync.init()の完了を待つ。
    if (!(await this.ensureSignedIn())) return { ok: false, error: 'network' };
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (!Firestore) return { ok: false, error: 'unavailable' };
      const norm = normalizeUsername(name);
      const existing = await Firestore.getDocument({ reference: `usernames/${norm}` }).catch(() => null);
      const existingUid = existing && existing.snapshot && existing.snapshot.data && existing.snapshot.data.uid;
      if (existingUid && existingUid !== logState.account.uid) {
        return { ok: false, error: 'taken' };
      }
      const oldNorm = logState.account.username ? normalizeUsername(logState.account.username) : null;
      await Firestore.setDocument({ reference: `usernames/${norm}`, data: { uid: logState.account.uid } });
      await Firestore.setDocument({ reference: `users/${logState.account.uid}`, data: { username: name }, merge: true });
      if (oldNorm && oldNorm !== norm) {
        await Firestore.deleteDocument({ reference: `usernames/${oldNorm}` }).catch(() => {});
      }
      logState.account.username = name;
      saveLogState();
      return { ok: true };
    } catch (e) {
      // 汎用メッセージだけだと実機での原因調査ができないため、実際のエラー
      // (Firestoreの場合は e.code に 'permission-denied' 等が入る)を
      // console.errorだけでなく画面上にも表示する(Xcode接続できない環境向け)。
      console.error('[CloudSync.claimUsername] failed:', e && (e.code || e.message || e));
      showDebugError('ユーザーネーム設定 (claimUsername)', e);
      return { ok: false, error: 'network' };
    }
  },

  async searchUsername(name){
    if (!this.isAvailable()) return null;
    if (!isValidUsernameFormat(name)) return null;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const norm = normalizeUsername(name);
      const doc = await Firestore.getDocument({ reference: `usernames/${norm}` });
      const uid = doc && doc.snapshot && doc.snapshot.data && doc.snapshot.data.uid;
      if (!uid) return null;
      if (uid === logState.account.uid) return { uid, username: name, isSelf: true };
      const userDoc = await Firestore.getDocument({ reference: `users/${uid}` });
      const username = userDoc && userDoc.snapshot && userDoc.snapshot.data && userDoc.snapshot.data.username;
      return { uid, username: username || name };
    } catch (e) { return null; }
  },

  // 同卓に指定した瞬間、確認フローなしで即座にフレンド関係になる(初対面でも)。
  async addFriend(uid, username){
    if (!this.isAvailable() || !uid) return false;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      await Firestore.setDocument({ reference: `users/${logState.account.uid}/friends/${uid}`, data: { uid, username, addedAt: Date.now() } });
      if (!logState.friends.some(f => f.uid === uid)) {
        logState.friends.push({ uid, username });
        saveLogState();
      }
      return true;
    } catch (e) { return false; }
  },
  async removeFriend(uid){
    if (!this.isAvailable() || !uid) return false;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      await Firestore.deleteDocument({ reference: `users/${logState.account.uid}/friends/${uid}` });
      logState.friends = logState.friends.filter(f => f.uid !== uid);
      saveLogState();
      return true;
    } catch (e) { return false; }
  },
  async refreshFriends(){
    if (!this.isAvailable()) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const res = await Firestore.getCollection({ reference: `users/${logState.account.uid}/friends` });
      const docs = (res && res.snapshots) || [];
      const friends = docs.map(d => d.data);
      // 各フレンドの現在の課金状態(users/{uid}.isPremium、syncPremiumStatus()参照)も
      // 合わせて取得しておく。プレイヤー名を金色にする判定(premiumNameClass)で、
      // 自分以外(フレンド)の課金状態を都度Firestoreへ問い合わせずに参照できるようにする
      // ため。friendsドキュメント自体には保存しない(常に最新のusers/{uid}を正とする)。
      await Promise.all(friends.map(async f => {
        try {
          const doc = await Firestore.getDocument({ reference: `users/${f.uid}` });
          f.isPremium = !!(doc && doc.snapshot && doc.snapshot.data && doc.snapshot.data.isPremium);
        } catch (e) { f.isPremium = false; }
      }));
      logState.friends = friends;
      saveLogState();
    } catch (e) { /* オフライン時はローカルキャッシュのfriendsをそのまま使う */ }
  },
  // 自分のisPremiumをusers/{uid}へ同期する。firestore.rulesの無料枠判定
  // (get(users/{uid}).data.isPremium、archiveMatchFanout参照)や、フレンドの
  // 表示名を金色にする機能(refreshFriends参照)から参照できるようにするため。
  // 失敗しても致命的ではないのでベストエフォート(次回同期のタイミングで揃う)。
  async syncPremiumStatus(){
    if (!this.isAvailable() || !logState.account.uid) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (!Firestore) return;
      await Firestore.setDocument({
        reference: `users/${logState.account.uid}`,
        data: { isPremium: !!logState.settings.isPremium },
        merge: true,
      });
    } catch (e) { /* オフライン等は無視 */ }
  },

  // ---- ゲストプレイヤーへの結果受け取りリンク ----
  // 対局履歴の詳細画面で、ゲスト(participantLinks未紐付け)のプレイヤー枠に対して
  // 「リンクを送る」を選んだ時に呼ぶ。その対局・その枠専用の使い捨てトークンを
  // 発行する。matchDataをトークン自身に複製して持たせておくことで、受け取り側は
  // 「トークンを知っている」だけでmatchHistoryドキュメント本体(host本人にしか
  // 読み取り権限が無い)を経由せずに内容を確認できる(claimTokens/{token}の
  // allow get: if isSignedIn(); というシンプルなルールで完結させるための設計。
  // トークン自体が推測困難な乱数文字列であることが実質的なアクセス制御になる)。
  async createClaimToken(matchId, playerSlot){
    if (!this.isAvailable()) return { ok: false };
    if (!(await this.ensureSignedIn())) return { ok: false };
    const m = logState.matchHistory.find(x => x.id === matchId);
    if (!m) return { ok: false };
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (!Firestore) return { ok: false };
      const token = generateClaimToken();
      const now = Date.now();
      await Firestore.setDocument({
        reference: `claimTokens/${token}`,
        data: {
          matchId, playerSlot, token,
          hostUid: logState.account.uid,
          createdAt: now,
          expiresAt: now + CLAIM_TOKEN_TTL_MS,
          used: false,
          usedBy: null,
          matchData: {
            id: m.id,
            startedAt: m.startedAt,
            endedAt: m.endedAt,
            title: m.title || '',
            settingsSnapshot: m.settingsSnapshot,
            hanchans: m.hanchans,
            chips: m.chips,
            participantUids: m.participantUids || [],
          },
        },
      });
      return { ok: true, token };
    } catch (e) {
      showDebugError('結果受け取りリンクの作成 (createClaimToken)', e);
      return { ok: false };
    }
  },
  // 受け取り確認画面を開く時に、トークンの中身(有効期限・使用済みかどうか含む)を
  // 取得する。有効期限切れ・使用済みの判定はここでクライアント側でも行うが、
  // 実際にclaimする書き込み時にはfirestore.rules側でも同じ条件を再検証する
  // (クライアント側の判定はあくまでUI表示用で、最終的な可否はルール側が決める)。
  async fetchClaimToken(token){
    if (!this.isAvailable()) return { ok: false, error: 'unavailable' };
    if (!(await this.ensureSignedIn())) return { ok: false, error: 'unavailable' };
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (!Firestore) return { ok: false, error: 'unavailable' };
      const doc = await Firestore.getDocument({ reference: `claimTokens/${token}` });
      const data = doc && doc.snapshot && doc.snapshot.data;
      if (!data) return { ok: false, error: 'notfound' };
      if (data.used) return { ok: false, error: 'used' };
      if (data.expiresAt && Date.now() > data.expiresAt) return { ok: false, error: 'expired' };
      return { ok: true, data };
    } catch (e) {
      showDebugError('結果受け取りリンクの確認 (fetchClaimToken)', e);
      return { ok: false, error: 'network' };
    }
  },
  // 「受け取る」を確定する。自分のmatchHistoryへ複製を保存し、トークンを
  // 使用済みにする(この2つの書き込みはトランザクションではないため、間に
  // 通信断が挟まると理論上どちらか片方だけ成功する可能性があるが、その場合も
  // 実害は「もう一度リンクを開けば良いだけ」に留まる設計にしてある:
  // matchHistory側は既に自分の記録として存在するので何も起きず、トークン側は
  // used化されていなければ再度この関数が最初からやり直せる)。
  async claimMatchToken(token, tokenData){
    if (!this.isAvailable() || !logState.account.uid) return { ok: false };
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (!Firestore) return { ok: false };
      const myUid = logState.account.uid;
      const md = tokenData.matchData;
      const entry = {
        ...md,
        participantUids: Array.from(new Set([...(md.participantUids || []), myUid])),
        recordedBy: tokenData.hostUid,
        claimToken: token, // firestore.rules側でこのトークンの有効性を検証するために必要
      };
      await Firestore.setDocument({ reference: `users/${myUid}/matchHistory/${md.id}`, data: entry });
      await Firestore.updateDocument({ reference: `claimTokens/${token}`, data: { used: true, usedBy: myUid } });
      delete entry.claimToken; // ローカル保存・表示用のコピーには不要
      return { ok: true, entry };
    } catch (e) {
      showDebugError('結果の受け取り (claimMatchToken)', e);
      return { ok: false };
    }
  },

  // 起動時にクラウド側のmatchHistoryを取り込み、ローカルにまだ無いもの(=自分が
  // オフラインの間に他の代表入力者から自動配信されたもの)があれば追加する。
  // recordedByが自分以外のものは、通知トーストの対象にする(金額・詳細は含めない)。
  async syncIncomingMatchHistory(){
    if (!this.isAvailable()) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const myUid = logState.account.uid;
      const res = await Firestore.getCollection({ reference: `users/${myUid}/matchHistory` });
      const docs = (res && res.snapshots) || [];
      const existingIds = new Set(logState.matchHistory.map(m => m.id));
      const newlyAddedByOthers = [];
      docs.forEach(d => {
        const entry = d.data;
        if (!entry || !entry.id || existingIds.has(entry.id)) return;
        logState.matchHistory.push(entry);
        existingIds.add(entry.id);
        if (entry.recordedBy && entry.recordedBy !== myUid) newlyAddedByOthers.push(entry);
      });
      if (docs.length > 0) {
        logState.matchHistory.sort((a, b) => new Date(b.endedAt || b.startedAt || 0) - new Date(a.endedAt || a.startedAt || 0));
        saveLogState();
      }
      if (newlyAddedByOthers.length > 0 && logState.account.notifyOnAutoRecord) {
        logState.ui.notifyBanner = newlyAddedByOthers.length === 1
          ? '対局記録が追加されました'
          : `対局記録が${newlyAddedByOthers.length}件追加されました`;
      }
    } catch (e) { /* オフライン時はローカルのmatchHistoryのみで継続 */ }
  },

  // 自分が同卓者として指定され、既に進行中の卓があれば(自分がその時アプリを
  // 開いていなくても構わない設計のため)、次に開いた時に見つけて閲覧モードで参加する。
  async checkActiveRoomInvite(){
    if (!this.isAvailable() || logState.room) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const myUid = logState.account.uid;
      const res = await Firestore.getCollection({
        reference: 'rooms',
        compositeFilter: { type: 'and', queryConstraints: [
          { type: 'where', fieldPath: 'participantUids', opStr: 'array-contains', value: myUid },
          { type: 'where', fieldPath: 'status', opStr: '==', value: 'active' },
        ] },
      });
      const docs = (res && res.snapshots) || [];
      if (docs.length === 0) return;
      const roomDoc = docs[0];
      const data = roomDoc.data;
      if (data.hostUid === myUid) return; // 自分がホストの卓は対象外(通常はここに来ない)
      logState.room = { roomId: roomDoc.id, isHost: false, hostUid: data.hostUid, participants: data.participants };
      logState.hanchans = data.hanchans || [];
      logState.chips = data.chips || {};
      logState.ui.revealActive = !!data.revealActive;
      logState.ui.revealStep = data.revealStep || 0;
      logState.ui.revealPeek = !!data.revealPeek;
      saveLogState();
      await this.subscribeRoom(roomDoc.id);
    } catch (e) { /* オフライン時は次回起動時に再試行される */ }
  },

  // participants: [{ slot, uid, name, isGuest }]
  async createRoom(participants){
    if (!this.isAvailable()) return null;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const roomId = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      const participantUids = participants.filter(p => p.uid).map(p => p.uid);
      await Firestore.setDocument({
        reference: `rooms/${roomId}`,
        data: {
          hostUid: logState.account.uid,
          participants, participantUids,
          status: 'active', createdAt: Date.now(),
          settings: logState.settings, hanchans: logState.hanchans, chips: logState.chips,
          revealActive: false, revealStep: 0, revealPeek: false,
        },
      });
      return roomId;
    } catch (e) { return null; }
  },
  // 代表入力者が半荘記録・演出発表するたびに呼ぶ。閲覧者側はsubscribeRoomの
  // コールバックで受け取るだけで、自分では書き込まない(代表入力者は1卓につき1人)。
  async updateRoom(roomId, patch){
    if (!this.isAvailable() || !roomId) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      await Firestore.updateDocument({ reference: `rooms/${roomId}`, data: patch });
    } catch (e) { /* オフライン時は諦める。代表入力者の手元の記録自体は失われない */ }
  },
  _roomListenerId: null,
  async subscribeRoom(roomId){
    if (!this.isAvailable() || !roomId) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (this._roomListenerId) {
        await Firestore.removeSnapshotListener({ callbackId: this._roomListenerId }).catch(() => {});
        this._roomListenerId = null;
      }
      const listener = await Firestore.addDocumentSnapshotListener({ reference: `rooms/${roomId}` }, (event) => {
        if (!event || !event.snapshot || !event.snapshot.data) return;
        if (!logState.room || logState.room.roomId !== roomId) return; // 卓を離れた後の遅延イベントは無視
        const data = event.snapshot.data;
        if (!logState.room.isHost) {
          if (data.status === 'ended') {
            // 代表入力者が対局を終了した。閲覧者側もこの卓から離れ、単独モードに戻る。
            // 自動配信された確定記録は、次のmatchHistory同期(次回起動時など)で届く。
            logState.room = null;
            saveLogState();
            this.leaveRoom();
            this.syncIncomingMatchHistory().then(() => scheduleRenderApp());
            return;
          }
          // 閲覧者は受信データをそのまま反映するのみ(自分では書き込まない)
          logState.hanchans = data.hanchans || [];
          logState.chips = data.chips || {};
          logState.ui.revealActive = !!data.revealActive;
          logState.ui.revealStep = data.revealStep || 0;
          logState.ui.revealPeek = !!data.revealPeek;
        }
        logState.room.participants = data.participants || logState.room.participants;
        scheduleRenderApp();
      });
      this._roomListenerId = listener && listener.callbackId;
    } catch (e) { /* リアルタイム購読に失敗しても、代表入力者側の操作自体は継続できる */ }
  },
  async leaveRoom(){
    if (!this._roomListenerId) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      await Firestore.removeSnapshotListener({ callbackId: this._roomListenerId });
    } catch (e) {}
    this._roomListenerId = null;
  },

  // 代表入力者自身のmatchHistoryへの保存はarchiveCurrentMatch側で既にローカルへ
  // 反映済み。ここでは(1)自分自身のクラウド側への複製と、(2)自分以外の同卓者
  // (uidを持つ人のみ・ゲスト除く)のmatchHistoryへの自動配信を行う。
  // 1人分の書き込み失敗が他の人の保存を妨げないよう、それぞれ独立に試行する。
  async archiveMatchFanout(entry, participantUids){
    if (!this.isAvailable()) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const myUid = logState.account.uid;
      const targets = [myUid, ...participantUids.filter(uid => uid && uid !== myUid)];
      for (const uid of targets) {
        await Firestore.setDocument({
          reference: `users/${uid}/matchHistory/${entry.id}`,
          data: { ...entry, participantUids, recordedBy: myUid },
        }).catch(() => {});
        // 無料枠(累計3対局)のサーバー側カウンタ。各自の`users/{uid}.matchCount`を
        // 正として扱い(端末変更時にリセットされないようにするため)、Firestore
        // ルール側でmatchCount>=3かつisPremiumでない場合は書き込みを拒否する設計
        // (firestore.rules参照)。ここでの読み取り→+1書き戻しは簡易的な実装で、
        // 同時書き込みが重なった場合の競合(race condition)には対応していない。
        // 本番では読み取り→書き込みをFirestoreのトランザクションで包むか、
        // Cloud Function側でトリガー処理する方が安全(MULTIPLAYER_SETUP.md参照)。
        try {
          const userDoc = await Firestore.getDocument({ reference: `users/${uid}` });
          const currentCount = (userDoc.snapshot.data && userDoc.snapshot.data.matchCount) || 0;
          await Firestore.updateDocument({ reference: `users/${uid}`, data: { matchCount: currentCount + 1 } });
        } catch (e) {}
      }
    } catch (e) { /* オフライン時はローカル保存のみで継続。再送はスコープ外 */ }
  },

  // プッシュ通知の許可は、アプリ起動直後などではなく「同卓者を指定する」
  // 操作を最初に行ったタイミングまで遅らせてリクエストする(iOSは許可
  // ダイアログの提示タイミングに厳しく、文脈のない状態で求めると拒否されやすい)。
  async requestPushPermissionIfNeeded(){
    if (!this.isAvailable() || logState.account.pushPermissionRequested) return;
    logState.account.pushPermissionRequested = true;
    saveLogState();
    try {
      const Messaging = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseMessaging;
      if (!Messaging) return;
      const perm = await Messaging.requestPermissions();
      const granted = perm && (perm.receive === 'granted' || perm.receive === true);
      if (granted) {
        const tokenRes = await Messaging.getToken();
        if (tokenRes && tokenRes.token) {
          const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
          await Firestore.updateDocument({ reference: `users/${logState.account.uid}`, data: { pushToken: tokenRes.token } }).catch(() => {});
        }
      }
    } catch (e) { /* 許可拒否・非対応でも通常機能には影響させない */ }
  },

  // 通知ON/OFF設定は、Cloud Functions側(notifyOnAutoRecordedMatch)が
  // サーバーで判定できるよう users/{uid} にもミラーしておく
  // (ローカルのlogState.account.notifyOnAutoRecordだけだとFunctions側から
  // 参照できないため)。失敗してもローカル設定はそのまま有効に使う。
  async setNotifyOnAutoRecord(v){
    if (!this.isAvailable() || !logState.account.uid) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (!Firestore) return;
      await Firestore.updateDocument({ reference: `users/${logState.account.uid}`, data: { notifyOnAutoRecord: !!v } });
    } catch (e) { /* オフライン時はローカル設定のみで継続 */ }
  },

  // ---- アカウント削除(ハンバーガーメニュー「その他」から) ----
  // users/{uid}以下(friends・matchHistoryサブコレクション含む)とusernames/{name}を
  // Firestoreから削除した上で、Firebase Authenticationのユーザー自体も削除する。
  // サブコレクションの一括削除APIが無いため、1件ずつ列挙して削除する
  // (firestore.rulesでusers/{uid}の本人によるdeleteを別途許可済み)。
  // 戻り値: { ok: true } | { ok: false, error, dataDeleted? }
  //   error: 'unavailable'(非ネイティブ・未サインイン) | 'reauth'(ローカルに保持している
  //          uidとFirebase Authentication側の現在のユーザーが一致しない。再ログインが必要) |
  //          'network'(Firestore削除に失敗) |
  //          'auth'(Firestoreは削除できたがAuthユーザーの削除に失敗。多くはFirebaseの
  //          「最近のログインが必要」制約によるもので、再ログイン後の再試行を促す想定)
  async deleteAccount(){
    if (!this.isAvailable()) return { ok: false, error: 'unavailable' };
    const uid = logState.account.uid;
    if (!uid) return { ok: false, error: 'unavailable' };
    const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
    const Auth = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseAuthentication;
    if (!Firestore || !Auth) return { ok: false, error: 'unavailable' };
    try {
      // 削除処理の直前に必ずIDトークンを強制リフレッシュしておく。古い(失効・
      // キャッシュされた)トークンのままFirestoreへリクエストすると、実際には
      // 有効なサインイン状態でも"Missing or insufficient permissions"になり
      // うるため、これが原因かどうかを切り分ける。ついでに、Firebase
      // Authentication側が今どのuidを「現在のユーザー」として認識しているかを
      // ローカルのlogState.account.uidと突き合わせる。以前linkGoogle/linkApple
      // がsignInWithX()(新規サインイン)を誤って呼んでおり、匿名時代の古いuidの
      // ままusernames/friends/matchHistoryドキュメントが残っていた場合、
      // ここで不一致を検出できる(firestore.rulesのisSelf(uid)はrequest.auth.uidを
      // 見るため、ローカルのuidが古いとどの操作も一律でpermission-deniedになる)。
      if (Auth.getIdToken) {
        await Auth.getIdToken({ forceRefresh: true }).catch(e => {
          showDebugError('アカウント削除 (IDトークンの強制リフレッシュ)', e);
        });
      }
      if (Auth.getCurrentUser) {
        const current = await Auth.getCurrentUser().catch(() => null);
        const currentUid = current && current.user && current.user.uid;
        if (currentUid && currentUid !== uid) {
          showDebugError('アカウント削除 (UID不一致)', `ローカルに保持しているuid(${uid})と、Firebase Authenticationの現在のユーザーuid(${currentUid})が一致していません。`);
          return { ok: false, error: 'reauth' };
        }
      }
      // 自分がホストの卓が残っていたら、同卓者を巻き込まないよう先に終了させる。
      if (logState.room && logState.room.roomId && logState.room.isHost) {
        await this.updateRoom(logState.room.roomId, { status: 'ended' }).catch(() => {});
      }
      // 削除対象のドキュメントパスを先に列挙し、Promise.allSettledで全件試行する。
      // 「本当に削除できたか」を呼び出し側が信頼できるよう、1つでも失敗すれば
      // networkエラーとして扱うが、その際にどのパスがどんなエラーで拒否されたかを
      // 個別に特定してデバッグ表示に出す(Xcode接続できない環境での唯一の手がかり)。
      // users/{uid}自体は他のドキュメントより後に削除する(先に消すと、もし途中で
      // 失敗した場合に再試行時のgetCollection等の見通しが悪くなるため)。
      let friendDocs = [], historyDocs = [];
      try {
        const [friendsRes, historyRes] = await Promise.all([
          Firestore.getCollection({ reference: `users/${uid}/friends` }),
          Firestore.getCollection({ reference: `users/${uid}/matchHistory` }),
        ]);
        friendDocs = (friendsRes && friendsRes.snapshots) || [];
        historyDocs = (historyRes && historyRes.snapshots) || [];
      } catch (e) {
        showDebugError('アカウント削除 (Firestore一覧取得)', e);
        return { ok: false, error: 'network' };
      }
      const deleteRefs = [
        ...friendDocs.map(d => `users/${uid}/friends/${d.id}`),
        ...historyDocs.map(d => `users/${uid}/matchHistory/${d.id}`),
      ];
      if (logState.account.username) {
        deleteRefs.push(`usernames/${normalizeUsername(logState.account.username)}`);
      }
      deleteRefs.push(`users/${uid}`);
      const results = await Promise.allSettled(deleteRefs.map(ref => Firestore.deleteDocument({ reference: ref })));
      const failures = results
        .map((r, i) => ({ r, ref: deleteRefs[i] }))
        .filter(x => x.r.status === 'rejected');
      if (failures.length) {
        const detail = failures
          .map(f => `${f.ref}: ${(f.r.reason && (f.r.reason.code || f.r.reason.message)) || f.r.reason}`)
          .join('\n');
        showDebugError('アカウント削除 (Firestoreデータ削除)', `以下のドキュメントの削除が拒否されました:\n${detail}`);
        return { ok: false, error: 'network' };
      }
    } catch (e) {
      showDebugError('アカウント削除 (Firestoreデータ削除)', e);
      return { ok: false, error: 'network' };
    }
    try {
      await Auth.deleteUser();
    } catch (e) {
      // Firestore側のデータは既に削除済み。Authユーザーだけ残ってしまうと次回起動時に
      // その古いセッションのままになりかねないので、サインアウトだけはしておく。
      showDebugError('アカウント削除 (Auth.deleteUser)', e);
      await Auth.signOut().catch(() => {});
      return { ok: false, error: 'auth', dataDeleted: true };
    }
    return { ok: true };
  },
};

// 保存されているデータ(v2、無ければ旧v1)をパースしてdefaultLogState()にマージする、
// 旧: largeText(boolean、2段階)から新: textSize('normal'|'large'|'xlarge'、
// 3段階)への移行。textSizeを既に保存済みならそのまま使う。旧largeTextしか
// 無い場合は、既存ユーザーが明示的に選んでいたON/OFFの状態を尊重して
// 変換する(アプリの新しい初期値'large'を、既存ユーザーに黙って
// 上書きしないため)。account自体が無い(非常に古いデータ)場合だけ、
// 新しい初期値をそのまま使う。
function migrateTextSize(parsedAccount, defaultTextSize){
  if (!parsedAccount) return defaultTextSize;
  if (parsedAccount.textSize) return parsedAccount.textSize;
  if (parsedAccount.largeText === false) return 'normal';
  if (parsedAccount.largeText === true) return 'large';
  return defaultTextSize;
}
// v1/v2共通の下地処理。matchHistoryはv1データに存在しないため自然に[]で補完される。
function mergeParsedLogState(parsed){
  const base = defaultLogState();
  return {
    ...base,
    ...parsed,
    settings: { ...base.settings, ...(parsed.settings || {}) },
    matchHistory: Array.isArray(parsed.matchHistory) ? parsed.matchHistory : [],
    rulePresets: Array.isArray(parsed.rulePresets) ? parsed.rulePresets : [],
    memberPresets: Array.isArray(parsed.memberPresets) ? parsed.memberPresets : [],
    account: {
      ...base.account,
      ...(parsed.account || {}),
      linkedProviders: { ...base.account.linkedProviders, ...((parsed.account || {}).linkedProviders || {}) },
      textSize: migrateTextSize(parsed.account, base.account.textSize),
    },
    friends: Array.isArray(parsed.friends) ? parsed.friends : [],
    room: parsed.room || null,
    ui: base.ui, // 開閉状態・入力途中のフォームは復元しない
  };
}

function loadLogState(){
  try {
    const raw = localStorage.getItem(LOG_STORAGE_KEY);
    if (raw) return mergeParsedLogState(JSON.parse(raw));
    // v2キーが無ければ旧v1キーを探し、あれば読み替えて移行する（matchHistoryは[]で補完）。
    const rawV1 = localStorage.getItem(LOG_STORAGE_KEY_V1);
    if (rawV1) return mergeParsedLogState(JSON.parse(rawV1));
    return defaultLogState();
  } catch (e) {
    return defaultLogState(); // localStorageが使えない環境でもメモリ上で動く
  }
}

function saveLogState(){
  try {
    const { settings, hanchans, chips, hanchanSeq, currentMatchStartedAt, matchAdShown, matchHistory, account, friends, room, rulePresets, memberPresets } = logState;
    localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify({ settings, hanchans, chips, hanchanSeq, currentMatchStartedAt, matchAdShown, matchHistory, account, friends, room, rulePresets, memberPresets }));
  } catch (e) { /* 保存できない環境ではメモリ上のみで継続 */ }
}

const logState = loadLogState();
if (logState.hanchans.length > 0) logState.ui.settingsOpen = false;
saveLogState(); // v1からの移行時などに、v2キーへ即座に書き直しておく
applyTextSizeClass(); // 保存済みの文字サイズ設定を起動直後から反映する

// 起動時に必ずPlay Billingへ購入履歴を問い合わせて上書きする。ローカル保存の
// isPremiumだけに頼ると、端末変更・再インストール時に無料枠へ戻ってしまうため。
// (非ネイティブ環境ではrestorePurchases()がnullを返し、何も上書きしない。)
Native.initAds();
const _restorePurchasesOnBoot = (async () => {
  const restored = await Native.restorePurchases();
  if (restored !== null && restored !== logState.settings.isPremium) {
    logState.settings.isPremium = restored;
    saveLogState();
    scheduleRenderApp();
  }
})();
// マルチプレイヤー(フレンド・卓)機能の起動処理。匿名認証を確立し、フレンド
// 一覧を最新化し、前回終了時に進行中の卓があれば再購読する。
CloudSync.init().then(async () => {
  scheduleRenderApp();
  // 起動時の購入復元(上記)の結果が出揃うのを待ってから、自分のisPremiumを
  // users/{uid}へ同期する(サインイン完了=account.uid確定を待つ必要があるため
  // CloudSync.init()の完了後に行う。フレンドの表示名を金色にする機能・
  // firestore.rulesの無料枠判定が参照する)。
  await _restorePurchasesOnBoot;
  CloudSync.syncPremiumStatus();
});

// ---- ゲストプレイヤーへの結果受け取りリンク(Universal Links) ----
// Universal Links経由でアプリが直接起動された場合、iOS側(AppDelegate.swift の
// application(_:continue:restorationHandler:))からCapacitorの@capacitor/appプラグイン
// 経由でappUrlOpenイベントとして中継される(ネイティブ側の追加実装は不要。
// ios-snippets/associated-domains-notes.md参照)。
try {
  const AppPlugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (AppPlugin && AppPlugin.addListener) {
    AppPlugin.addListener('appUrlOpen', (data) => {
      if (data && data.url) handleIncomingUrl(data.url);
    });
  }
} catch (e) { /* @capacitor/appが無い/未対応環境では何もしない */ }
// このWebページ自体を直接 ?token=... 付きで開いた場合(GitHub Pages上での動作確認、
// Universal Linksが未設定の環境でのフォールバック確認など)にも同じ経路で拾う。
try {
  const bootToken = new URLSearchParams(location.search).get('token');
  if (bootToken) handleIncomingUrl(location.href);
} catch (e) {}

function activePlayers(){
  return logState.settings.playerNames.slice(0, logState.settings.playerCount);
}
// calcHanchanResult/calcTotals expect a `players` array on the settings
// object; logState.settings only stores playerNames+playerCount, so merge
// the derived active-player list in whenever calling into that pure logic.
function settingsWithPlayers(){
  return { ...logState.settings, players: activePlayers() };
}

/* ---- マルチプレイヤー: 卓(room)のライフサイクル ---- */
// 現在アクティブなプレイヤー枠のうち、アカウント紐付け(participantLinks)が
// されている人のuidだけを返す(ゲスト・未紐付けの枠は含まない)。
function activeParticipantUids(){
  const links = logState.settings.participantLinks || {};
  return activePlayers().map(p => links[p] && links[p].uid).filter(Boolean);
}
function isMultiplayerMatch(){
  return activeParticipantUids().length > 0;
}
// 自分が閲覧のみの同卓者(=誰かが代表入力者として卓を立てていて、自分はホストでない)かどうか。
function isRoomViewerOnly(){
  return !!(logState.room && !logState.room.isHost);
}
// 半荘を最初に記録した瞬間に、アカウント紐付けされた参加者がいれば卓(room)を
// Firestore上に作成する。非ネイティブ環境やCloudSync利用不可時は何もしない
// (=これまで通りローカル単独モードのまま動作する)。
async function ensureRoomForCurrentMatch(){
  if (!CloudSync.isAvailable()) return;
  if (logState.room && logState.room.roomId) return; // 既に卓がある(ホスト・閲覧者いずれでも)
  if (!isMultiplayerMatch()) return;
  const links = logState.settings.participantLinks || {};
  const participants = activePlayers().map((p, i) => ({
    slot: i, name: p, isGuest: !links[p], uid: links[p] ? links[p].uid : null,
  }));
  const roomId = await CloudSync.createRoom(participants);
  if (roomId) {
    logState.room = { roomId, isHost: true, hostUid: logState.account.uid, participants };
    saveLogState();
    scheduleRenderApp();
    CloudSync.subscribeRoom(roomId);
  }
}
// 代表入力者が半荘記録・チップ入力・演出発表するたびに呼び、卓ドキュメントを
// 最新の進行中データで更新する(閲覧者側は自分では書き込まない)。
function syncRoomState(){
  if (!logState.room || !logState.room.isHost || !logState.room.roomId) return;
  CloudSync.updateRoom(logState.room.roomId, {
    hanchans: logState.hanchans, chips: logState.chips,
    revealActive: logState.ui.revealActive, revealStep: logState.ui.revealStep,
    revealPeek: logState.ui.revealPeek,
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escKey(str){ return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

/* ---- 画面上デバッグ表示(Xcode/Macが無くコンソールを見られない環境向け) ----
   console.errorだけでなく、実際のエラー内容(code/message等)をそのまま
   画面上のバナーにも出す共通の仕組み。今後もcatchブロックから
   showDebugError('文脈の説明', e) を呼ぶだけで使える。 ---- */
function formatErrorForDisplay(err){
  if (err === undefined || err === null) return '(エラーオブジェクトなし: undefined/null)';
  if (typeof err === 'string') return err;
  if (typeof err !== 'object') return String(err);
  const parts = [];
  if (err.code !== undefined) parts.push(`code: ${err.code}`);
  if (err.message) parts.push(`message: ${err.message}`);
  if (err.domain) parts.push(`domain: ${err.domain}`); // NSErrorのdomainがブリッジされてくる場合がある
  if (err.name && !err.message) parts.push(`name: ${err.name}`);
  // cordova-plugin-purchaseのIErrorはcode/messageに加えてplatform/productIdを持つ
  if (err.platform) parts.push(`platform: ${err.platform}`);
  if (err.productId) parts.push(`productId: ${err.productId}`);
  if (parts.length === 0) {
    try { parts.push(JSON.stringify(err)); } catch (e2) { parts.push(String(err)); }
  }
  return parts.join('\n');
}
function showDebugError(context, err){
  logState.ui.debugError = { context, detail: formatErrorForDisplay(err) };
  scheduleRenderApp();
}
// cordova-plugin-purchase等のCordovaプラグイン向けの「登録済み一覧」相当。
// Cordovaプラグインはwindow.Capacitor.Pluginsには現れない(Capacitorプラグイン
// ではないため)。代わりにCapacitorが自動生成・バンドルするpublic/cordova_plugins.js
// (cordova.define('cordova/plugin_list', ...)としてビルドに実際に含まれる、
// インストール済みCordovaプラグインの静的な一覧)を、cordova.jsのモジュール
// システム経由でcordova.require('cordova/plugin_list')として読み出す。
// Capacitorはcordova.js・cordova_plugins.jsの両方をWKUserScript(.atDocumentStart)
// として注入するため、Cordovaプラグインが1つでも存在するアプリでは、
// アプリ自身のJSが実行される前に必ずこれらが読み込まれている(deviceready
// を待つ必要はない)。
function cordovaPluginListInfo(){
  try {
    if (!window.cordova) return `window.cordovaが存在しません(Cordovaプラグイン用のJSブリッジ自体が注入されていません)`;
    if (typeof window.cordova.exec !== 'function') return `window.cordova.execが関数ではありません(cordova.execは${typeof window.cordova.exec})`;
    if (typeof window.cordova.require !== 'function') return `window.cordova.requireが関数ではありません(モジュールシステムが読み込まれていない可能性)`;
    const list = window.cordova.require('cordova/plugin_list');
    if (!Array.isArray(list)) return `cordova.require('cordova/plugin_list')が配列を返しませんでした: ${JSON.stringify(list)}`;
    if (list.length === 0) return `Cordovaプラグイン一覧は空です(cordova_plugins.jsにCordovaプラグインが1つも含まれていません)`;
    return `Cordovaプラグイン一覧: ${list.map(p => p.pluginId || p.id).join(', ')}`;
  } catch (e) {
    return `cordova.require('cordova/plugin_list')の取得に失敗しました: ${e && e.message}`;
  }
}
function dismissDebugError(){

}
async function copyDebugError(){
  const d = logState.ui.debugError;
  if (!d) return;
  const text = `[${d.context}]\n${d.detail}`;
  try {
    await navigator.clipboard.writeText(text);
    logState.ui.notifyBanner = 'エラー内容をコピーしました';
  } catch (e) {
    // クリップボードが使えない環境では諦めず、せめてバナーにそのまま流す
    logState.ui.notifyBanner = text;
  }
  scheduleRenderApp();
}
function renderDebugError(){
  const root = document.getElementById('debugErrorRoot');
  if (!root) return;
  const d = logState.ui.debugError;
  if (!d) { root.innerHTML = ''; return; }
  root.innerHTML = `
    <div class="debug-error-banner">
      <div class="debug-error-head">
        <span>⚠️ デバッグ: ${escapeHtml(d.context)}</span>
        <button class="history-close" onclick="dismissDebugError()">×</button>
      </div>
      <div class="debug-error-detail">${escapeHtml(d.detail)}</div>
      <div class="debug-error-actions">
        <button class="preset-btn" onclick="copyDebugError()">📋 コピー</button>
      </div>
    </div>`;
}
function formatMoney(n){
  const sign = n > 0 ? '+' : n < 0 ? '-' : '';
  return `${sign}${Math.abs(Math.round(n)).toLocaleString('ja-JP')}`;
}
function formatPt(n){
  const sign = n > 0 ? '+' : n < 0 ? '-' : '';
  return `${sign}${Math.abs(n).toFixed(1)}`;
}
// 金額表示を2段組みにする共通ヘルパー(結果発表画面・対局履歴の詳細画面で
// 同じ見た目にするため1箇所にまとめる)。上段は合計金額(チップ込み、
// 表示内容は従来通り)。下段はチップ分の内訳(🪙+符号付き金額)のみを、
// 上段より一回り小さく・控えめな色で添える。チップを使っていない
// (chipMoneyが0の)対局では下段を出さず、従来通り1段のままにする。
function moneyStackInnerHtml(amount, chipMoney, mainClass){
  const chipLine = chipMoney
    ? `<div class="money-chip-sub ${chipMoney>=0?'plus':'minus'}">🪙 ${formatMoney(chipMoney)}</div>`
    : '';
  return `<div class="${mainClass}">${formatMoney(amount)}</div>${chipLine}`;
}

function renamePlayerEverywhere(oldName, newName){
  if (oldName === newName) return;
  logState.hanchans.forEach(h => {
    if (Object.prototype.hasOwnProperty.call(h.scores, oldName)) {
      h.scores[newName] = h.scores[oldName];
      delete h.scores[oldName];
    }
    if (h.busterOf) {
      Object.keys(h.busterOf).forEach(k => { if (h.busterOf[k] === oldName) h.busterOf[k] = newName; });
      if (Object.prototype.hasOwnProperty.call(h.busterOf, oldName)) {
        h.busterOf[newName] = h.busterOf[oldName];
        delete h.busterOf[oldName];
      }
    }
  });
  if (Object.prototype.hasOwnProperty.call(logState.chips, oldName)) {
    logState.chips[newName] = logState.chips[oldName];
    delete logState.chips[oldName];
  }
  [logState.ui.formScores, logState.ui.formBuster].forEach(obj => {
    Object.keys(obj).forEach(k => { if (obj[k] === oldName) obj[k] = newName; });
    if (Object.prototype.hasOwnProperty.call(obj, oldName)) {
      obj[newName] = obj[oldName];
      delete obj[oldName];
    }
  });
  const links = logState.settings.participantLinks;
  if (links && Object.prototype.hasOwnProperty.call(links, oldName)) {
    links[newName] = links[oldName];
    delete links[oldName];
  }
}

/* ---- 演出モード（終局まで順位・収支を隠す） ----
   自動タイマーでは進めず、すべてユーザーのタップ操作で進む。
   各順位は「順位ラベルのみ表示→タップ→名前・得点を表示→タップ→次の順位へ」
   の2段階になっており、revealStepが「発表を終えて確定した順位グループ数」、
   revealPeekが「現在発表中の順位について、名前・得点まで見たか」を表す。 ---- */
function currentRevealGroupCount(){
  const s = settingsWithPlayers();
  const totals = calcTotals(logState.hanchans, logState.chips, s);
  return revealGroupsFor(activePlayers(), totals, logState.settings.playerCount).length;
}
function togglePresentationMode(){
  logState.settings.presentationMode = !logState.settings.presentationMode;
  logState.ui.revealActive = false;
  logState.ui.revealStep = 0;
  logState.ui.revealPeek = false;
  logState.ui.confirmEndMatch = false;
  saveLogState(); scheduleRenderApp();
}
// 発表順は「2位→3位→…→1位」。1位（優勝）を最後にとっておくことで、
// 途中の順位から先に発表して最後に一番の見せ場を持ってくる演出。
function revealOrderFor(playerCount){
  return playerCount === 3 ? [2, 3, 1] : [2, 3, 4, 1];
}
function startReveal(){
  if (isRoomViewerOnly()) return; // 発表の進行は代表入力者だけが操作できる
  if (logState.hanchans.length === 0) return; // 対局ログが無い状態では発表しても意味が無いので何もしない
  logState.ui.revealActive = true;
  logState.ui.revealStep = 0; // まず最初の順位（2位）のラベルだけを表示した状態から始める
  logState.ui.revealPeek = false;
  // 「終局」ボタンを押した区切りの良いタイミングでインタースティシャルを挟む。
  // ただし、半荘を追加してから再び「終局」を押すとrevealActiveは一旦falseに
  // 戻る(recordHanchan参照)ため、同じ対局セッション中に何度も表示されて
  // しまわないよう、matchAdShownで「この対局につき最初の1回だけ」に制限する。
  // 非ネイティブ環境・購入済みの場合はNative.showInterstitial内部でno-op。
  if (!logState.matchAdShown) {
    logState.matchAdShown = true;
    Native.showInterstitial();
  }
  saveLogState();
  scheduleRenderApp();
  syncRoomState();
}
// 発表中の順位ラベルをタップした時。その順位の名前・得点を表示する(1段階目)。
function revealCurrentGroup(){
  if (isRoomViewerOnly()) return;
  if (!logState.ui.revealActive) return;
  if (logState.ui.revealStep >= currentRevealGroupCount()) return; // 既に発表し終えていれば何もしない
  logState.ui.revealPeek = true;
  saveLogState();
  scheduleRenderApp();
  syncRoomState();
}
// 名前・得点が見えている状態でさらにタップした時。次の順位のラベル表示へ進む(2段階目)。
function advanceReveal(){
  if (isRoomViewerOnly()) return;
  if (!logState.ui.revealActive) return;
  if (!logState.ui.revealPeek) return; // 名前・得点をまだ見ていなければ進めない
  const total = currentRevealGroupCount();
  if (logState.ui.revealStep >= total) return;
  logState.ui.revealStep++;
  logState.ui.revealPeek = false;
  saveLogState();
  scheduleRenderApp();
  syncRoomState();
}

/* ---- 対局を終了する（現在の進行中対局をmatchHistoryへアーカイブしてリセット） ---- */
function requestEndMatch(){
  if (isRoomViewerOnly()) return; // 対局の終了(確定保存)も代表入力者だけができる
  if (logState.hanchans.length === 0) return;
  logState.ui.confirmEndMatch = true;
  scheduleRenderApp();
}
function cancelEndMatch(){
  logState.ui.confirmEndMatch = false;
  scheduleRenderApp();
}
function confirmEndMatch(){
  logState.ui.confirmEndMatch = false;
  // 無料枠(FREE_MATCH_LIMIT)を超えて新規保存しようとした場合は、保存フローに進まず
  // ペイウォールを表示する。半荘データ(hanchans)はここでは一切消さない。
  if (!isPremiumUnlocked() && logState.matchHistory.length >= FREE_MATCH_LIMIT) {
    logState.ui.paywallOpen = true;
    logState.ui.paywallSource = 'archive';
    logState.ui.paywallErrorMsg = null;
    scheduleRenderApp();
    return;
  }
  archiveCurrentMatch();
}
// 進行中のhanchans/chips/settingsをスナップショットとしてmatchHistoryへ保存し、
// 進行中データ(hanchans/chips/hanchanSeq/演出状態)だけをリセットする。
// settingsは次の対局にそのまま引き継ぐため、ここではリセットしない。
function archiveCurrentMatch(){
  if (isRoomViewerOnly()) return;
  if (logState.hanchans.length === 0) return;
  const participantUids = activeParticipantUids();
  const entry = {
    id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    startedAt: logState.currentMatchStartedAt || new Date().toISOString(),
    endedAt: new Date().toISOString(),
    title: '',
    settingsSnapshot: JSON.parse(JSON.stringify(logState.settings)),
    hanchans: JSON.parse(JSON.stringify(logState.hanchans)),
    chips: JSON.parse(JSON.stringify(logState.chips)),
  };
  if (participantUids.length > 0) {
    entry.participantUids = participantUids;
    entry.recordedBy = logState.account.uid;
    // Firestoreセキュリティルールがrooms/{roomId}のhostUid/participantUidsと
    // 突き合わせて自動配信を検証できるよう、対象の卓IDを記録に含める。
    if (logState.room && logState.room.roomId) entry.roomId = logState.room.roomId;
  }
  logState.matchHistory.unshift(entry);
  // 同卓者としてアカウント紐付けされていた全員(ゲスト除く)のmatchHistoryにも
  // 同じ内容を自動配信する。各自の無料枠は独立にカウントされる(Firestore側で判定)。
  if (participantUids.length > 0) {
    CloudSync.archiveMatchFanout(entry, participantUids);
  }
  // 卓を閉じる(代表入力者以外はこれ以降このroomIdをリアルタイム購読しない)。
  if (logState.room && logState.room.roomId) {
    CloudSync.updateRoom(logState.room.roomId, { status: 'ended' });
    CloudSync.leaveRoom();
    logState.room = null;
  }
  logState.hanchans = [];
  logState.chips = {};
  logState.hanchanSeq = 1;
  logState.currentMatchStartedAt = null;
  logState.matchAdShown = false; // 次の対局では「終局」を押した時にまた1回だけ広告を出せるようにする
  logState.ui.revealActive = false;
  logState.ui.revealStep = 0;
  logState.ui.revealPeek = false;
  logState.ui.confirmEndMatch = false;
  cancelEditHanchan_noRender();
  saveLogState();
  scheduleRenderApp();
  // 1つの対局が終わった区切りの良いタイミングでだけインタースティシャルを挟む
  // (半荘記録のたびには出さない)。非ネイティブ環境・購入済みの場合は内部でno-op。
  Native.showInterstitial();
}

/* ---- ペイウォール(無料枠超過時) ---- */
async function purchaseFromPaywall(){
  logState.ui.paywallPurchasing = true;
  logState.ui.paywallErrorMsg = null;
  scheduleRenderApp();
  const result = await Native.purchasePremium();
  logState.ui.paywallPurchasing = false;
  if (result.success) {
    logState.settings.isPremium = true;
    logState.ui.paywallOpen = false;
    saveLogState();
    Native.hideBanner();
    if (logState.ui.paywallSource === 'archive') {
      // 対局終了(無料枠超過)経由なら、ユーザーにもう一度ボタンを押させず、そのまま保存まで完了させる。
      archiveCurrentMatch();
    } else {
      // メニューの「課金する」から任意に開いた場合は、保存すべき対局が無いので閉じるだけ。
      logState.ui.paywallSource = null;
      scheduleRenderApp();
    }
  } else if (result.reason === 'timeout') {
    // 実機では、ストア側の購入自体は成立しているのにapproved/verifiedイベントの
    // 受信だけが60秒以上遅れるケースを確認している。「失敗しました」と断定すると
    // 誤解を招くため、時間を置いてからの「購入を復元」を案内する文言にする
    // (イベントが遅れて届けばNative側で自動的にプレミアム状態へ反映される)。
    logState.ui.paywallErrorMsg = '反映に時間がかかっています。少し時間をおいてから、メニューの「購入を復元」をお試しください。決済自体は完了している場合があります。';
    scheduleRenderApp();
  } else {
    logState.ui.paywallErrorMsg = '購入を完了できませんでした。通信環境をご確認のうえ、もう一度お試しください。';
    scheduleRenderApp();
  }
}
