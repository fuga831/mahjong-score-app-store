<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>麻雀点数電卓</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0c2a20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="点数電卓">
<meta name="description" content="親/子・翻数・アガリの形をタップするだけでロン/ツモの点数をリアルタイム計算する麻雀スコア電卓">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-0:#0c2a20;
    --felt-1:#123a2b;
    --felt-2:#1a4a37;
    --line:#2f5f4a;
    --ivory:#f4eee0;
    --ivory-dim:#cdd9cd;
    --ink:#0f2a20;
    --ink-soft:#9fc2ac;
    --gold:#d8b26a;
    --gold-strong:#e9c983;
    --red:#c14a3d;
    --red-soft:#e0847a;
    --shadow: 0 3px 0 rgba(0,0,0,0.28), 0 6px 14px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.035) 0, transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255,255,255,0.03) 0, transparent 45%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 26px),
      var(--felt-0);
    color:var(--ivory);
    font-family:"Noto Sans JP","Zen Maru Gothic",system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding:18px 14px calc(70px + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  h1{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:1.05rem;
    letter-spacing:.06em;
    color:var(--gold-strong);
    margin:2px 4px 0;
    display:flex;
    align-items:center;
    gap:.5em;
  }
  h1 .tile{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:1.6em;height:1.6em;
    background:var(--ivory);
    color:var(--ink);
    border-radius:5px;
    font-size:.75em;
    box-shadow:var(--shadow);
  }
  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .title-row h1{margin:2px 0 0;flex:1;min-width:0;}
  .hamburger-btn{
    flex-shrink:0;
    width:34px;height:34px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--felt-1);
    color:var(--ivory);
    font-size:1.05rem;
    line-height:1;
    cursor:pointer;
  }
  .hamburger-btn:active{background:var(--felt-2);}

  /* ---- top control row ---- */
  .toprow{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .seg{
    display:flex;
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
    gap:4px;
  }
  .seg button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.92rem;
    padding:9px 14px;
    border-radius:9px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .seg button.active{
    background:var(--gold);
    color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }

  .kiriage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 12px;
    cursor:pointer;
    user-select:none;
  }
  .kiriage .label{
    font-size:.72rem;
    line-height:1.25;
    color:var(--ivory-dim);
  }
  .kiriage .label b{color:var(--ivory);font-weight:500;}
  .switch{
    position:relative;
    width:38px;height:22px;
    border-radius:999px;
    background:var(--felt-2);
    border:1px solid var(--line);
    flex-shrink:0;
    transition:background .15s;
  }
  .switch::after{
    content:"";
    position:absolute;
    top:2px;left:2px;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--ivory-dim);
    transition:transform .15s, background .15s;
  }
  .switch.on{background:#3d7a5c;}
  .switch.on::after{transform:translateX(16px);background:var(--gold-strong);}

  /* ---- result panel ---- */
  .result{
    position:relative;
    background:linear-gradient(180deg, var(--felt-1), var(--felt-2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px 14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .result::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:16px;
    padding:1px;
    background:linear-gradient(135deg, rgba(216,178,106,.5), transparent 40%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }
  .summary-line{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .summary-line .state{
    font-size:.78rem;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .summary-line .state b{
    color:var(--gold-strong);
    font-weight:700;
  }
  .badge{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:.68rem;
    font-weight:700;
    color:var(--felt-0);
    background:var(--red-soft);
    padding:2px 8px;
    border-radius:999px;
    letter-spacing:.04em;
  }
  .score-rows{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .score-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 4px 8px 2px;
  }
  .score-row + .score-row{
    border-top:1px dashed var(--line);
  }
  .score-row .tag{
    display:flex;
    flex-direction:column;
    gap:1px;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.85rem;
    color:var(--ivory-dim);
    width:4.6em;
    flex-shrink:0;
  }
  .score-row .tag .fusub{
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.62rem;
    color:#7c9d8b;
    letter-spacing:0;
  }
  .score-row .amt{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    color:var(--ivory);
    font-size:1.9rem;
    line-height:1;
    text-align:right;
    flex:1;
  }
  .score-row .amt .pt{
    font-size:.95rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-left:.15em;
  }
  .score-row .amt .all{
    font-size:.8rem;
    font-weight:700;
    color:var(--gold-strong);
    margin-left:.35em;
  }
  .split{
    display:flex;
    gap:14px;
    justify-content:flex-end;
    align-items:baseline;
  }
  .split .item{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1px;
  }
  .split .item .who{
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }
  .split .item .num{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:1.25rem;
    color:var(--ivory);
  }
  .row-ron .amt{color:var(--red-soft);}

  /* ---- section blocks ---- */
  section{
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 12px 13px;
    transition:opacity .15s;
  }
  section.disabled{
    opacity:.4;
    pointer-events:none;
  }
  section .sec-title{
    font-size:.7rem;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:.06em;
    margin-bottom:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sec-title .hint{
    font-weight:400;
    color:#7c9d8b;
  }
  .sec-title .fu-mode-link{
    cursor:pointer;
    text-decoration:underline;
    color:var(--gold-strong);
  }

  .grid{
    display:grid;
    gap:7px;
  }
  .grid.g4{grid-template-columns:repeat(4,1fr);}
  .grid.g5{grid-template-columns:repeat(3,1fr);}
  .grid.g2{grid-template-columns:repeat(2,1fr);}

  .tile-btn{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.86rem;
    color:var(--ink);
    background:var(--ivory);
    border:1.5px solid transparent;
    border-radius:9px;
    padding:11px 6px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.25);
    line-height:1.25;
    transition:transform .08s, background .12s, box-shadow .12s;
  }
  .tile-btn small{display:block;font-size:.65rem;font-weight:500;color:#5a6b60;margin-top:1px;}
  .tile-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
  .tile-btn.selected{
    background:var(--gold);
    border-color:var(--gold-strong);
    box-shadow:0 2px 0 rgba(0,0,0,.3), 0 0 0 2px rgba(216,178,106,.25);
  }
  .tile-btn.selected small{color:#5a4523;}
  .tile-btn.disabled{
    opacity:.35;
    cursor:not-allowed;
    pointer-events:none;
  }
  .tile-btn.tier{background:var(--felt-2);color:var(--ivory);}
  .tile-btn.tier small{color:var(--ink-soft);}
  .tile-btn.tier.selected{background:var(--red);color:var(--ivory);border-color:var(--red-soft);}
  .tile-btn.tier.selected small{color:#f2d4cf;}

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }
  .chip{
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.78rem;
    color:var(--ivory-dim);
    background:var(--felt-2);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:8px 13px;
    cursor:pointer;
    transition:all .12s;
  }
  .chip .fu{font-weight:700;color:var(--gold-strong);margin-left:.3em;}
  .chip.on{
    background:var(--gold);
    border-color:var(--gold-strong);
    color:var(--ink);
  }
  .chip.on .fu{color:#5a4523;}
  .chip.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}

  /* ---- mentsu (triplet / kan) list ---- */
  .mentsu-list{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:9px;
  }
  .mentsu-empty{
    font-size:.72rem;
    color:#7c9d8b;
  }
  .mentsu-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    background:var(--felt-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:7px 8px;
  }
  .mseg{
    display:flex;
    background:var(--felt-1);
    border-radius:7px;
    padding:2px;
    gap:2px;
  }
  .mseg button{
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.68rem;
    padding:5px 8px;
    border-radius:5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .mseg button.active{background:var(--gold);color:var(--ink);font-weight:700;}
  .mentsu-row .mfu{
    margin-left:auto;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    color:var(--gold-strong);
    font-size:.85rem;
    padding-left:4px;
  }
  .mentsu-row .mremove{
    width:22px;height:22px;
    flex-shrink:0;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--felt-1);
    color:var(--ivory-dim);
    font-size:.78rem;
    line-height:1;
    cursor:pointer;
  }
  .mentsu-row .mremove:active{background:var(--felt-0);}
  .mentsu-add{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    margin-top:8px;
    padding:9px;
    border-radius:10px;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.8rem;
    cursor:pointer;
  }
  .mentsu-add:active{background:var(--felt-2);}
  .mentsu-add.disabled{opacity:.35;pointer-events:none;}

  .shanpon-note{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--felt-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    margin-top:7px;
  }
  .shanpon-note .lbl{font-size:.75rem;color:var(--ivory-dim);}
  .shanpon-note .note{
    width:100%;
    font-size:.68rem;
    color:#7c9d8b;
  }

  footer{
    text-align:center;
    font-size:.65rem;
    color:#5f8570;
    margin-top:2px;
    letter-spacing:.03em;
  }

  #calcTab, #logTab{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---- bottom nav ---- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    gap:8px;
    padding:8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(180deg, rgba(12,42,32,.85), var(--felt-0) 30%);
    border-top:1px solid var(--line);
    backdrop-filter:blur(6px);
    z-index:20;
  }
  /* ストアアプリでバナー広告(ネイティブのオーバーレイビュー)を表示している間は、
     アプリ自身の下部ナビを広告の高さぶん上に逃がし、誤クリックを防ぐための
     余白も確保する。広告そのものはDOM外(ネイティブ側)に描画される。 */
  .bottom-nav.with-ad-banner{ bottom:50px; }
  body.ad-banner-active .stage{ padding-bottom:calc(120px + env(safe-area-inset-bottom, 0px)); }
  .bottom-nav button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.68rem;
    padding:8px 4px 6px;
    border-radius:12px;
    cursor:pointer;
  }
  .bottom-nav button .ic{font-size:1.2rem;line-height:1;}
  .bottom-nav button.active{background:var(--felt-1);color:var(--gold-strong);}

  /* ---- sticky totals header (log tab) ---- */
  .sticky-header{
    position:sticky;
    top:0;
    z-index:10;
    margin:0 -14px;
    padding:10px 14px 12px;
    background:linear-gradient(180deg, var(--felt-0) 70%, rgba(12,42,32,0));
  }
  /* 演出モードの発表中/発表後は、順位カードが積み重なって縦に長くなり得るため
     sticky化すると下のフォーム等を覆い隠してしまう。この状態だけは通常の
     ブロックとして扱い、スクロールで自然に流れていくようにする。 */
  .header-block{
    margin:0 -14px;
    padding:10px 14px 12px;
    background:linear-gradient(180deg, var(--felt-0) 70%, rgba(12,42,32,0));
  }
  .total-cards{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:minmax(84px,1fr);
    gap:7px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .total-card{
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 9px;
    box-shadow:var(--shadow);
  }
  .total-card.top{background:linear-gradient(160deg, var(--felt-2), var(--felt-1));border-color:var(--gold);}
  .total-card .pname{
    font-size:.68rem;
    font-weight:700;
    color:var(--ivory-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    align-items:center;
    gap:3px;
  }
  .total-card.top .pname{color:var(--gold-strong);}
  .total-card .pmoney{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:1.05rem;
    color:var(--ivory);
    margin-top:2px;
    white-space:nowrap;
  }
  .total-card .ppt{
    font-size:.62rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .crown{font-size:.7rem;}

  /* ---- 演出モード切り替えスイッチ（画面右上） ---- */
  .mode-switch-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:6px;
    padding-bottom:8px;
  }
  .mode-switch-row .mode-label{
    font-size:.66rem;
    color:var(--ink-soft);
    letter-spacing:.02em;
  }
  .switch.disabled{opacity:.4;cursor:not-allowed;}

  /* ---- マルチプレイヤー: 卓の状態表示 ---- */
  .room-status-row{
    font-size:.68rem;
    color:var(--gold-strong);
    background:rgba(216,178,106,.12);
    border:1px solid var(--line);
    border-radius:9px;
    padding:6px 9px;
    margin-bottom:8px;
  }

  /* ---- 演出モード：終局ボタン・順位発表 ---- */
  .reveal-btn{
    display:block;
    width:100%;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:.95rem;
    color:var(--ink);
    background:linear-gradient(160deg, var(--gold-strong), var(--gold));
    border:1.5px solid var(--gold-strong);
    border-radius:12px;
    padding:13px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .reveal-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  .reveal-btn:active{transform:translateY(1px);}
  .reveal-area{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:10px;
  }
  .reveal-card{
    background:linear-gradient(180deg, var(--felt-1), var(--felt-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
    box-shadow:var(--shadow);
    animation:reveal-pop .25s ease-out;
  }
  .reveal-card.top{border-color:var(--gold);background:linear-gradient(180deg, #2a4a35, var(--felt-2));}
  @keyframes reveal-pop{
    from{opacity:0;transform:scale(.92) translateY(4px);}
    to{opacity:1;transform:scale(1) translateY(0);}
  }
  .reveal-rank{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:.78rem;
    color:var(--gold-strong);
    letter-spacing:.04em;
    margin-bottom:4px;
  }
  .reveal-card.top .reveal-rank{font-size:.9rem;}
  .reveal-member{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    padding:3px 0;
  }
  .reveal-name{
    font-weight:700;
    font-size:.9rem;
    color:var(--ivory);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .reveal-money{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:1.15rem;
    color:var(--ivory);
    flex-shrink:0;
  }
  .reveal-pt{
    font-size:.66rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .reveal-done{
    text-align:center;
    font-size:.72rem;
    color:var(--ink-soft);
    padding:4px 0 2px;
  }

  .share-icon-btn{
    border:1px solid var(--line);
    background:var(--felt-1);
    color:var(--ivory-dim);
    border-radius:8px;
    width:26px;height:26px;
    font-size:.78rem;
    line-height:1;
    cursor:pointer;
    margin-right:auto;
  }
  .share-icon-btn:active{background:var(--felt-2);}

  /* ---- 対局を終了する ---- */

<script>
/* =========================================================================
   MahjongScore module — pure calculation logic.
   (In a full project this would live in utils/mahjongScore.ts, independent
   of the UI below, so it can be unit tested on its own.)
   ========================================================================= */
const HAN_TIER_INFO = {
  mangan:     { minHan: 5,  name: '満貫',   sub: '5翻' },
  haneman:    { minHan: 6,  name: '跳満',   sub: '6〜7翻' },
  baiman:     { minHan: 8,  name: '倍満',   sub: '8〜10翻' },
  sanbaiman:  { minHan: 11, name: '三倍満', sub: '11〜12翻' },
  yakuman:    { minHan: 13, name: '役満',   sub: '13翻〜' },
};

function roundUpTo(n, unit){ return Math.ceil(n / unit) * unit; }

// Fu (符) calculation from the simplified UI state.
// Base fu is always built additively — 20(副底) + the situational bonus for
// how the hand was completed — and rounded up only once, at the very end.
const FU_BASE = 20;
const FU_MENZEN_RON_BONUS = 10; // only when the hand is closed AND won by ron
const FU_TSUMO_BONUS = 2;       // whenever won by tsumo, open or closed

// One 刻子(triplet) or 槓(kan) set's fu, from its three independent traits.
// 刻子・明・中張 = 2 is the unit value; 暗(concealed) doubles it, 幺九牌(1/9/字)
// doubles it again, and 槓(kan) multiplies the whole thing by 4.
// This single formula reproduces all 8 official values:
//   明刻2-8=2  明刻19字=4   暗刻2-8=4  暗刻19字=8
//   明槓2-8=8  明槓19字=16  暗槓2-8=16 暗槓19字=32
function mentsuFu(m){
  return 2 * (m.ankou ? 2 : 1) * (m.terminal ? 2 : 1) * (m.isKan ? 4 : 1);
}

// シャンポン待ち (shanpon wait) special case: the wait itself is worth 0 fu,
// but the pair that actually completes into a triplet is scored as a
// minko(明刻) if won by ron (the winning tile came from someone's discard,
// just like a call) and as an ankou(暗刻) if won by tsumo (self-drawn).
// So the same shanpon pair contributes a *different* fu depending on ron vs
// tsumo — this is the one case where a hand's ron-fu and tsumo-fu genuinely
// diverge beyond the usual +10/+2 base difference.
function shanponRonFu(terminal){ return terminal ? 4 : 2; }   // = minko value
function shanponTsumoFu(terminal){ return terminal ? 8 : 4; } // = ankou value

// calcFuPair(state) -> { fuRon, fuTsumo } computed independently, because a
// hand's fu is not always the same for both winning methods (menzen-ron
// bonus only applies to ron; tsumo bonus only applies to tsumo; and a
// shanpon-completed set flips between minko/ankou — see above).
function calcFuPair(s){
  if (s.keitai === 'chiitoitsu') return { fuRon: 25, fuTsumo: 25 };
  if (s.keitai === 'pinfu')      return { fuRon: 30, fuTsumo: 20 }; // pinfu locks both fixed values

  const isClosed = s.keitai !== 'naki';
  const waitBonus = s.machi === 'bad' ? 2 : 0; // ryanmen and shanpon both add 0 here
  const shared = waitBonus + (s.yakuhaiHead?2:0) + s.mentsuList.reduce((sum, m) => sum + mentsuFu(m), 0);
  const shanponRon = s.machi === 'shanpon' ? shanponRonFu(s.shanponTerminal) : 0;
  const shanponTsumo = s.machi === 'shanpon' ? shanponTsumoFu(s.shanponTerminal) : 0;

  let fuRon = roundUpTo(FU_BASE + (isClosed ? FU_MENZEN_RON_BONUS : 0) + shared + shanponRon, 10);
  let fuTsumo = roundUpTo(FU_BASE + FU_TSUMO_BONUS + shared + shanponTsumo, 10);

  // 鳴きで加符が何も無い形（いわゆる喰い平和形）は20符になってしまうが、
  // 実戦のルールでは30符が最低ラインとして扱われる。
  if (!isClosed) {
    fuRon = Math.max(fuRon, 30);
    fuTsumo = Math.max(fuTsumo, 30);
  }
  return { fuRon, fuTsumo };
}

// calcBase(han, fu, isKiriageMangan) -> the 基本点(A) for one han/fu pair.
function calcBase(han, fu, isKiriageMangan){
  let base;
  let cappedToMangan = false;
  if (han >= 13)      base = 8000;
  else if (han >= 11) base = 6000;
  else if (han >= 8)  base = 4000;
  else if (han >= 6)  base = 3000;
  else if (han >= 5)  base = 2000;
  else {
    base = fu * Math.pow(2, han + 2);
    if (base > 2000) { base = 2000; cappedToMangan = true; }
    else if (isKiriageMangan && base >= 1920 && base < 2000) { base = 2000; cappedToMangan = true; }
  }
  return { base, cappedToMangan };
}

// calcScore(isDealer, han, fuRon, fuTsumo, isKiriageMangan) -> pure, no UI
// dependency. Ron and Tsumo each get their own 基本点 because fuRon and
// fuTsumo can differ (see calcFuPair).
function calcScore(isDealer, han, fuRon, fuTsumo, isKiriageMangan){
  const ronBase = calcBase(han, fuRon, isKiriageMangan);
  const tsumoBase = calcBase(han, fuTsumo, isKiriageMangan);
  const ron = isDealer ? roundUpTo(ronBase.base * 6, 100) : roundUpTo(ronBase.base * 4, 100);
  const tsumo = isDealer
    ? { all: roundUpTo(tsumoBase.base * 2, 100) }
    : { fromDealer: roundUpTo(tsumoBase.base * 2, 100), fromNonDealer: roundUpTo(tsumoBase.base * 1, 100) };
  return { ron, tsumo, ronCapped: ronBase.cappedToMangan, tsumoCapped: tsumoBase.cappedToMangan };
}

   (Would live in utils/scoreSheet.ts alongside mahjongScore.ts.)

// Rounds |x| (x is in units of "hundreds of raw points") to the nearest 10,
// i.e. rounds the raw score to the nearest 1000 (=1pt), per the chosen
// convention, then restores the sign so negative diffs round symmetrically.
function roundTensDigit(x, mode) {
  const sign = x < 0 ? -1 : 1;
  const abs = Math.abs(x);
  const tens = Math.floor(abs / 10) * 10;
  const rem = abs - tens;
  let roundedAbs;
  if (mode === 'floor') roundedAbs = tens;                       // 切り捨て
  else if (mode === 'roundHalfUp') roundedAbs = rem >= 5 ? tens + 10 : tens; // 四捨五入
  else roundedAbs = rem >= 6 ? tens + 10 : tens;                  // 五捨六入(default)
  return sign * roundedAbs;
}

// diffRaw: (素点 - 返し点). Returns the result in pt (1pt = 1000点).
function applyRounding(diffRaw, mode) {
  const hundreds = Math.round(diffRaw / 100);
  return roundTensDigit(hundreds, mode) / 10;
}

// entries: [{name, score}] -> same array with loRank/hiRank/tieCount added.
// Ties share the same [loRank,hiRank] band so uma/oka can be split evenly.
function rankPlayers(entries) {
  const sorted = [...entries].sort((a, b) => b.score - a.score);
  const result = [];
  let i = 0;
  while (i < sorted.length) {
    let j = i;
    while (j + 1 < sorted.length && sorted[j + 1].score === sorted[i].score) j++;
    for (let k = i; k <= j; k++) {
      result.push({ ...sorted[k], loRank: i + 1, hiRank: j + 1, tieCount: j - i + 1 });
    }
    i = j + 1;
  }
  return result;
}

function umaForExactRank(rank, uma, playerCount) {
  if (playerCount === 3) {
    const [C] = uma;
    if (rank === 1) return C;
    if (rank === 2) return 0;
    return -C;
  }
  const [A, B] = uma;
  if (rank === 1) return B;
  if (rank === 2) return A;
  if (rank === 3) return -A;
  return -B;
}
// Averages the uma of every integer rank spanned by a tie so a tied group
// splits it evenly (works for 2-way, 3-way, or all-4-tied groups alike).
function umaForTieGroup(loRank, hiRank, uma, playerCount) {
  let sum = 0, count = 0;
  for (let r = loRank; r <= hiRank; r++) { sum += umaForExactRank(r, uma, playerCount); count++; }
  return sum / count;
}

// calcHanchanResult(hanchan, settings) -> { pt: {name: ptDelta}, ranked }
// pt is this hanchan's own contribution only (not a running total).
function calcHanchanResult(hanchan, settings) {
  const { players, startPoints, returnPoints, playerCount, umaEnabled, uma,
          tobiEnabled, tobiPoints, tobiRecipient } = settings;
  const entries = players.map(p => ({ name: p, score: hanchan.scores[p] }));
  const ranked = rankPlayers(entries);
  const oka = (returnPoints - startPoints) * playerCount / 1000;
  const topGroup = ranked.filter(r => r.loRank === 1);

  const pt = {};
  players.forEach(p => { pt[p] = 0; });

  ranked.forEach(r => {
    pt[r.name] += applyRounding(r.score - returnPoints, settings.roundingMode);
    if (umaEnabled) pt[r.name] += umaForTieGroup(r.loRank, r.hiRank, uma, playerCount);
    if (r.loRank === 1) pt[r.name] += oka / topGroup.length;
  });

  if (tobiEnabled) {
    players.forEach(p => {
      if (hanchan.scores[p] < 0) {
        pt[p] -= tobiPoints;
        if (tobiRecipient === 'buster' && hanchan.busterOf && hanchan.busterOf[p]) {
          pt[hanchan.busterOf[p]] += tobiPoints;
        } else {
          topGroup.forEach(r => { pt[r.name] += tobiPoints / topGroup.length; });
        }
      }
    });
  }

  return { pt, ranked };
}

// calcTotals(hanchans, chips, settings) -> per-player running pt/yen totals.
function calcTotals(hanchans, chips, settings) {
  const totals = {};
  settings.players.forEach(p => { totals[p] = 0; });
  hanchans.forEach(h => {
    const { pt } = calcHanchanResult(h, settings);
    settings.players.forEach(p => { totals[p] += pt[p]; });
  });
  const chipSum = settings.players.reduce((s, p) => s + (chips[p] || 0), 0);
  const money = {};
  settings.players.forEach(p => {
    money[p] = totals[p] * settings.rate + (chips[p] || 0) * settings.chipUnitYen;
  });
  return { pt: totals, money, chipImbalance: chipSum !== 0, chipSum };
}

const state = {

  hanTier: 3,      // 1 | 2 | 3 | 4 | 'mangan' | 'haneman' | 'baiman' | 'sanbaiman' | 'yakuman'
  keitai: 'menzen', // 'menzen' | 'naki' | 'pinfu' | 'chiitoitsu'
  machi: 'ryanmen', // 'ryanmen' | 'bad' | 'shanpon'
  shanponTerminal: false, // only used when machi==='shanpon'
  yakuhaiHead: false,
  mentsuList: [], // { id, ankou:bool(暗/明), terminal:bool(1・9・字/中張), isKan:bool(槓/刻子) } — excludes the shanpon set
  fuDirectMode: false, // 中級者・上級者向け: 符数を直接入力するモード
  manualFu: 30,
};
let mentsuSeq = 1;

// 別のボタンへのタップが、テキスト入力のonchange(blur)によるDOM作り直しと
// 同じ一連の操作の中で競合して消えてしまうのを防ぐため、render()も
// （得点記録タブのrenderAppと同様に）1フレームだけ遅らせて呼び出す。
let _renderQueued = false;
function scheduleRender(){
  if (_renderQueued) return;
  _renderQueued = true;
  requestAnimationFrame(() => { _renderQueued = false; render(); });
}

function setDealer(v){ state.isDealer = v; scheduleRender(); }
function toggleKiriage(){ state.kiriageMangan = !state.kiriageMangan; scheduleRender(); }
function toggleFuDirectMode(){ state.fuDirectMode = !state.fuDirectMode; scheduleRender(); }
function setManualFu(v){ state.manualFu = Math.max(0, v); scheduleRender(); }
// 符は常に10の位に切り上げ（七対子の25符だけ例外）というルールを、
// 直接入力された値にも適用する。
function normalizeManualFu(v){ return v === 25 ? 25 : roundUpTo(v, 10); }

function selectHanTier(tier){
  state.hanTier = tier;
  scheduleRender();
}

function selectKeitai(k){
  if (state.hanTier !== 1 && state.hanTier !== 2 && state.hanTier !== 3 && state.hanTier !== 4) return;
  state.keitai = k;
  // 七対子は役だけで2翻あるため1翻はあり得ない（ピンフはロンなら1翻もあり得るので制限しない）
  if (k === 'chiitoitsu' && state.hanTier === 1) state.hanTier = 2;
  scheduleRender();
}

function toggleChip(name){
  state[name] = !state[name];
  scheduleRender();
}
function setMachi(key){ state.machi = key; scheduleRender(); }
function setShanponTerminal(v){ state.shanponTerminal = v; scheduleRender(); }

const MAX_MENTSU = 4; // a hand has at most 4 sets besides the pair
function addMentsu(){
  if (state.mentsuList.length >= MAX_MENTSU) return;
  state.mentsuList.push({ id: mentsuSeq++, ankou: true, terminal: false, isKan: false });
  scheduleRender();
}
function setMentsuField(id, field, value){
  const m = state.mentsuList.find(x => x.id === id);
  if (m) m[field] = value;
  scheduleRender();
}
function removeMentsu(id){
  state.mentsuList = state.mentsuList.filter(x => x.id !== id);
  scheduleRender();
}

function isTierHan(h){ return h === 1 || h === 2 || h === 3 || h === 4; }

function fmt(n){ return n.toLocaleString('ja-JP'); }

    shanponSub.innerHTML = `

          <button class="${!state.shanponTerminal?'active':''}" onclick="setShanponTerminal(false)">中張</button>
          <button class="${state.shanponTerminal?'active':''}" onclick="setShanponTerminal(true)">1・9・字</button>
        </div>
        <span class="note">※ロンなら明刻扱い(+${shanponRonFu(state.shanponTerminal)}符)、ツモなら暗刻扱い(+${shanponTsumoFu(state.shanponTerminal)}符)。この組は下の「刻子・槓」に追加不要です。</span>
      </div>`;

    shanponSub.innerHTML = '';

  ];
  document.getElementById('chipRow').innerHTML = chipDefs.map(([key,label,fu,dis,on])=>{
    return `<div class="chip ${on?'on':''} ${dis?'disabled':''}" onclick="toggleChip('${key}')">${label}<span class="fu">${fu}</span></div>`;

    return `

          <button class="${!m.ankou?'active':''}" onclick="setMentsuField(${m.id},'ankou',false)">明</button>

          <button class="${!m.isKan?'active':''}" onclick="setMentsuField(${m.id},'isKan',false)">刻子</button>
          <button class="${m.isKan?'active':''}" onclick="setMentsuField(${m.id},'isKan',true)">槓</button>

          <button class="${!m.terminal?'active':''}" onclick="setMentsuField(${m.id},'terminal',false)">中張</button>

  // ---- result ----
  const panel = document.getElementById('resultPanel');
  if (!keitaiActive) {

    const r = calcScore(state.isDealer, info.minHan, 0, 0, state.kiriageMangan);
    panel.innerHTML = resultHtml(`${info.name}（${info.sub}）`, null, null, r);
  } else {
    const { fuRon, fuTsumo } = state.fuDirectMode
      ? (() => { const f = normalizeManualFu(state.manualFu); return { fuRon: f, fuTsumo: f }; })()
      : calcFuPair(state);
    const r = calcScore(state.isDealer, state.hanTier, fuRon, fuTsumo, state.kiriageMangan);
    const ronFuLabel = r.ronCapped ? `${fuRon}符→満貫` : `${fuRon}符`;
    const tsumoFuLabel = r.tsumoCapped ? `${fuTsumo}符→満貫` : `${fuTsumo}符`;
    panel.innerHTML = resultHtml(`${state.hanTier}翻`, ronFuLabel, tsumoFuLabel, r);
  }
}

function resultHtml(stateLabel, ronFuLabel, tsumoFuLabel, r){
  const tsumoHtml = r.tsumo.all !== undefined
    ? `<span class="pt">${fmt(r.tsumo.all)}</span><span class="all">ALL</span>`
    : `<span class="split">
         <span class="item"><span class="who">子から</span><span class="num">${fmt(r.tsumo.fromNonDealer)}</span></span>
         <span class="item"><span class="who">親から</span><span class="num">${fmt(r.tsumo.fromDealer)}</span></span>
       </span>`;
  return `
    <div class="summary-line">
      <span class="state">現在: <b>${stateLabel}</b></span>
    </div>
    <div class="score-rows">
      <div class="score-row row-ron">
        <span class="tag">ロン${ronFuLabel ? `<span class="fusub">${ronFuLabel}</span>` : ''}</span>
        <span class="amt">${fmt(r.ron)}<span class="pt">点</span></span>
      </div>
      <div class="score-row row-tsumo">
        <span class="tag">ツモ${tsumoFuLabel ? `<span class="fusub">${tsumoFuLabel}</span>` : ''}</span>
        <span class="amt">${tsumoHtml}</span>
      </div>
    </div>
  `;
}

const Native = {
  isNativeApp(){
    try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
    catch (e) { return false; }
  },
  /* ---- 広告(AdMob, @capacitor-community/admob想定) ---- */
  async initAds(){
    if (!this.isNativeApp()) return;
    try {
      const AdMob = window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob;
      if (AdMob && AdMob.initialize) await AdMob.initialize({});
    } catch (e) { /* 広告SDKの初期化に失敗しても本体機能は止めない */ }
  },

      await AdMob.showInterstitial();
    } catch (e) { /* 未読込・オフライン時は何もしない(対局終了フロー自体は止めない) */ }
  },
  /* ---- 課金(Google Play Billing, cordova-plugin-purchase想定) ----
     https://purchase.cordova.fovea.cc/ のイベント駆動API(v13系)を前提にした実装例。

  async initBilling(){

      store.when().approved(transaction => transaction.verify());
      store.when().verified(receipt => receipt.finish());
      store.when().productUpdated(() => {
        const product = store.get(MONETIZATION_CONFIG.billingProductId);
        const owned = !!(product && product.owned);
        if (owned && !logState.settings.isPremium) {
          logState.settings.isPremium = true;
          saveLogState();
          Native.hideBanner();
          scheduleRenderApp();
        }
        if (owned) _resolvePendingPurchase(true);
      });
      await store.initialize([store.GOOGLE_PLAY]);
    } catch (e) { /* 課金SDK初期化に失敗しても無料枠のまま安全に継続する */ }
  },
  // 戻り値: true(有効な購入あり) / false(購入なし) / null(判定できなかった＝
  // 非ネイティブ環境か通信エラー等。呼び出し側は既存のisPremium値を維持すること)。
  async restorePurchases(){
    if (!this.isNativeApp()) return null;
    try {
      const store = window.CdvPurchase && window.CdvPurchase.store;
      if (!store) return null;
      await this.initBilling();
      await store.restorePurchases();
      const product = store.get(MONETIZATION_CONFIG.billingProductId);
      return !!(product && product.owned);
    } catch (e) { return null; }
  },
  async purchasePremium(){
    if (!this.isNativeApp()) return false;
    try {
      const store = window.CdvPurchase && window.CdvPurchase.store;
      if (!store) return false;
      await this.initBilling();
      const product = store.get(MONETIZATION_CONFIG.billingProductId);
      const offer = product && product.getOffer && product.getOffer();
      if (!offer) return false;
      const resultPromise = new Promise(resolve => {
        _pendingPurchaseResolvers.push(resolve);
        // 60秒経ってもイベントが来なければ諦める(ユーザーがストアのダイアログを
        // キャンセルした場合など、approvedイベントが永遠に来ないケースの保険)。
        setTimeout(() => {
          _pendingPurchaseResolvers = _pendingPurchaseResolvers.filter(r => r !== resolve);
          resolve(false);
        }, 60000);
      });
      await offer.order();
      return await resultPromise;
    } catch (e) { return false; }
  },
  getPriceLabel(){
    try {
      const store = window.CdvPurchase && window.CdvPurchase.store;
      const product = store && store.get(MONETIZATION_CONFIG.billingProductId);
      const offer = product && product.getOffer && product.getOffer();
      return (offer && offer.pricing && offer.pricing.price) || MONETIZATION_CONFIG.fallbackPriceLabel;
    } catch (e) { return MONETIZATION_CONFIG.fallbackPriceLabel; }
  },
};

// ストアアプリ以外(このプレビューや素のブラウザ・GitHub Pages版)では常にtrue、
// つまり「常に無制限・広告なし」を返す。ユーザーの指示により、広告/課金/対局数
// 制限はCapacitorでラップしたストア配信版アプリの中だけに適用するため。
function isPremiumUnlocked(){
  if (!Native.isNativeApp()) return true;
  return !!logState.settings.isPremium;
}

/* =========================================================================
   マルチプレイヤー(フレンド・卓・成績共有) — ネイティブ橋渡し層
   ---------------------------------------------------------------------
   広告・課金のNativeオブジェクトと同じ設計思想: CloudSync.isAvailable()が
   falseの間(=このプレビュー・素のブラウザ・GitHub Pages版)は全メソッドが
   安全にno-opし、これまで通りローカル単独モードのまま動作する。
   「対象: mahjong-score-app(Capacitorラップ版)」という今回の依頼どおり、
   マルチプレイヤー機能もストアアプリの中だけで有効になる。

   @capacitor-firebase/authentication, @capacitor-firebase/firestore,
   @capacitor-firebase/messaging という3つのCapacitorネイティブプラグイン
   (window.Capacitor.Plugins.FirebaseAuthentication / FirebaseFirestore /
   FirebaseMessaging)を呼び出す設計で書いている。これらプラグインのAPI形状は
   公式ドキュメントに基づく著者の知識であり、このサンドボックスにはnpm
   レジストリへのアクセスもiOS/Androidのネイティブビルド環境も無いため、
   実際にインストール・ビルド・実機確認はできていない(前回のcordova-plugin-
   purchase統合と同じ制約)。MULTIPLAYER_SETUP.mdと各プラグインの公式READMEを
   必ず確認してから本番導入すること。
   ========================================================================= */

function normalizeUsername(name){
  return String(name || '').trim().toLowerCase().replace(/\s+/g, '');
}
// 半角英数字とアンダースコアのみ、3〜20文字。招待・検索用の識別子として
// 曖昧さが出ないように制限する(絵文字・全角文字は不可)。
function isValidUsernameFormat(name){
  return /^[a-z0-9_]{3,20}$/.test(normalizeUsername(name));
}

const CloudSync = {
  isAvailable(){
    // 広告/課金と同じく、マルチプレイヤーもストアアプリの中でのみ有効。
    return Native.isNativeApp();
  },

  _authListenerAdded: false,
  async init(){
    if (!this.isAvailable()) return;
    try {
      const Auth = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseAuthentication;
      if (!Auth) return;
      if (!this._authListenerAdded) {
        this._authListenerAdded = true;
        Auth.addListener('authStateChange', (result) => {
          const user = result && result.user;
          if (user) {
            logState.account.uid = user.uid;
            logState.account.isAnonymous = !!user.isAnonymous;
            saveLogState();
          }
        });
      }
      let current = null;
      try { current = await Auth.getCurrentUser(); } catch (e) {}
      if (current && current.user) {
        logState.account.uid = current.user.uid;
        logState.account.isAnonymous = !!current.user.isAnonymous;
      } else {
        // 初回起動時は匿名認証でそのまま使い始められるようにし、ログインを強制しない。
        const signed = await Auth.signInAnonymously();
        const user = signed && signed.user;
        if (user) { logState.account.uid = user.uid; logState.account.isAnonymous = true; }
      }
      saveLogState();
      await this.refreshFriends();
      await this.syncIncomingMatchHistory();
      if (logState.room && logState.room.roomId) {
        this.subscribeRoom(logState.room.roomId);
      } else {
        await this.checkActiveRoomInvite();
      }
    } catch (e) { /* オフライン等では静かに諦め、ローカル単独モードとして動作継続 */ }
  },

  // 匿名のままでは困る操作(フレンド追加・複数端末利用)をしようとしたタイミングで
  // 呼び出す想定。成功時はaccount.isAnonymousがfalseになり、uidは維持される
  // (匿名ユーザーへのプロバイダlinkとして扱われる設計を想定)。
  async linkGoogle(){
    if (!this.isAvailable()) return false;
    try {
      const Auth = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseAuthentication;
      if (!Auth || !Auth.signInWithGoogle) return false;
      const result = await Auth.signInWithGoogle();
      if (result && result.user) {
        logState.account.uid = result.user.uid;
        logState.account.isAnonymous = false;
        logState.account.linkedProviders.google = true;
        saveLogState();
        return true;
      }
      return false;
    } catch (e) { return false; }
  },
  // App Store Review Guideline 4.8対応: Googleログインを提供する場合、
  // Sign in with Appleも同格の選択肢として必ず用意する。
  async linkApple(){
    if (!this.isAvailable()) return false;
    try {
      const Auth = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseAuthentication;
      if (!Auth || !Auth.signInWithApple) return false;
      const result = await Auth.signInWithApple();
      if (result && result.user) {
        logState.account.uid = result.user.uid;
        logState.account.isAnonymous = false;
        logState.account.linkedProviders.apple = true;
        saveLogState();
        return true;
      }
      return false;
    } catch (e) { return false; }
  },

  // ユーザーネームは一意。usernames/{normalized}ドキュメントの有無で申請の
  // 成否を判定する(先着順)。変更時、旧ユーザーネームは予約せず即座に解放する
  // (検討の結果、シンプルさを優先する方針で決定)。
  async claimUsername(name){
    if (!this.isAvailable()) return { ok: false, error: 'unavailable' };
    if (!isValidUsernameFormat(name)) return { ok: false, error: 'invalid' };
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (!Firestore) return { ok: false, error: 'unavailable' };
      const norm = normalizeUsername(name);
      const existing = await Firestore.getDocument({ reference: `usernames/${norm}` }).catch(() => null);
      const existingUid = existing && existing.snapshot && existing.snapshot.data && existing.snapshot.data.uid;
      if (existingUid && existingUid !== logState.account.uid) {
        return { ok: false, error: 'taken' };
      }
      const oldNorm = logState.account.username ? normalizeUsername(logState.account.username) : null;
      await Firestore.setDocument({ reference: `usernames/${norm}`, data: { uid: logState.account.uid } });
      await Firestore.setDocument({ reference: `users/${logState.account.uid}`, data: { username: name }, merge: true });
      if (oldNorm && oldNorm !== norm) {
        await Firestore.deleteDocument({ reference: `usernames/${oldNorm}` }).catch(() => {});
      }
      logState.account.username = name;
      saveLogState();
      return { ok: true };
    } catch (e) { return { ok: false, error: 'network' }; }
  },

  async searchUsername(name){
    if (!this.isAvailable()) return null;
    if (!isValidUsernameFormat(name)) return null;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const norm = normalizeUsername(name);
      const doc = await Firestore.getDocument({ reference: `usernames/${norm}` });
      const uid = doc && doc.snapshot && doc.snapshot.data && doc.snapshot.data.uid;
      if (!uid) return null;
      if (uid === logState.account.uid) return { uid, username: name, isSelf: true };
      const userDoc = await Firestore.getDocument({ reference: `users/${uid}` });
      const username = userDoc && userDoc.snapshot && userDoc.snapshot.data && userDoc.snapshot.data.username;
      return { uid, username: username || name };
    } catch (e) { return null; }
  },

  // 同卓に指定した瞬間、確認フローなしで即座にフレンド関係になる(初対面でも)。
  async addFriend(uid, username){
    if (!this.isAvailable() || !uid) return false;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      await Firestore.setDocument({ reference: `users/${logState.account.uid}/friends/${uid}`, data: { uid, username, addedAt: Date.now() } });
      if (!logState.friends.some(f => f.uid === uid)) {
        logState.friends.push({ uid, username });
        saveLogState();
      }
      return true;
    } catch (e) { return false; }
  },
  async removeFriend(uid){
    if (!this.isAvailable() || !uid) return false;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      await Firestore.deleteDocument({ reference: `users/${logState.account.uid}/friends/${uid}` });
      logState.friends = logState.friends.filter(f => f.uid !== uid);
      saveLogState();
      return true;
    } catch (e) { return false; }
  },
  async refreshFriends(){
    if (!this.isAvailable()) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const res = await Firestore.getCollection({ reference: `users/${logState.account.uid}/friends` });
      const docs = (res && res.snapshots) || [];
      logState.friends = docs.map(d => d.data);
      saveLogState();
    } catch (e) { /* オフライン時はローカルキャッシュのfriendsをそのまま使う */ }
  },

  // 起動時にクラウド側のmatchHistoryを取り込み、ローカルにまだ無いもの(=自分が
  // オフラインの間に他の代表入力者から自動配信されたもの)があれば追加する。
  // recordedByが自分以外のものは、通知トーストの対象にする(金額・詳細は含めない)。
  async syncIncomingMatchHistory(){
    if (!this.isAvailable()) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const myUid = logState.account.uid;
      const res = await Firestore.getCollection({ reference: `users/${myUid}/matchHistory` });
      const docs = (res && res.snapshots) || [];
      const existingIds = new Set(logState.matchHistory.map(m => m.id));
      const newlyAddedByOthers = [];
      docs.forEach(d => {
        const entry = d.data;
        if (!entry || !entry.id || existingIds.has(entry.id)) return;
        logState.matchHistory.push(entry);
        existingIds.add(entry.id);
        if (entry.recordedBy && entry.recordedBy !== myUid) newlyAddedByOthers.push(entry);
      });
      if (docs.length > 0) {
        logState.matchHistory.sort((a, b) => new Date(b.endedAt || b.startedAt || 0) - new Date(a.endedAt || a.startedAt || 0));
        saveLogState();
      }
      if (newlyAddedByOthers.length > 0 && logState.account.notifyOnAutoRecord) {
        logState.ui.notifyBanner = newlyAddedByOthers.length === 1
          ? '対局記録が追加されました'
          : `対局記録が${newlyAddedByOthers.length}件追加されました`;
      }
    } catch (e) { /* オフライン時はローカルのmatchHistoryのみで継続 */ }
  },

  // 自分が同卓者として指定され、既に進行中の卓があれば(自分がその時アプリを
  // 開いていなくても構わない設計のため)、次に開いた時に見つけて閲覧モードで参加する。
  async checkActiveRoomInvite(){
    if (!this.isAvailable() || logState.room) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const myUid = logState.account.uid;
      const res = await Firestore.getCollection({
        reference: 'rooms',
        compositeFilter: { type: 'and', queryConstraints: [
          { type: 'where', fieldPath: 'participantUids', opStr: 'array-contains', value: myUid },
          { type: 'where', fieldPath: 'status', opStr: '==', value: 'active' },
        ] },
      });
      const docs = (res && res.snapshots) || [];
      if (docs.length === 0) return;
      const roomDoc = docs[0];
      const data = roomDoc.data;
      if (data.hostUid === myUid) return; // 自分がホストの卓は対象外(通常はここに来ない)
      logState.room = { roomId: roomDoc.id, isHost: false, hostUid: data.hostUid, participants: data.participants };
      logState.hanchans = data.hanchans || [];
      logState.chips = data.chips || {};
      logState.ui.revealActive = !!data.revealActive;
      logState.ui.revealStep = data.revealStep || 0;
      saveLogState();
      await this.subscribeRoom(roomDoc.id);
    } catch (e) { /* オフライン時は次回起動時に再試行される */ }
  },

  // participants: [{ slot, uid, name, isGuest }]
  async createRoom(participants){
    if (!this.isAvailable()) return null;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const roomId = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      const participantUids = participants.filter(p => p.uid).map(p => p.uid);
      await Firestore.setDocument({
        reference: `rooms/${roomId}`,
        data: {
          hostUid: logState.account.uid,
          participants, participantUids,
          status: 'active', createdAt: Date.now(),
          settings: logState.settings, hanchans: logState.hanchans, chips: logState.chips,
          revealActive: false, revealStep: 0,
        },
      });
      return roomId;
    } catch (e) { return null; }
  },
  // 代表入力者が半荘記録・演出発表するたびに呼ぶ。閲覧者側はsubscribeRoomの
  // コールバックで受け取るだけで、自分では書き込まない(代表入力者は1卓につき1人)。
  async updateRoom(roomId, patch){
    if (!this.isAvailable() || !roomId) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      await Firestore.updateDocument({ reference: `rooms/${roomId}`, data: patch });
    } catch (e) { /* オフライン時は諦める。代表入力者の手元の記録自体は失われない */ }
  },
  _roomListenerId: null,
  async subscribeRoom(roomId){
    if (!this.isAvailable() || !roomId) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (this._roomListenerId) {
        await Firestore.removeSnapshotListener({ callbackId: this._roomListenerId }).catch(() => {});
        this._roomListenerId = null;
      }
      const listener = await Firestore.addDocumentSnapshotListener({ reference: `rooms/${roomId}` }, (event) => {
        if (!event || !event.snapshot || !event.snapshot.data) return;
        if (!logState.room || logState.room.roomId !== roomId) return; // 卓を離れた後の遅延イベントは無視
        const data = event.snapshot.data;
        if (!logState.room.isHost) {
          if (data.status === 'ended') {
            // 代表入力者が対局を終了した。閲覧者側もこの卓から離れ、単独モードに戻る。
            // 自動配信された確定記録は、次のmatchHistory同期(次回起動時など)で届く。
            logState.room = null;
            saveLogState();
            this.leaveRoom();
            this.syncIncomingMatchHistory().then(() => scheduleRenderApp());
            return;
          }
          // 閲覧者は受信データをそのまま反映するのみ(自分では書き込まない)
          logState.hanchans = data.hanchans || [];
          logState.chips = data.chips || {};
          logState.ui.revealActive = !!data.revealActive;
          logState.ui.revealStep = data.revealStep || 0;
        }
        logState.room.participants = data.participants || logState.room.participants;
        scheduleRenderApp();
      });
      this._roomListenerId = listener && listener.callbackId;
    } catch (e) { /* リアルタイム購読に失敗しても、代表入力者側の操作自体は継続できる */ }
  },
  async leaveRoom(){
    if (!this._roomListenerId) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      await Firestore.removeSnapshotListener({ callbackId: this._roomListenerId });
    } catch (e) {}
    this._roomListenerId = null;
  },

  // 代表入力者自身のmatchHistoryへの保存はarchiveCurrentMatch側で既にローカルへ
  // 反映済み。ここでは(1)自分自身のクラウド側への複製と、(2)自分以外の同卓者
  // (uidを持つ人のみ・ゲスト除く)のmatchHistoryへの自動配信を行う。
  // 1人分の書き込み失敗が他の人の保存を妨げないよう、それぞれ独立に試行する。
  async archiveMatchFanout(entry, participantUids){
    if (!this.isAvailable()) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      const myUid = logState.account.uid;
      const targets = [myUid, ...participantUids.filter(uid => uid && uid !== myUid)];
      for (const uid of targets) {
        await Firestore.setDocument({
          reference: `users/${uid}/matchHistory/${entry.id}`,
          data: { ...entry, participantUids, recordedBy: myUid },
        }).catch(() => {});
        // 無料枠(累計3対局)のサーバー側カウンタ。各自の`users/{uid}.matchCount`を
        // 正として扱い(端末変更時にリセットされないようにするため)、Firestore
        // ルール側でmatchCount>=3かつisPremiumでない場合は書き込みを拒否する設計
        // (firestore.rules参照)。ここでの読み取り→+1書き戻しは簡易的な実装で、
        // 同時書き込みが重なった場合の競合(race condition)には対応していない。
        // 本番では読み取り→書き込みをFirestoreのトランザクションで包むか、
        // Cloud Function側でトリガー処理する方が安全(MULTIPLAYER_SETUP.md参照)。
        try {
          const userDoc = await Firestore.getDocument({ reference: `users/${uid}` });
          const currentCount = (userDoc.snapshot.data && userDoc.snapshot.data.matchCount) || 0;
          await Firestore.updateDocument({ reference: `users/${uid}`, data: { matchCount: currentCount + 1 } });
        } catch (e) {}
      }
    } catch (e) { /* オフライン時はローカル保存のみで継続。再送はスコープ外 */ }
  },

  // プッシュ通知の許可は、アプリ起動直後などではなく「同卓者を指定する」
  // 操作を最初に行ったタイミングまで遅らせてリクエストする(iOSは許可
  // ダイアログの提示タイミングに厳しく、文脈のない状態で求めると拒否されやすい)。
  async requestPushPermissionIfNeeded(){
    if (!this.isAvailable() || logState.account.pushPermissionRequested) return;
    logState.account.pushPermissionRequested = true;
    saveLogState();
    try {
      const Messaging = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseMessaging;
      if (!Messaging) return;
      const perm = await Messaging.requestPermissions();
      const granted = perm && (perm.receive === 'granted' || perm.receive === true);
      if (granted) {
        const tokenRes = await Messaging.getToken();
        if (tokenRes && tokenRes.token) {
          const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
          await Firestore.updateDocument({ reference: `users/${logState.account.uid}`, data: { pushToken: tokenRes.token } }).catch(() => {});
        }
      }
    } catch (e) { /* 許可拒否・非対応でも通常機能には影響させない */ }
  },

  // 通知ON/OFF設定は、Cloud Functions側(notifyOnAutoRecordedMatch)が
  // サーバーで判定できるよう users/{uid} にもミラーしておく
  // (ローカルのlogState.account.notifyOnAutoRecordだけだとFunctions側から
  // 参照できないため)。失敗してもローカル設定はそのまま有効に使う。
  async setNotifyOnAutoRecord(v){
    if (!this.isAvailable() || !logState.account.uid) return;
    try {
      const Firestore = window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseFirestore;
      if (!Firestore) return;
      await Firestore.updateDocument({ reference: `users/${logState.account.uid}`, data: { notifyOnAutoRecord: !!v } });
    } catch (e) { /* オフライン時はローカル設定のみで継続 */ }
  },
};

/* =========================================================================
   得点記録票タブ — state, handlers, rendering
   ========================================================================= */

const LOG_STORAGE_KEY = 'mahjong-log-v2';
const LOG_STORAGE_KEY_V1 = 'mahjong-log-v1'; // 旧バージョン。存在すればv2へ読み替えて移行する。

function defaultLogState(){
  return {
    _activeTab: 'calc', // 'calc' | 'log'
    settings: {
      playerCount: 4,
      playerNames: ['P1','P2','P3','P4'],
      startPoints: 25000,

// 保存されているデータ(v2、無ければ旧v1)をパースしてdefaultLogState()にマージする、
// v1/v2共通の下地処理。matchHistoryはv1データに存在しないため自然に[]で補完される。
function mergeParsedLogState(parsed){
  const base = defaultLogState();
  return {
    ...base,
    ...parsed,
    settings: { ...base.settings, ...(parsed.settings || {}) },
    matchHistory: Array.isArray(parsed.matchHistory) ? parsed.matchHistory : [],
    account: {
      ...base.account,
      ...(parsed.account || {}),
      linkedProviders: { ...base.account.linkedProviders, ...((parsed.account || {}).linkedProviders || {}) },
    },
    friends: Array.isArray(parsed.friends) ? parsed.friends : [],
    room: parsed.room || null,
    ui: base.ui, // 開閉状態・入力途中のフォームは復元しない
  };
}

function loadLogState(){
  try {
    const raw = localStorage.getItem(LOG_STORAGE_KEY);
    if (raw) return mergeParsedLogState(JSON.parse(raw));
    // v2キーが無ければ旧v1キーを探し、あれば読み替えて移行する（matchHistoryは[]で補完）。
    const rawV1 = localStorage.getItem(LOG_STORAGE_KEY_V1);
    if (rawV1) return mergeParsedLogState(JSON.parse(rawV1));
    return defaultLogState();
  } catch (e) {
    return defaultLogState(); // localStorageが使えない環境でもメモリ上で動く
  }
}

function saveLogState(){
  try {
    const { settings, hanchans, chips, hanchanSeq, currentMatchStartedAt, matchHistory, account, friends, room } = logState;
    localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify({ settings, hanchans, chips, hanchanSeq, currentMatchStartedAt, matchHistory, account, friends, room }));
  } catch (e) { /* 保存できない環境ではメモリ上のみで継続 */ }
}

const logState = loadLogState();

// isPremiumだけに頼ると、端末変更・再インストール時に無料枠へ戻ってしまうため。

CloudSync.init().then(() => scheduleRenderApp());

function activePlayers(){
  return logState.settings.playerNames.slice(0, logState.settings.playerCount);
}
// calcHanchanResult/calcTotals expect a `players` array on the settings
// object; logState.settings only stores playerNames+playerCount, so merge
// the derived active-player list in whenever calling into that pure logic.
function settingsWithPlayers(){

}

/* ---- マルチプレイヤー: 卓(room)のライフサイクル ---- */
// 現在アクティブなプレイヤー枠のうち、アカウント紐付け(participantLinks)が
// されている人のuidだけを返す(ゲスト・未紐付けの枠は含まない)。
function activeParticipantUids(){
  const links = logState.settings.participantLinks || {};
  return activePlayers().map(p => links[p] && links[p].uid).filter(Boolean);
}
function isMultiplayerMatch(){
  return activeParticipantUids().length > 0;
}
// 自分が閲覧のみの同卓者(=誰かが代表入力者として卓を立てていて、自分はホストでない)かどうか。
function isRoomViewerOnly(){
  return !!(logState.room && !logState.room.isHost);
}
// 半荘を最初に記録した瞬間に、アカウント紐付けされた参加者がいれば卓(room)を
// Firestore上に作成する。非ネイティブ環境やCloudSync利用不可時は何もしない
// (=これまで通りローカル単独モードのまま動作する)。
async function ensureRoomForCurrentMatch(){
  if (!CloudSync.isAvailable()) return;
  if (logState.room && logState.room.roomId) return; // 既に卓がある(ホスト・閲覧者いずれでも)
  if (!isMultiplayerMatch()) return;
  const links = logState.settings.participantLinks || {};
  const participants = activePlayers().map((p, i) => ({
    slot: i, name: p, isGuest: !links[p], uid: links[p] ? links[p].uid : null,
  }));
  const roomId = await CloudSync.createRoom(participants);
  if (roomId) {
    logState.room = { roomId, isHost: true, hostUid: logState.account.uid, participants };
    saveLogState();
    scheduleRenderApp();
    CloudSync.subscribeRoom(roomId);
  }
}
// 代表入力者が半荘記録・チップ入力・演出発表するたびに呼び、卓ドキュメントを
// 最新の進行中データで更新する(閲覧者側は自分では書き込まない)。
function syncRoomState(){
  if (!logState.room || !logState.room.isHost || !logState.room.roomId) return;
  CloudSync.updateRoom(logState.room.roomId, {
    hanchans: logState.hanchans, chips: logState.chips,
    revealActive: logState.ui.revealActive, revealStep: logState.ui.revealStep,
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escKey(str){ return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function formatMoney(n){
  const sign = n > 0 ? '+' : n < 0 ? '-' : '';
  return `${sign}${Math.abs(Math.round(n)).toLocaleString('ja-JP')}`;
}
function formatPt(n){
  const sign = n > 0 ? '+' : n < 0 ? '-' : '';
  return `${sign}${Math.abs(n).toFixed(1)}`;
}

function renamePlayerEverywhere(oldName, newName){
  if (oldName === newName) return;
  logState.hanchans.forEach(h => {
    if (Object.prototype.hasOwnProperty.call(h.scores, oldName)) {
      h.scores[newName] = h.scores[oldName];
      delete h.scores[oldName];
    }
    if (h.busterOf) {
      Object.keys(h.busterOf).forEach(k => { if (h.busterOf[k] === oldName) h.busterOf[k] = newName; });
      if (Object.prototype.hasOwnProperty.call(h.busterOf, oldName)) {
        h.busterOf[newName] = h.busterOf[oldName];
        delete h.busterOf[oldName];
      }
    }
  });
  if (Object.prototype.hasOwnProperty.call(logState.chips, oldName)) {
    logState.chips[newName] = logState.chips[oldName];
    delete logState.chips[oldName];
  }
  [logState.ui.formScores, logState.ui.formBuster].forEach(obj => {
    Object.keys(obj).forEach(k => { if (obj[k] === oldName) obj[k] = newName; });
    if (Object.prototype.hasOwnProperty.call(obj, oldName)) {
      obj[newName] = obj[oldName];
      delete obj[oldName];
    }
  });
  const links = logState.settings.participantLinks;
  if (links && Object.prototype.hasOwnProperty.call(links, oldName)) {
    links[newName] = links[oldName];
    delete links[oldName];
  }
}
function setPlayerName(i, value){
  const oldName = logState.settings.playerNames[i];
  const newName = (value || '').trim() || `P${i+1}`;
  logState.settings.playerNames[i] = newName;
  renamePlayerEverywhere(oldName, newName);

}
function setStartPointsPreset(v){

  // 持ち点だけを切り替える。
  const okaOn = logState.settings.returnPoints > logState.settings.startPoints;

}

}

function setReturnPoints(v){ logState.settings.returnPoints = v; saveLogState(); scheduleRenderApp(); }
function setUmaEnabled(v){ logState.settings.umaEnabled = v; saveLogState(); scheduleRenderApp(); }
function setUmaPreset(...vals){ logState.settings.uma = vals; saveLogState(); scheduleRenderApp(); }

/* ---- 演出モード（終局まで順位・収支を隠す） ---- */
function togglePresentationMode(){

// 発表順は「2位→3位→…→1位」。1位（優勝）を最後にとっておくことで、
// 途中の順位から先に発表して最後に一番の見せ場を持ってくる演出。
function revealOrderFor(playerCount){
  return playerCount === 3 ? [2, 3, 1] : [2, 3, 4, 1];
}
function startReveal(){
  if (isRoomViewerOnly()) return; // 発表の進行は代表入力者だけが操作できる
  if (logState.hanchans.length === 0) return; // 対局ログが無い状態では発表しても意味が無いので何もしない
  logState.ui.revealActive = true;
  logState.ui.revealStep = 1; // 「終局」を押した瞬間に最初の順位（2位）まで発表する
  scheduleRenderApp();

}
function revealNext(totalGroups){

}

/* ---- 対局を終了する（現在の進行中対局をmatchHistoryへアーカイブしてリセット） ---- */
function requestEndMatch(){
  if (isRoomViewerOnly()) return; // 対局の終了(確定保存)も代表入力者だけができる
  if (logState.hanchans.length === 0) return;
  logState.ui.confirmEndMatch = true;
  scheduleRenderApp();
}
function cancelEndMatch(){
  logState.ui.confirmEndMatch = false;
  scheduleRenderApp();
}
function confirmEndMatch(){
  logState.ui.confirmEndMatch = false;
  // 無料枠(FREE_MATCH_LIMIT)を超えて新規保存しようとした場合は、保存フローに進まず
  // ペイウォールを表示する。半荘データ(hanchans)はここでは一切消さない。
  if (!isPremiumUnlocked() && logState.matchHistory.length >= FREE_MATCH_LIMIT) {
    logState.ui.paywallOpen = true;
    logState.ui.paywallErrorMsg = null;
    scheduleRenderApp();
    return;
  }
  archiveCurrentMatch();
}
// 進行中のhanchans/chips/settingsをスナップショットとしてmatchHistoryへ保存し、
// 進行中データ(hanchans/chips/hanchanSeq/演出状態)だけをリセットする。
// settingsは次の対局にそのまま引き継ぐため、ここではリセットしない。
function archiveCurrentMatch(){
  if (isRoomViewerOnly()) return;
  if (logState.hanchans.length === 0) return;
  const participantUids = activeParticipantUids();
  const entry = {
    id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    startedAt: logState.currentMatchStartedAt || new Date().toISOString(),
    endedAt: new Date().toISOString(),
    title: '',
    settingsSnapshot: JSON.parse(JSON.stringify(logState.settings)),
    hanchans: JSON.parse(JSON.stringify(logState.hanchans)),
    chips: JSON.parse(JSON.stringify(logState.chips)),
  };
  if (participantUids.length > 0) {
    entry.participantUids = participantUids;
    entry.recordedBy = logState.account.uid;
    // Firestoreセキュリティルールがrooms/{roomId}のhostUid/participantUidsと
    // 突き合わせて自動配信を検証できるよう、対象の卓IDを記録に含める。
    if (logState.room && logState.room.roomId) entry.roomId = logState.room.roomId;
  }
  logState.matchHistory.unshift(entry);
  // 同卓者としてアカウント紐付けされていた全員(ゲスト除く)のmatchHistoryにも
  // 同じ内容を自動配信する。各自の無料枠は独立にカウントされる(Firestore側で判定)。
  if (participantUids.length > 0) {
    CloudSync.archiveMatchFanout(entry, participantUids);
  }
  // 卓を閉じる(代表入力者以外はこれ以降このroomIdをリアルタイム購読しない)。
  if (logState.room && logState.room.roomId) {
    CloudSync.updateRoom(logState.room.roomId, { status: 'ended' });
    CloudSync.leaveRoom();
    logState.room = null;
  }
  logState.hanchans = [];
  logState.chips = {};
  logState.hanchanSeq = 1;
  logState.currentMatchStartedAt = null;
  logState.ui.revealActive = false;
  logState.ui.revealStep = 0;
  logState.ui.confirmEndMatch = false;
  cancelEditHanchan_noRender();
  saveLogState();
  scheduleRenderApp();
  // 1つの対局が終わった区切りの良いタイミングでだけインタースティシャルを挟む
  // (半荘記録のたびには出さない)。非ネイティブ環境・購入済みの場合は内部でno-op。
  Native.showInterstitial();
}

/* ---- hanchan form handlers ---- */
function setFormScore(name, value){ logState.ui.formScores[name] = value; scheduleRenderApp(); }
function setFormBuster(bustedName, busterName){ logState.ui.formBuster[bustedName] = busterName; scheduleRenderApp(); }

// 素点は必ず100点単位（下2桁は常に00）なので、入力フォームでは下2桁を省略した
// 「100点単位の値」を打ってもらい、実際の素点にする時だけ100倍する。
// 例: 入力欄に "350" → 実際の素点は 35,000。
const SCORE_INPUT_SCALE = 100;
function formScoreActual(p){
  const raw = parseFloat(logState.ui.formScores[p]);
  return isNaN(raw) ? NaN : Math.round(raw * SCORE_INPUT_SCALE);
}
function formTotal(){
  return activePlayers().reduce((sum, p) => {
    const v = formScoreActual(p);
    return sum + (isNaN(v) ? 0 : v);
  }, 0);
}
function formIsValid(){
  const players = activePlayers();
  if (players.some(p => logState.ui.formScores[p] === '' || isNaN(formScoreActual(p)))) return false;
  if (formTotal() !== logState.settings.startPoints * logState.settings.playerCount) return false;
  if (logState.settings.tobiEnabled && logState.settings.tobiRecipient === 'buster') {
    for (const p of players) {
      if ((formScoreActual(p) || 0) < 0 && !logState.ui.formBuster[p]) return false;
    }
  }
  return true;
}
function recordHanchan(){
  if (isRoomViewerOnly()) return; // 閲覧のみの同卓者は記録できない(代表入力者は1卓につき1人)
  if (!formIsValid()) return;
  const players = activePlayers();
  const scores = {};
  players.forEach(p => { scores[p] = formScoreActual(p); });
  const busterOf = {};
  players.forEach(p => { if (scores[p] < 0 && logState.ui.formBuster[p]) busterOf[p] = logState.ui.formBuster[p]; });

  if (logState.ui.editingHanchanId !== null) {
    const h = logState.hanchans.find(x => x.id === logState.ui.editingHanchanId);
    if (h) { h.scores = scores; h.busterOf = busterOf; }
    logState.ui.editingHanchanId = null;
  } else {
    // この対局で最初の半荘を記録した瞬間の時刻を、あとで履歴に保存する時の
    // startedAtとして使う（既に記録中ならそのまま）。
    if (logState.hanchans.length === 0 && !logState.currentMatchStartedAt) {
      logState.currentMatchStartedAt = new Date().toISOString();
    }
    logState.hanchans.unshift({ id: logState.hanchanSeq++, scores, busterOf });
  }
  logState.ui.confirmEndMatch = false;
  resetFormScores();
  // 演出モード中に新しい半荘を記録したら、対局が続いている証拠なので
  // 発表済みの結果はまた隠しておく（次の「終局」まで再びネタバレしない）。
  if (logState.settings.presentationMode) {
    logState.ui.revealActive = false;
    logState.ui.revealStep = 0;
  }
  saveLogState();
  scheduleRenderApp();
  // 卓を立てた人(代表入力者)が半荘を記録するたびに、進行中の卓ドキュメントを
  // Firestore上に作成/更新する(同卓者がアプリを開いていればリアルタイムに届く)。
  ensureRoomForCurrentMatch().then(syncRoomState);
}
function editHanchan(id){
  const h = logState.hanchans.find(x => x.id === id);
  if (!h) return;
  logState.ui.editingHanchanId = id;
  logState.ui.formScores = {};
  logState.ui.formBuster = {};
  activePlayers().forEach(p => {
    // 保存されている実際の素点(例:35,000)を、入力欄用の100点単位の表記(例:350)に戻す。
    logState.ui.formScores[p] = h.scores[p] === undefined ? '' : String(h.scores[p] / SCORE_INPUT_SCALE);
    if (h.busterOf && h.busterOf[p]) logState.ui.formBuster[p] = h.busterOf[p];
  });
  scheduleRenderApp(() => {
    const el = document.getElementById('hanchanFormAnchor');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}
function cancelEditHanchan(){
  logState.ui.editingHanchanId = null;
  resetFormScores();
  scheduleRenderApp();
}
function deleteHanchan(id){
  if (isRoomViewerOnly()) return;
  logState.hanchans = logState.hanchans.filter(x => x.id !== id);
  if (logState.ui.editingHanchanId === id) cancelEditHanchan();
  saveLogState();
  scheduleRenderApp();
  syncRoomState();
}
function chipStep(name, delta){
  if (isRoomViewerOnly()) return;
  logState.chips[name] = (logState.chips[name] || 0) + delta;
  saveLogState(); scheduleRenderApp();
  syncRoomState();
}
// 枚数が多い時に＋/−ボタンを連打しなくて済むよう、数値表示部分をタップすると
// 直接入力できるようにする(ステッパー自体は残したまま追加する導線)。
function startEditChip(name){
  logState.ui.editingChipFor = name;
  scheduleRenderApp(() => {
    const el = document.getElementById('chipEditInput');
    if (el) { el.focus(); el.select(); }
  });
}
function setChipAbsolute(name, value){
  if (isRoomViewerOnly()) return;
  if (logState.ui.editingChipFor !== name) return; // 二重発火(change+blur)による重複保存を防ぐ
  const n = parseInt(value, 10);
  logState.chips[name] = isNaN(n) ? 0 : n;
  logState.ui.editingChipFor = null;
  saveLogState(); scheduleRenderApp();
  syncRoomState();
}
function cancelEditChip(){
  logState.ui.editingChipFor = null;
  scheduleRenderApp();
}

/* ---- ログイン誘導(匿名のままでは困る操作をした時) ---- */
// 「フレンドを追加する」等の操作をしようとしたタイミングでのみ表示する。
// 連携は必須ではないため、スキップしてそのまま進める導線も必ず用意する。
function needsLoginPromptFirst(){
  const p = logState.account.linkedProviders;
  return logState.account.isAnonymous && !p.google && !p.apple;
}
function openLoginPrompt(reason, afterAction){
  // ログイン誘導は常に単独の最前面モーダルとして表示する。「フレンド一覧を
  // 見ている最中にフレンドを追加しようとした」場合のように、既に別のモーダルを
  // 開いた状態からこの誘導が挟まれることがあるため、先に他のモーダルを閉じて
  // 重なり表示(タップ判定のズレ)を防ぐ。呼び出し元は afterAction 側で必要な
  // モーダルを改めて開き直す設計になっている。
  logState.ui.accountModalOpen = false;
  logState.ui.friendPickerOpen = false;
  logState.ui.friendsListOpen = false;
  logState.ui.addFriendOpen = false;
  logState.ui.loginPromptOpen = true;
  logState.ui.loginPromptReason = reason;
  logState.ui._loginPromptAfterAction = afterAction; // ログイン後 or スキップ後に続ける処理
  scheduleRenderApp();
}
function closeLoginPrompt(){
  logState.ui.loginPromptOpen = false;
  logState.ui.loginPromptReason = null;
  logState.ui._loginPromptAfterAction = null;
  scheduleRenderApp();
}
async function loginPromptContinue(provider){
  const after = logState.ui._loginPromptAfterAction;
  if (provider === 'google') await CloudSync.linkGoogle();
  else if (provider === 'apple') await CloudSync.linkApple();
  // 連携に失敗しても(オフライン等)、匿名のまま続行できるようにする。
  closeLoginPrompt();
  if (after) after();
}

/* ---- ユーザーネーム設定・アカウントモーダル ---- */
function openAccountModal(){
  logState.ui.accountModalOpen = true;
  logState.ui.usernameInput = logState.account.username || '';
  logState.ui.usernameError = null;
  scheduleRenderApp();
}
function closeAccountModal(){
  logState.ui.accountModalOpen = false;
  scheduleRenderApp();
}
function setUsernameInput(v){ logState.ui.usernameInput = v; scheduleRenderApp(); }
async function submitUsername(){
  const name = (logState.ui.usernameInput || '').trim();
  if (!isValidUsernameFormat(name)) {
    logState.ui.usernameError = '半角英数字・アンダースコアのみ、3〜20文字で入力してください';
    scheduleRenderApp();
    return;
  }
  logState.ui.usernameChecking = true;
  logState.ui.usernameError = null;
  scheduleRenderApp();
  const result = await CloudSync.claimUsername(name);
  logState.ui.usernameChecking = false;
  if (result.ok) {
    logState.ui.accountModalOpen = false;
    scheduleRenderApp();
  } else {
    logState.ui.usernameError = result.error === 'taken'
      ? 'そのユーザーネームは既に使われています'
      : result.error === 'unavailable'
        ? 'この画面はストアアプリ内でのみ利用できます'
        : '通信環境をご確認のうえ、もう一度お試しください';
    scheduleRenderApp();
  }
}
