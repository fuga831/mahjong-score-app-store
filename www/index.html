<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>麻雀点数電卓</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2a20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="点数電卓">
<meta name="description" content="親/子・翻数・アガリの形をタップするだけでロン/ツモの点数をリアルタイム計算する麻雀スコア電卓">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-0:#0c2a20;
    --felt-1:#123a2b;
    --felt-2:#1a4a37;
    --line:#2f5f4a;
    --ivory:#f4eee0;
    --ivory-dim:#cdd9cd;
    --ink:#0f2a20;
    --ink-soft:#9fc2ac;
    --gold:#d8b26a;
    --gold-strong:#e9c983;
    --red:#c14a3d;
    --red-soft:#e0847a;
    --shadow: 0 3px 0 rgba(0,0,0,0.28), 0 6px 14px rgba(0,0,0,0.35);
  }

  /* プレミアム会員のプレイヤー名表示(結果発表画面・対局履歴・成績タブ等、
     プレイヤー名が出る箇所全般で共通のクラス名を使う。isPlayerPremiumDisplay()参照)。 */
  .premium-name{ color:var(--gold-strong); }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* 文字サイズ:大(旧称ジジイモード)。このアプリのほぼ全てのfont-sizeは
     rem単位(html要素のfont-sizeが基準)で書かれているため、ここを1箇所
     拡大するだけでアプリ全体の文字が連動して大きくなる。 */
  html.text-size-large{ font-size:125%; }
  html.text-size-xlarge{ font-size:150%; } /* 大(125%)のさらに1.2倍 */
  body{
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.035) 0, transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255,255,255,0.03) 0, transparent 45%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 26px),
      var(--felt-0);
    color:var(--ivory);
    font-family:"Noto Sans JP","Zen Maru Gothic",system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    /* capacitor.config.jsonのios.contentInsetを"never"にしてWKWebViewの
       自動セーフエリア調整を無効化し、ここで手動にpadding-top/bottomを
       付けている(自動調整とCSSのposition:fixed/env()が競合し、上部は
       ステータスバーの裏にコンテンツが潜り込み、下部は固定バーが
       画面端に密着しない不具合の原因になっていたため)。
       padding-topは position:fixed の .title-row(ヘッダーバー)の実測の
       高さぶん(地の高さ64px)+ヘッダー自身にも足しているセーフエリア分を
       同じ式で二重に確保している(ヘッダー側の高さが安全域ぶん伸びるため、
       コンテンツ側もその伸びた分だけ余分にpadding-topを確保する必要がある)。 */
    padding:calc(64px + env(safe-area-inset-top, 0px)) 14px calc(70px + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  h1{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:1.05rem;
    line-height:1.2;
    letter-spacing:.06em;
    color:var(--gold-strong);
    margin:2px 4px 0;
    display:flex;
    align-items:center;
    gap:.5em;
  }
  h1 .tile{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:1.6em;height:1.6em;
    background:var(--ivory);
    color:var(--ink);
    border-radius:5px;
    font-size:.75em;
    box-shadow:var(--shadow);
  }
  /* 画面上部に常時固定するヘッダーバー。.bottom-navと同じく、透過が
     一切無い不透明な背景+box-shadowで「独立した1枚のパネル」として見せ、
     padding-topにenv(safe-area-inset-top)を足してステータスバー領域まで
     背景色で覆う(下のcontent側は.stageのpadding-topで同じ高さぶん
     避けている)。 */
  .title-row{
    position:fixed;
    top:0; left:0; right:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    background:linear-gradient(180deg, var(--felt-1), var(--felt-0) 70%);
    border-bottom:1px solid var(--line);
    box-shadow:0 4px 14px rgba(0,0,0,.32);
  }
  .title-row h1{margin:2px 0 0;flex:1;min-width:0;}
  .hamburger-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    width:2.1em;height:2.1em;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--felt-1);
    color:var(--ivory);
    font-size:1.05rem;
    line-height:1;
    cursor:pointer;
  }
  .hamburger-btn:active{background:var(--felt-2);}

  /* ---- top control row ---- */
  .toprow{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .seg{
    display:flex;
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
    gap:4px;
  }
  .seg button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.92rem;
    padding:9px 14px;
    border-radius:9px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .seg button.active{
    background:var(--gold);
    color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }

  .kiriage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 12px;
    cursor:pointer;
    user-select:none;
  }
  .kiriage .label{
    font-size:.72rem;
    line-height:1.25;
    color:var(--ivory-dim);
  }
  .kiriage .label b{color:var(--ivory);font-weight:500;}
  .switch{
    position:relative;
    width:38px;height:22px;
    border-radius:999px;
    background:var(--felt-2);
    border:1px solid var(--line);
    flex-shrink:0;
    transition:background .15s;
  }
  .switch::after{
    content:"";
    position:absolute;
    top:2px;left:2px;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--ivory-dim);
    transition:transform .15s, background .15s;
  }
  .switch.on{background:#3d7a5c;}
  .switch.on::after{transform:translateX(16px);background:var(--gold-strong);}

  /* ---- result panel ---- */
  .result{
    position:relative;
    background:linear-gradient(180deg, var(--felt-1), var(--felt-2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px 14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .result::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:16px;
    padding:1px;
    background:linear-gradient(135deg, rgba(216,178,106,.5), transparent 40%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }
  .summary-line{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .summary-line .state{
    font-size:.78rem;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .summary-line .state b{
    color:var(--gold-strong);
    font-weight:700;
  }
  .badge{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:.68rem;
    font-weight:700;
    color:var(--felt-0);
    background:var(--red-soft);
    padding:2px 8px;
    border-radius:999px;
    letter-spacing:.04em;
  }
  .score-rows{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .score-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 4px 8px 2px;
  }
  .score-row + .score-row{
    border-top:1px dashed var(--line);
  }
  .score-row .tag{
    display:flex;
    flex-direction:column;
    gap:1px;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.85rem;
    color:var(--ivory-dim);
    width:4.6em;
    flex-shrink:0;
  }
  .score-row .tag .fusub{
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.62rem;
    color:#7c9d8b;
    letter-spacing:0;
  }
  .score-row .amt{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    color:var(--ivory);
    font-size:1.9rem;
    line-height:1;
    text-align:right;
    flex:1;
  }
  .score-row .amt .pt{
    font-size:.95rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-left:.15em;
  }
  .score-row .amt .all{
    font-size:.8rem;
    font-weight:700;
    color:var(--gold-strong);
    margin-left:.35em;
  }
  .split{
    display:flex;
    gap:14px;
    justify-content:flex-end;
    align-items:baseline;
  }
  .split .item{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1px;
  }
  .split .item .who{
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }
  .split .item .num{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:1.25rem;
    color:var(--ivory);
  }
  .row-ron .amt{color:var(--red-soft);}

  /* ---- 符計算の内訳(学習用の可視化表示) ---- */
  .fu-breakdown{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
    display:flex;
    flex-direction:column;
    gap:3px;
    font-size:.68rem;
    color:var(--ink-soft);
    line-height:1.5;
    word-break:break-word;
  }
  .fu-breakdown-line{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    column-gap:.25em;
  }

  /* ---- 専門用語の「?」タップ解説 ---- */
  .term-tip-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:14px;height:14px;
    flex-shrink:0;
    border-radius:50%;
    border:1px solid var(--ink-soft);
    background:var(--felt-2);
    color:var(--ink-soft);
    font-size:.6rem;
    font-weight:700;
    line-height:1;
    padding:0;
    cursor:pointer;
    vertical-align:middle;
  }
  .term-tip-btn:active{background:var(--felt-1);color:var(--ivory);}
  .term-tip-popover{
    position:fixed;
    z-index:60;
    max-width:min(78vw, 260px);
    background:var(--felt-1);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:9px 11px;
    font-size:.72rem;
    line-height:1.5;
    color:var(--ivory-dim);
    box-shadow:var(--shadow);
  }

  /* ---- section blocks ---- */
  section{
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 12px 13px;
    transition:opacity .15s;
  }
  section.disabled{
    opacity:.4;
    pointer-events:none;
  }
  section .sec-title{
    font-size:.7rem;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:.06em;
    margin-bottom:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sec-title .hint{
    font-weight:400;
    color:#7c9d8b;
  }
  .sec-title .fu-mode-link{
    cursor:pointer;
    text-decoration:underline;
    color:var(--gold-strong);
  }

  .grid{
    display:grid;
    gap:7px;
  }
  .grid.g4{grid-template-columns:repeat(4,1fr);}
  .grid.g5{grid-template-columns:repeat(3,1fr);}
  .grid.g2{grid-template-columns:repeat(2,1fr);}

  .tile-btn{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.86rem;
    color:var(--ink);
    background:var(--ivory);
    border:1.5px solid transparent;
    border-radius:9px;
    padding:11px 6px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.25);
    line-height:1.25;
    transition:transform .08s, background .12s, box-shadow .12s;
  }
  .tile-btn small{display:block;font-size:.65rem;font-weight:500;color:#5a6b60;margin-top:1px;}
  .tile-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
  .tile-btn.selected{
    background:var(--gold);
    border-color:var(--gold-strong);
    box-shadow:0 2px 0 rgba(0,0,0,.3), 0 0 0 2px rgba(216,178,106,.25);
  }
  .tile-btn.selected small{color:#5a4523;}
  .tile-btn.disabled{
    opacity:.35;
    cursor:not-allowed;
    pointer-events:none;
  }
  .tile-btn.tier{background:var(--felt-2);color:var(--ivory);}
  .tile-btn.tier small{color:var(--ink-soft);}
  .tile-btn.tier.selected{background:var(--red);color:var(--ivory);border-color:var(--red-soft);}
  .tile-btn.tier.selected small{color:#f2d4cf;}

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }
  .chip{
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.78rem;
    color:var(--ivory-dim);
    background:var(--felt-2);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:8px 13px;
    cursor:pointer;
    transition:all .12s;
  }
  .chip .fu{font-weight:700;color:var(--gold-strong);margin-left:.3em;}
  .chip.on{
    background:var(--gold);
    border-color:var(--gold-strong);
    color:var(--ink);
  }
  .chip.on .fu{color:#5a4523;}
  .chip.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}

  /* ---- mentsu (triplet / kan) list ---- */
  .mentsu-list{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:9px;
  }
  .mentsu-empty{
    font-size:.72rem;
    color:#7c9d8b;
  }
  .mentsu-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    background:var(--felt-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:7px 8px;
  }
  .mseg{
    display:flex;
    background:var(--felt-1);
    border-radius:7px;
    padding:2px;
    gap:2px;
  }
  .mseg button{
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.68rem;
    padding:5px 8px;
    border-radius:5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .mseg button.active{background:var(--gold);color:var(--ink);font-weight:700;}
  .mentsu-row .mfu{
    margin-left:auto;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    color:var(--gold-strong);
    font-size:.85rem;
    padding-left:4px;
  }
  .mentsu-row .mremove{
    width:22px;height:22px;
    flex-shrink:0;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--felt-1);
    color:var(--ivory-dim);
    font-size:.78rem;
    line-height:1;
    cursor:pointer;
  }
  .mentsu-row .mremove:active{background:var(--felt-0);}
  .mentsu-add{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    margin-top:8px;
    padding:9px;
    border-radius:10px;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.8rem;
    cursor:pointer;
  }
  .mentsu-add:active{background:var(--felt-2);}
  .mentsu-add.disabled{opacity:.35;pointer-events:none;}

  .shanpon-note{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--felt-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    margin-top:7px;
  }
  .shanpon-note .lbl{font-size:.75rem;color:var(--ivory-dim);}
  .shanpon-note .note{
    width:100%;
    font-size:.68rem;
    color:#7c9d8b;
  }

  #calcTab, #logTab{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---- bottom nav ----
     以前はrgba(12,42,32,.85)という半透明色から始まるグラデーションだった
     ため、バー上端の帯だけ不透明度が100%未満になり、スクロールしてきた
     コンテンツがバーの縁からうっすら透けて見えていた(backdrop-filterの
     ぼかしだけでは不透明化されない)。felt-1→felt-0はどちらも完全不透明な
     色なので、見た目のグラデーション(上端がやや明るい帯)は維持しつつ、
     透過は完全に無くなる。box-shadowを追加し、コンテンツの上に独立した
     1枚のパネルが乗っているように見せる。 ---- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    gap:8px;
    padding:8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(180deg, var(--felt-1), var(--felt-0) 30%);
    border-top:1px solid var(--line);
    box-shadow:0 -4px 14px rgba(0,0,0,.32);
    z-index:20;
  }
  /* ストアアプリでバナー広告(ネイティブのオーバーレイビュー)を表示している間は、
     アプリ自身の下部ナビを広告の高さぶん上に逃がし、誤クリックを防ぐための
     余白も確保する。広告そのものはDOM外(ネイティブ側)に描画される。
     --ad-banner-heightはNative.initAds()内のbannerAdSizeChangedリスナーが
     実測値で上書きする(未取得の間はadSize:'BANNER'の規定サイズ50pxを
     フォールバックとして使う)。ネイティブ側のバナーはrootViewControllerの
     safeAreaLayoutGuide.bottomを基準に配置されるため、画面下端からの
     オフセットはenv(safe-area-inset-bottom)とバナー高さの合計にする必要が
     あり、どちらか一方だけでは実際のバナー位置とズレて重なってしまう。 */
  :root{ --ad-banner-height:50px; }
  .bottom-nav.with-ad-banner{
    bottom:calc(env(safe-area-inset-bottom, 0px) + var(--ad-banner-height, 50px));
    transition:bottom .2s ease;
  }
  body.ad-banner-active .stage{
    padding-bottom:calc(70px + env(safe-area-inset-bottom, 0px) + var(--ad-banner-height, 50px));
    transition:padding-bottom .2s ease;
  }
  .bottom-nav button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.68rem;
    padding:8px 4px 6px;
    border-radius:12px;
    cursor:pointer;
  }
  .bottom-nav button .ic{font-size:1.2rem;line-height:1;}
  .bottom-nav button.active{background:var(--felt-1);color:var(--gold-strong);}

  /* ---- sticky totals header (log tab) ---- */
  .sticky-header{
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:10;
    margin:0 -14px;
    padding:10px 14px 12px;
    background:linear-gradient(180deg, var(--felt-0) 70%, rgba(12,42,32,0));
  }
  /* 演出モードの発表中/発表後は、順位カードが積み重なって縦に長くなり得るため
     sticky化すると下のフォーム等を覆い隠してしまう。この状態だけは通常の
     ブロックとして扱い、スクロールで自然に流れていくようにする。 */
  .header-block{
    margin:0 -14px;
    padding:10px 14px 12px;
    background:linear-gradient(180deg, var(--felt-0) 70%, rgba(12,42,32,0));
  }
  .total-cards{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:minmax(84px,1fr);
    gap:7px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .total-card{
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 9px;
    box-shadow:var(--shadow);
  }
  .total-card.top{background:linear-gradient(160deg, var(--felt-2), var(--felt-1));border-color:var(--gold);}
  .total-card.shareable{cursor:pointer;}
  .total-card.shareable:active{background:var(--felt-2);}
  .total-card .share-hint{font-size:.85em;opacity:.7;}
  .total-card .pname{
    font-size:.68rem;
    font-weight:700;
    color:var(--ivory-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    align-items:center;
    gap:3px;
  }
  .total-card.top .pname{color:var(--gold-strong);}
  .total-card .pmoney{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:1.05rem;
    color:var(--ivory);
    margin-top:2px;
    white-space:nowrap;
  }
  .total-card .ppt{
    font-size:.62rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .crown{font-size:.7rem;}
  /* ---- 金額の2段組み表示(合計金額+チップ内訳)。総合結果・対局履歴の
     詳細・演出モードの発表カードで共通して使う(moneyStackInnerHtml参照)。
     上段(.pmoney/.reveal-money)は既存のまま、下段はひとまわり小さく・
     控えめな色で、プラス/マイナスの配色だけ既存ルール(#9fe0bd/red-soft)
     を踏襲しつつopacityを落として目立たせすぎないようにしている。 ---- */
  .money-chip-sub{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    font-size:.62rem;
    opacity:.75;
    white-space:nowrap;
  }
  .money-chip-sub.plus{color:#9fe0bd;}
  .money-chip-sub.minus{color:var(--red-soft);}
  .total-card .money-chip-sub{margin-top:1px;}

  /* ---- 演出モード切り替えスイッチ（画面右上） ---- */
  .mode-switch-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:6px;
    padding-bottom:8px;
  }
  .mode-switch-row .mode-label{
    font-size:.66rem;
    color:var(--ink-soft);
    letter-spacing:.02em;
  }
  .switch.disabled{opacity:.4;cursor:not-allowed;}

  /* ---- マルチプレイヤー: 卓の状態表示 ---- */
  .room-status-row{
    font-size:.68rem;
    color:var(--gold-strong);
    background:rgba(216,178,106,.12);
    border:1px solid var(--line);
    border-radius:9px;
    padding:6px 9px;
    margin-bottom:8px;
  }

  /* ---- 演出モード：終局ボタン・順位発表 ---- */
  .reveal-btn{
    display:block;
    width:100%;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:.95rem;
    color:var(--ink);
    background:linear-gradient(160deg, var(--gold-strong), var(--gold));
    border:1.5px solid var(--gold-strong);
    border-radius:12px;
    padding:13px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .reveal-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  .reveal-btn:active{transform:translateY(1px);}
  .reveal-area{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:10px;
  }
  .reveal-card{
    background:linear-gradient(180deg, var(--felt-1), var(--felt-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
    box-shadow:var(--shadow);
    animation:reveal-pop .25s ease-out;
  }
  .reveal-card.top{border-color:var(--gold);background:linear-gradient(180deg, #2a4a35, var(--felt-2));}
  @keyframes reveal-pop{
    from{opacity:0;transform:scale(.92) translateY(4px);}
    to{opacity:1;transform:scale(1) translateY(0);}
  }
  .reveal-card.reveal-pending{
    cursor:pointer;
    text-align:center;
    padding:20px 14px;
    border-style:dashed;
    border-color:var(--gold-strong);
    animation:reveal-pop .25s ease-out, reveal-pulse 1.6s ease-in-out infinite;
  }
  .reveal-card.reveal-pending .reveal-rank{
    font-size:1.05rem;
    margin-bottom:8px;
  }
  .reveal-tap-hint{
    font-size:.78rem;
    font-weight:700;
    color:var(--gold-strong);
    animation:reveal-tap-bounce 1.2s ease-in-out infinite;
  }
  @keyframes reveal-pulse{
    0%,100%{box-shadow:var(--shadow);}
    50%{box-shadow:0 0 0 4px rgba(212,175,55,.22), var(--shadow);}
  }
  @keyframes reveal-tap-bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-3px);}
  }
  .reveal-card.reveal-peeked{cursor:pointer;}
  .reveal-card.reveal-not-yet{
    opacity:.35;
    border-style:dashed;
    box-shadow:none;
    animation:none;
  }
  .reveal-card.reveal-not-yet .reveal-rank{color:var(--ink-soft);}
  .reveal-next-hint{
    text-align:center;
    font-size:.7rem;
    color:var(--ink-soft);
    margin-top:6px;
    opacity:.85;
  }
  .reveal-rank{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:.78rem;
    color:var(--gold-strong);
    letter-spacing:.04em;
    margin-bottom:4px;
  }
  .reveal-card.top .reveal-rank{font-size:.9rem;}
  .reveal-member{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    padding:3px 0;
  }
  .reveal-name{
    font-weight:700;
    font-size:.9rem;
    color:var(--ivory);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .reveal-money{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:1.15rem;
    color:var(--ivory);
    flex-shrink:0;
  }
  .reveal-money-stack{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    flex-shrink:0;
  }
  .reveal-pt{
    font-size:.66rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .reveal-done{
    text-align:center;
    font-size:.72rem;
    color:var(--ink-soft);
    padding:4px 0 2px;
  }

  .share-icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    border:1px solid var(--line);
    background:var(--felt-1);
    color:var(--ivory-dim);
    border-radius:8px;
    width:2.2em;height:2.2em;
    font-size:.78rem;
    line-height:1;
    cursor:pointer;
    margin-right:auto;
  }
  .share-icon-btn:active{background:var(--felt-2);}

  /* ---- 対局を終了する ---- */
  .end-match-btn{
    display:block;
    width:100%;
    margin-top:9px;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.82rem;
    color:var(--ivory-dim);
    background:transparent;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:10px;
    cursor:pointer;
  }
  .end-match-btn:active{background:var(--felt-1);}
  .end-match-confirm{
    margin-top:9px;
    background:var(--felt-1);
    border:1px solid var(--red);
    border-radius:12px;
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:.76rem;
    color:var(--ivory-dim);
  }
  .end-match-confirm-btns{display:flex;gap:8px;}
  .end-match-confirm-btns .preset-btn{flex:1;}
  .preset-btn.danger{background:var(--red);color:var(--ivory);border-color:var(--red-soft);}

  /* ---- 対局履歴モーダル ---- */
  .history-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,16,12,.72);
    z-index:50;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .history-modal{
    width:100%;
    max-width:460px;
    max-height:92vh;
    background:var(--felt-0);
    border:1px solid var(--line);
    border-radius:18px 18px 0 0;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .history-modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:14px 14px 8px;
    flex-shrink:0;
  }
  .history-modal-title{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:1rem;
    color:var(--gold-strong);
  }
  .history-back{
    border:0;background:transparent;color:var(--ivory-dim);
    font-size:.82rem;font-weight:700;cursor:pointer;padding:4px 2px;
  }
  .history-close{
    border:1px solid var(--line);background:var(--felt-1);color:var(--ivory);
    width:28px;height:28px;border-radius:50%;font-size:.9rem;line-height:1;cursor:pointer;
  }
  .history-tabs{
    display:flex;gap:8px;padding:0 14px 10px;flex-shrink:0;
  }
  .history-tabs .preset-btn{flex:1;}
  .history-modal-body{
    padding:0 14px calc(18px + env(safe-area-inset-bottom, 0px));
    overflow-y:auto;
  }
  .history-toolbar{display:flex;gap:8px;margin-bottom:10px;}
  .history-toolbar .mentsu-add{margin-top:0;}
  .history-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:.8rem;
    padding:28px 0;
  }
  .history-reminder{
    margin-top:10px;
    font-size:.68rem;
    color:var(--ink-soft);
    text-align:center;
  }
  .history-list{display:flex;flex-direction:column;gap:8px;}
  .history-card{
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
  }
  .history-card:active{background:var(--felt-2);}
  .history-card-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:.66rem;color:var(--ink-soft);
  }
  .history-title{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.88rem;
    color:var(--ivory);
    margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .history-winner{
    margin-top:5px;
    font-size:.78rem;
    color:var(--gold-strong);
    display:flex;align-items:center;gap:6px;
  }
  .history-winner-money{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
  }
  .history-detail-title-row{margin-bottom:2px;}
  .history-detail-title{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:.95rem;
    color:var(--ivory);
    cursor:pointer;
  }
  .history-detail-meta{
    font-size:.7rem;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .history-detail-actions{
    display:flex;flex-direction:column;gap:8px;
    margin-top:14px;
  }
  .danger-text{color:var(--red-soft) !important;border-color:var(--red) !important;}

  .stat-group{margin-bottom:16px;}
  .stat-group-head{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.82rem;
    color:var(--ivory-dim);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .stat-cards{display:flex;flex-direction:column;gap:8px;}
  .stat-card{
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:9px 12px;
  }
  .stat-name{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:.88rem;
    color:var(--gold-strong);
    margin-bottom:4px;
  }
  .stat-row{
    font-size:.72rem;
    color:var(--ivory-dim);
    display:flex;
    justify-content:space-between;
    padding:2px 0;
  }
  .stat-row b{color:var(--ivory);font-variant-numeric:tabular-nums;}

  /* ---- 通算成績(「成績」タブに統合) ---- */
  .overall-stats-summary{ margin-bottom:18px; }
  .overall-stats-total{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.88rem;
    color:var(--ivory);
    margin-bottom:12px;
  }
  .overall-stats-total b{
    font-size:1.15rem;
    color:var(--gold-strong);
    font-variant-numeric:tabular-nums;
  }
  .rank-bars{ display:flex; flex-direction:column; gap:8px; }
  .rank-bar-row{ display:flex; align-items:center; gap:8px; }
  .rank-bar-label{
    width:2.4em; flex-shrink:0;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.78rem;
    color:var(--ivory-dim);
  }
  .rank-bar-track{
    flex:1;
    height:14px;
    background:var(--felt-2);
    border-radius:999px;
    overflow:hidden;
  }
  .rank-bar-fill{ height:100%; border-radius:999px; }
  .rank-bar-1{ background:var(--gold); }
  .rank-bar-2{ background:#c7b988; }
  .rank-bar-3{ background:#7c9d8b; }
  .rank-bar-4{ background:var(--red-soft); }
  .rank-bar-value{
    width:6.6em;
    flex-shrink:0;
    text-align:right;
    font-size:.72rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .rank-trend-title{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.82rem;
    color:var(--ivory-dim);
    margin-bottom:8px;
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .rank-trend-svg{ width:100%; height:auto; display:block; }
  .chart-gridline{ stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; }
  .chart-axis-label{ font-size:7px; fill:var(--ink-soft); }
  .chart-line{
    fill:none;
    stroke:var(--gold-strong);
    stroke-width:1.6;
    vector-effect:non-scaling-stroke;
    stroke-linejoin:round;
    stroke-linecap:round;
  }
  .chart-point{ fill:var(--gold); }

  /* ---- 成績タブ: 成績を見たい人を選ぶUI(タップで開くスクロール一覧) ---- */
  .stats-player-picker{ margin-bottom:14px; }
  .stats-player-picker-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    width:100%;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.82rem;
    color:var(--ivory);
    background:var(--felt-2);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
  }
  .stats-player-picker-btn .picker-caret{ color:var(--ink-soft); font-size:.7rem; }
  .stats-player-picker-list{
    margin-top:6px;
    max-height:180px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:2px 2px 2px 0;
  }
  .stats-player-picker-item{
    text-align:left;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.8rem;
    color:var(--ink-soft);
    background:var(--felt-1);
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:8px 12px;
    cursor:pointer;
    flex-shrink:0;
  }
  .stats-player-picker-item.active{
    color:var(--gold-strong);
    border-color:var(--gold);
    background:var(--felt-2);
  }

  .share-fallback-toast{
    margin:0 14px 12px;
    background:var(--felt-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    font-size:.72rem;
    color:var(--ivory-dim);
    word-break:break-all;
  }

  /* ---- 画面上デバッグ表示(Xcode/Macが無い環境向け) ----
     実際のエラー内容(code/message)をconsole.errorだけでなく画面にも出す
     ための共通の仕組み。showDebugError(context, err)から呼ぶ。タップでは
     消えず、明示的に閉じるかコピーするまで残る(内容を読む・報告する時間を
     確保するため、他のトースト類と違って自動では消さない)。 */
  .debug-error-banner{
    position:fixed;
    left:10px; right:10px;
    top:calc(64px + env(safe-area-inset-top, 0px) + 8px);
    z-index:70;
    background:#3a1414;
    border:1.5px solid var(--red);
    border-radius:12px;
    padding:10px 12px;
    box-shadow:var(--shadow);
    max-height:44vh;
    overflow-y:auto;
  }
  .debug-error-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.76rem;
    color:var(--red-soft);
    margin-bottom:5px;
  }
  .debug-error-detail{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:.72rem;
    line-height:1.5;
    color:var(--ivory);
  }
  .debug-error-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
  }

  /* ---- renderApp()が致命的にクラッシュした際の最終フォールバック表示 ----
     通常のモーダル・デバッグバナーの描画経路(renderApp()経由)自体が
     壊れている可能性があるため、このオーバーレイはrenderApp()を一切
     経由せず直接DOM操作で表示する(renderFatalErrorFallback参照)。
     debug-error-banner(z-index:70)よりさらに手前に出す。 ---- */
  .fatal-error-overlay{
    position:fixed;
    inset:0;
    z-index:90;
    background:rgba(5,16,12,.88);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .fatal-error-box{
    width:100%;
    max-width:420px;
    max-height:80vh;
    overflow-y:auto;
    background:#3a1414;
    border:1.5px solid var(--red);
    border-radius:14px;
    padding:18px;
  }
  .fatal-error-title{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:1rem;
    color:var(--red-soft);
    margin-bottom:8px;
  }
  .fatal-error-msg{
    font-size:.84rem;
    color:var(--ivory);
    line-height:1.6;
    margin-bottom:10px;
  }
  .fatal-error-detail{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:.7rem;
    line-height:1.5;
    color:var(--ivory-dim);
    background:rgba(0,0,0,.2);
    border-radius:8px;
    padding:8px;
    margin-bottom:12px;
  }

  /* ---- 課金ステータス・ペイウォール ---- */
  .premium-status-row{ margin-bottom:10px; }
  .premium-badge{
    display:block;
    background:rgba(216,178,106,.15);
    border:1px solid var(--gold);
    color:var(--gold-strong);
    border-radius:10px;
    padding:8px 10px;
    font-size:.76rem;
    font-weight:700;
    text-align:center;
  }
  .paywall-copy{
    font-size:.82rem;
    color:var(--ivory-dim);
    line-height:1.6;
    margin:0 0 10px;
  }
  .paywall-benefits{
    margin:0 0 14px;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .paywall-benefits li{
    font-size:.8rem;
    color:var(--ivory);
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 10px;
  }
  .paywall-note{
    margin-top:10px;
    font-size:.68rem;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.5;
  }
  .paywall-legal-links{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:10px;
  }
  .paywall-legal-links a{
    font-size:.7rem;
    color:var(--ink-soft);
    text-decoration:underline;
  }

  /* ---- 対局履歴リスト上部のアクションボタン群(課金・使い方・お問い合わせ・その他) ---- */

<script>
/* ---- グローバルなエラーハンドラ(スクリプトの一番最初に登録) ----
   renderApp()の外(イベントハンドラ内・async処理内)で発生した、
   どのtry-catchにも拾われていない例外・Promise拒否を、console.error
   だけでなく画面上(showDebugError)にも表示する。Xcode/Macが無く
   実機のコンソールログを直接見る手段が無いため、これが無いと
   「何かが起きて画面が固まった」という結果しか分からず、原因の
   特定ができない。showDebugError自体は下の方で定義される関数だが、
   ここではイベントリスナーを登録するだけ(実際に呼ばれるのはエラー
   発生時=スクリプト全体の評価が終わった後)なので問題ない。 ---- */
window.addEventListener('error', (event) => {
  console.error('[window.onerror]', event.error || event.message, event.filename, event.lineno, event.colno);
  try { showDebugError('未処理の例外 (window.onerror)', event.error || event.message); }
  catch (e) { /* showDebugError自体が使えない状況では諦める(consoleには既に出している) */ }
});
window.addEventListener('unhandledrejection', (event) => {
  console.error('[unhandledrejection]', event.reason);
  try { showDebugError('未処理のPromise拒否 (unhandledrejection)', event.reason); }
  catch (e) {}
});

/* =========================================================================
   MahjongScore module — pure calculation logic.
   (In a full project this would live in utils/mahjongScore.ts, independent
   of the UI below, so it can be unit tested on its own.)
   ========================================================================= */
// scheduleRenderApp()が使う状態。Native.initAds()/initBilling()等、スクリプト
// 実行のごく初期(起動直後)からshowDebugError()経由で呼ばれることがあるため、
// スクリプトの先頭で宣言しておく(TDZ回避。定義本体は下のscheduleRenderApp参照)。
let _renderAppQueued = false;
let _renderAppCallbacks = [];

const HAN_TIER_INFO = {
  mangan:     { minHan: 5,  name: '満貫',   sub: '5翻' },
  haneman:    { minHan: 6,  name: '跳満',   sub: '6〜7翻' },
  baiman:     { minHan: 8,  name: '倍満',   sub: '8〜10翻' },
  sanbaiman:  { minHan: 11, name: '三倍満', sub: '11〜12翻' },
  yakuman:    { minHan: 13, name: '役満',   sub: '13翻〜' },
};

function roundUpTo(n, unit){ return Math.ceil(n / unit) * unit; }

// Fu (符) calculation from the simplified UI state.
// Base fu is always built additively — 20(副底) + the situational bonus for
// how the hand was completed — and rounded up only once, at the very end.
const FU_BASE = 20;
const FU_MENZEN_RON_BONUS = 10; // only when the hand is closed AND won by ron
const FU_TSUMO_BONUS = 2;       // whenever won by tsumo, open or closed

// One 刻子(triplet) or 槓(kan) set's fu, from its three independent traits.
// 刻子・明・中張 = 2 is the unit value; 暗(concealed) doubles it, 幺九牌(1/9/字)
// doubles it again, and 槓(kan) multiplies the whole thing by 4.
// This single formula reproduces all 8 official values:
//   明刻2-8=2  明刻19字=4   暗刻2-8=4  暗刻19字=8
//   明槓2-8=8  明槓19字=16  暗槓2-8=16 暗槓19字=32
function mentsuFu(m){
  return 2 * (m.ankou ? 2 : 1) * (m.terminal ? 2 : 1) * (m.isKan ? 4 : 1);
}

// シャンポン待ち (shanpon wait) special case: the wait itself is worth 0 fu,
// but the pair that actually completes into a triplet is scored as a
// minko(明刻) if won by ron (the winning tile came from someone's discard,
// just like a call) and as an ankou(暗刻) if won by tsumo (self-drawn).
// So the same shanpon pair contributes a *different* fu depending on ron vs
// tsumo — this is the one case where a hand's ron-fu and tsumo-fu genuinely
// diverge beyond the usual +10/+2 base difference.
function shanponRonFu(terminal){ return terminal ? 4 : 2; }   // = minko value
function shanponTsumoFu(terminal){ return terminal ? 8 : 4; } // = ankou value

/* ---- 専門用語の「?」タップ解説(符計算の内訳・ウマ/オカ/チップ共通) ----
   用語の表記自体は変えず、横に小さな?ボタンを添えるだけにして見た目を
   崩さない。タップすると#termTipRootに吹き出し(位置は画面内に収まるよう
   JSでクランプ)を出し、もう一度タップ・別の場所をタップ・別の?を
   タップのいずれでも閉じる。 ---- */
const TERM_GLOSSARY = {
  chunchan: '中張牌: 2〜8の数牌のこと。',
  yaochu: '么九牌: 1・9・字牌のこと。',
  ankoMinko: '暗刻・明刻: 見せずに揃えた3枚組が暗刻、鳴いて揃えたものが明刻。',
  ankanMinkanKakan: '暗槓・明槓・加槓: 見せずに揃えた4枚組が暗槓、鳴いて揃えたものが明槓、途中で1枚足したものが加槓。',
  machi: 'カンチャン・ペンチャン・単騎・シャンポン: カンチャンは間に挟まる牌待ち、ペンチャンは端の牌待ち、単騎は雀頭1枚待ち、シャンポンは対子2組での待ち。',
  uma: 'ウマ: 対局の最終順位に応じてポイントを増減させるルール。1位・2位はプラス、3位・4位はマイナス。',
  oka: 'オカ: 1位(トップ)が受け取る追加のポイント。参加者全員の供託金を、1位がまとめて受け取るイメージ。',
  chip: 'チップ: ルールによって異なるが、一般的には一発・赤・裏で発生する追加の得点。点数計算とは別に、対局後にまとめて精算。',
  tiebreakDealer: 'ツモ番が親により近い方が上位になります。',
};
function termTipBtn(...keys){
  return keys.map(k => `<button type="button" class="term-tip-btn" onclick="showTermTip(event,'${k}')">?</button>`).join('');
}
function showTermTip(evt, key){
  evt.stopPropagation();
  const text = TERM_GLOSSARY[key];
  if (!text) return;
  const root = document.getElementById('termTipRoot');
  if (!root) return;
  const already = root.dataset.openFor === key;
  root.innerHTML = '';
  root.dataset.openFor = '';
  if (already) return; // 同じ?をもう一度タップしたら閉じるだけ
  const btn = evt.currentTarget;
  const rect = btn.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'term-tip-popover';
  pop.textContent = text;
  pop.onclick = e => e.stopPropagation();
  root.appendChild(pop);
  root.dataset.openFor = key;
  const margin = 10;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = rect.left + rect.width / 2 - pw / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
  let top = rect.bottom + 8;
  if (top + ph > window.innerHeight - margin) top = rect.top - ph - 8; // 下に収まらなければ上に出す
  pop.style.left = `${left}px`;
  pop.style.top = `${top}px`;
}
document.addEventListener('click', () => {
  const root = document.getElementById('termTipRoot');
  if (root && root.innerHTML) { root.innerHTML = ''; root.dataset.openFor = ''; }
});

// calcFuBreakdown(state) -> { fuRon, fuTsumo, ron, tsumo } — 符計算を、UIで
// そのまま表示できる内訳(積み上げ項目の配列)付きで返す。ron/tsumoはそれぞれ
// { items:[{label,value}], subtotal, rounded, final } の形。
// items を合計 → 10符単位に切り上げ → (鳴きのみ)30符の最低保証、という
// 3段階の値をそのまま subtotal/rounded/final として保持しているので、
// 内訳表示側は計算をやり直さずにこれらをつなげて表示するだけでよい
// (=表示用の値と実際にスコア計算へ渡す値が原理的にズレない)。
// fuRon/fuTsumoはron.final/tsumo.finalと同じ値で、既存のcalcFuPair()と
// 完全に同じ計算結果を返す(内訳を求める過程で同じ式を積み上げているだけ)。
function calcFuBreakdown(s){
  if (s.keitai === 'chiitoitsu') {
    const items = [{ label: '七対子(固定)', value: 25 }];
    const side = { items, subtotal: 25, rounded: 25, final: 25 };
    return { fuRon: 25, fuTsumo: 25, ron: side, tsumo: side };
  }
  if (s.keitai === 'pinfu') { // pinfu locks both fixed values
    const ron = { items: [{ label: '平和(ロン, 固定)', value: 30 }], subtotal: 30, rounded: 30, final: 30 };
    const tsumo = { items: [{ label: '平和(ツモ, 固定)', value: 20 }], subtotal: 20, rounded: 20, final: 20 };
    return { fuRon: 30, fuTsumo: 20, ron, tsumo };
  }

  const isClosed = s.keitai !== 'naki';
  const mentsuItems = s.mentsuList.map(m => ({
    label: `${m.ankou ? '暗' : '明'}${m.isKan ? '槓' : '刻'}(${m.terminal ? '么九牌' : '中張'})`,
    value: mentsuFu(m),
    terms: [m.isKan ? 'ankanMinkanKakan' : 'ankoMinko', m.terminal ? 'yaochu' : 'chunchan'],
  }));
  const waitItem = s.machi === 'bad' ? { label: '待ち(カンチャン・ペンチャン・単騎)', value: 2, terms: ['machi'] } : null; // ryanmen and shanpon both add 0 here
  const headItem = s.yakuhaiHead ? { label: '雀頭(役牌)', value: 2 } : null;

  // isRonごとに、副底→面子→待ち→雀頭→(門前ロン/ツモ)の順で内訳を積み上げる。
  function buildSide(isRon){
    const items = [{ label: '副底', value: FU_BASE }, ...mentsuItems];
    if (waitItem) items.push(waitItem);
    if (s.machi === 'shanpon') {
      // シャンポンの対子は、ロンなら明刻・ツモなら暗刻として扱われるため、
      // ron/tsumoで別の値になる(shanponRonFu/shanponTsumoFu参照)。
      items.push(isRon
        ? { label: `待ち(シャンポン→明刻扱い, ${s.shanponTerminal ? '么九牌' : '中張'})`, value: shanponRonFu(s.shanponTerminal), terms: ['machi', 'ankoMinko', s.shanponTerminal ? 'yaochu' : 'chunchan'] }
        : { label: `待ち(シャンポン→暗刻扱い, ${s.shanponTerminal ? '么九牌' : '中張'})`, value: shanponTsumoFu(s.shanponTerminal), terms: ['machi', 'ankoMinko', s.shanponTerminal ? 'yaochu' : 'chunchan'] });
    }
    if (headItem) items.push(headItem);
    if (isRon) {
      if (isClosed) items.push({ label: '門前ロン', value: FU_MENZEN_RON_BONUS });
    } else {
      items.push({ label: 'ツモ', value: FU_TSUMO_BONUS });
    }
    const subtotal = items.reduce((sum, it) => sum + it.value, 0);
    const rounded = roundUpTo(subtotal, 10);
    // 鳴きで加符が何も無い形（いわゆる喰い平和形）は20符になってしまうが、
    // 実戦のルールでは30符が最低ラインとして扱われる。
    const final = isClosed ? rounded : Math.max(rounded, 30);
    return { items, subtotal, rounded, final };
  }

  const ron = buildSide(true);
  const tsumo = buildSide(false);
  return { fuRon: ron.final, fuTsumo: tsumo.final, ron, tsumo };
}

// calcFuPair(state) -> { fuRon, fuTsumo }。既存の呼び出し元との互換のため
// 残しているが、実体はcalcFuBreakdown()の値をそのまま使う薄いラッパー。
function calcFuPair(s){
  const b = calcFuBreakdown(s);
  return { fuRon: b.fuRon, fuTsumo: b.fuTsumo };
}

// calcBase(han, fu, isKiriageMangan) -> the 基本点(A) for one han/fu pair.
function calcBase(han, fu, isKiriageMangan){
  let base;
  let cappedToMangan = false;
  if (han >= 13)      base = 8000;
  else if (han >= 11) base = 6000;
  else if (han >= 8)  base = 4000;
  else if (han >= 6)  base = 3000;
  else if (han >= 5)  base = 2000;
  else {
    base = fu * Math.pow(2, han + 2);
    if (base > 2000) { base = 2000; cappedToMangan = true; }
    else if (isKiriageMangan && base >= 1920 && base < 2000) { base = 2000; cappedToMangan = true; }
  }
  return { base, cappedToMangan };
}

// calcScore(isDealer, han, fuRon, fuTsumo, isKiriageMangan) -> pure, no UI
// dependency. Ron and Tsumo each get their own 基本点 because fuRon and
// fuTsumo can differ (see calcFuPair).
function calcScore(isDealer, han, fuRon, fuTsumo, isKiriageMangan){
  const ronBase = calcBase(han, fuRon, isKiriageMangan);
  const tsumoBase = calcBase(han, fuTsumo, isKiriageMangan);
  const ron = isDealer ? roundUpTo(ronBase.base * 6, 100) : roundUpTo(ronBase.base * 4, 100);
  const tsumo = isDealer
    ? { all: roundUpTo(tsumoBase.base * 2, 100) }
    : { fromDealer: roundUpTo(tsumoBase.base * 2, 100), fromNonDealer: roundUpTo(tsumoBase.base * 1, 100) };
  return { ron, tsumo, ronCapped: ronBase.cappedToMangan, tsumoCapped: tsumoBase.cappedToMangan };
}

/* =========================================================================
   ScoreSheet module — pure settlement logic for the 得点記録票 tab.
   (Would live in utils/scoreSheet.ts alongside mahjongScore.ts.)
   ========================================================================= */

// Rounds |x| (x is in units of "hundreds of raw points") to the nearest 10,
// i.e. rounds the raw score to the nearest 1000 (=1pt), per the chosen
// convention, then restores the sign so negative diffs round symmetrically.
function roundTensDigit(x, mode) {
  const sign = x < 0 ? -1 : 1;
  const abs = Math.abs(x);
  const tens = Math.floor(abs / 10) * 10;
  const rem = abs - tens;
  let roundedAbs;
  if (mode === 'floor') roundedAbs = tens;                       // 切り捨て
  else if (mode === 'roundHalfUp') roundedAbs = rem >= 5 ? tens + 10 : tens; // 四捨五入
  else roundedAbs = rem >= 6 ? tens + 10 : tens;                  // 五捨六入(default)
  return sign * roundedAbs;
}

// diffRaw: (素点 - 返し点). Returns the result in pt (1pt = 1000点).
function applyRounding(diffRaw, mode) {
  const hundreds = Math.round(diffRaw / 100);
  return roundTensDigit(hundreds, mode) / 10;
}

// entries: [{name, score}] -> same array with loRank/hiRank/tieCount added.
// Ties share the same [loRank,hiRank] band so uma/oka can be split evenly.
function rankPlayers(entries) {
  const sorted = [...entries].sort((a, b) => b.score - a.score);
  const result = [];
  let i = 0;
  while (i < sorted.length) {
    let j = i;
    while (j + 1 < sorted.length && sorted[j + 1].score === sorted[i].score) j++;
    for (let k = i; k <= j; k++) {
      result.push({ ...sorted[k], loRank: i + 1, hiRank: j + 1, tieCount: j - i + 1 });
    }
    i = j + 1;
  }
  return result;
}

// 素点の同点を、指定された親からの巡目距離(時計回りの座順での近さ)で
// 厳密な順位に確定させる。ツモ番が親に近い方(=親自身、次に親の下家、…)が
// 上位。tiebreakDealerが無い場合(この機能の実装前に記録・インポートされた
// 半荘など)は、従来通り同着帯のまま返す(呼び出し側でウマ・オカを均等按分)。
function resolveTiesByDealer(ranked, players, tiebreakDealer) {
  if (!tiebreakDealer || !players.includes(tiebreakDealer)) return ranked;
  const dealerIdx = players.indexOf(tiebreakDealer);
  const distanceFromDealer = (name) => {
    const idx = players.indexOf(name);
    if (idx < 0) return Infinity;
    return (idx - dealerIdx + players.length) % players.length;
  };
  const byLoRank = new Map();
  ranked.forEach(r => {
    if (!byLoRank.has(r.loRank)) byLoRank.set(r.loRank, []);
    byLoRank.get(r.loRank).push(r);
  });
  const resolved = [];
  byLoRank.forEach((group, loRank) => {
    if (group.length === 1) { resolved.push(group[0]); return; }
    [...group]
      .sort((a, b) => distanceFromDealer(a.name) - distanceFromDealer(b.name))
      .forEach((r, i) => resolved.push({ ...r, loRank: loRank + i, hiRank: loRank + i, tieCount: 1 }));
  });
  resolved.sort((a, b) => a.loRank - b.loRank);
  return resolved;
}

function umaForExactRank(rank, uma, playerCount) {
  if (playerCount === 3) {
    const [C] = uma;
    if (rank === 1) return C;
    if (rank === 2) return 0;
    return -C;
  }
  const [A, B] = uma;
  if (rank === 1) return B;
  if (rank === 2) return A;
  if (rank === 3) return -A;
  return -B;
}
// Averages the uma of every integer rank spanned by a tie so a tied group
// splits it evenly (works for 2-way, 3-way, or all-4-tied groups alike).
function umaForTieGroup(loRank, hiRank, uma, playerCount) {
  let sum = 0, count = 0;
  for (let r = loRank; r <= hiRank; r++) { sum += umaForExactRank(r, uma, playerCount); count++; }
  return sum / count;
}

// 半荘ごとのルールスナップショット(①)に含めるフィールド。人数(playerCount)は
// 「対局ルール設定」パネルの外に移動した項目だが、ウマの段組み判定・オカの
// 頭数計算にルール計算そのものが必要とするため、集計の正確さのために
// スナップショットには含める(プリセット保存の対象からは②の仕様どおり除く)。
const RULE_SNAPSHOT_FIELDS = ['startPoints', 'returnPoints', 'playerCount', 'umaEnabled', 'uma',
  'tobiEnabled', 'tobiPoints', 'tobiRecipient', 'rate', 'roundingMode', 'chipUnitYen'];
function captureRulesSnapshot(settings){
  const snap = {};
  RULE_SNAPSHOT_FIELDS.forEach(k => { snap[k] = Array.isArray(settings[k]) ? [...settings[k]] : settings[k]; });
  return snap;
}
// ②: お気に入りルールプリセットの保存対象は「人数を除く」全項目。
const RULE_PRESET_FIELDS = RULE_SNAPSHOT_FIELDS.filter(k => k !== 'playerCount');
function captureRulePreset(settings){
  const snap = {};
  RULE_PRESET_FIELDS.forEach(k => { snap[k] = Array.isArray(settings[k]) ? [...settings[k]] : settings[k]; });
  return snap;
}

// calcHanchanResult(hanchan, settings) -> { pt: {name: ptDelta}, ranked, players }
// pt is this hanchan's own contribution only (not a running total)。
// ① 半荘ごとのルールスナップショット: hanchan.rulesSnapshotがあればそちらを
// 優先して使う(半荘記録後にルール設定パネルの値を変えても、既に記録済みの
// 半荘の計算結果は変わらない)。無ければ従来通り現在のsettingsを使う
// (スナップショット導入前に記録された古いデータとの後方互換)。
// ③ 控えメンバーとの交代により、半荘ごとに実際の参加者が異なりうるため、
// 参加者はsettings.players(現在のアクティブ一覧)ではなく、この半荘が実際に
// 記録した hanchan.scores のキーから決める(scoresが空の場合だけ、これから
// 記録する半荘のプレビュー用にsettings.playersへフォールバックする)。
function calcHanchanResult(hanchan, settings) {
  const rules = hanchan.rulesSnapshot || settings;
  const { startPoints, returnPoints, playerCount, umaEnabled, uma,
          tobiEnabled, tobiPoints, tobiRecipient } = rules;
  const players = Object.keys(hanchan.scores).length ? Object.keys(hanchan.scores) : settings.players;
  // hanchan.scores[p]がundefined/nullになり得るケース(プレイヤー名の変更・
  // 人数変更後に古い半荘記録を読む等でキーが一致しない場合)への防御。
  // 実際にこれが原因でrenderLog()が`undefined.toLocaleString()`で例外を
  // 投げ、得点記録タブが完全に空白のまま固まる不具合を確認したため、
  // 0点として扱うことでクラッシュせず表示だけは継続できるようにする。
  const entries = players.map(p => ({ name: p, score: hanchan.scores[p] ?? 0 }));
  const ranked = resolveTiesByDealer(rankPlayers(entries), players, hanchan.tiebreakDealer);
  const oka = (returnPoints - startPoints) * playerCount / 1000;
  const topGroup = ranked.filter(r => r.loRank === 1);

  const pt = {};
  players.forEach(p => { pt[p] = 0; });

  ranked.forEach(r => {
    pt[r.name] += applyRounding(r.score - returnPoints, rules.roundingMode);
    if (umaEnabled) pt[r.name] += umaForTieGroup(r.loRank, r.hiRank, uma, playerCount);
    if (r.loRank === 1) pt[r.name] += oka / topGroup.length;
  });

  if (tobiEnabled) {
    players.forEach(p => {
      if (hanchan.scores[p] < 0) {
        pt[p] -= tobiPoints;
        if (tobiRecipient === 'buster' && hanchan.busterOf && hanchan.busterOf[p]) {
          pt[hanchan.busterOf[p]] += tobiPoints;
        } else {
          topGroup.forEach(r => { pt[r.name] += tobiPoints / topGroup.length; });
        }
      }
    });
  }

  return { pt, ranked, players };
}

// calcTotals(hanchans, chips, settings) -> per-player running pt/yen totals.
// ③: 各半荘の実際の参加者(calcHanchanResultが返すplayers、控え交代で現在の
// settings.playersと食い違うことがある)ごとにptを積み上げる。控えに回って
// 不在だった半荘は、その人のptに一切加算しない(0点として数えることもしない)。
function calcTotals(hanchans, chips, settings) {
  const totals = {};
  settings.players.forEach(p => { totals[p] = 0; });
  hanchans.forEach(h => {
    const { pt, players } = calcHanchanResult(h, settings);
    players.forEach(p => {
      if (!(p in totals)) totals[p] = 0;
      totals[p] += pt[p];
    });
  });
  const chipSum = settings.players.reduce((s, p) => s + (chips[p] || 0), 0);
  const money = {};
  const chipMoney = {}; // 合計金額(money)のうち、チップ分だけの内訳(円)。表示の2段組みで使う。
  settings.players.forEach(p => {
    chipMoney[p] = (chips[p] || 0) * settings.chipUnitYen;
    money[p] = totals[p] * settings.rate + chipMoney[p];
  });
  return { pt: totals, money, chipMoney, chipImbalance: chipSum !== 0, chipSum };
}

const state = {
  isDealer: false,
  kiriageMangan: true,
  hanTier: 3,      // 1 | 2 | 3 | 4 | 'mangan' | 'haneman' | 'baiman' | 'sanbaiman' | 'yakuman'
  keitai: 'menzen', // 'menzen' | 'naki' | 'pinfu' | 'chiitoitsu'
  machi: 'ryanmen', // 'ryanmen' | 'bad' | 'shanpon'
  shanponTerminal: false, // only used when machi==='shanpon'
  yakuhaiHead: false,
  mentsuList: [], // { id, ankou:bool(暗/明), terminal:bool(1・9・字/中張), isKan:bool(槓/刻子) } — excludes the shanpon set
  fuDirectMode: false, // 中級者・上級者向け: 符数を直接入力するモード
  manualFu: 30,
};
let mentsuSeq = 1;

// 別のボタンへのタップが、テキスト入力のonchange(blur)によるDOM作り直しと
// 同じ一連の操作の中で競合して消えてしまうのを防ぐため、render()も
// （得点記録タブのrenderAppと同様に）1フレームだけ遅らせて呼び出す。
let _renderQueued = false;
function scheduleRender(){
  if (_renderQueued) return;
  _renderQueued = true;
  requestAnimationFrame(() => { _renderQueued = false; render(); });
}

function setDealer(v){ state.isDealer = v; scheduleRender(); }
function toggleKiriage(){ state.kiriageMangan = !state.kiriageMangan; scheduleRender(); }
function toggleFuDirectMode(){ state.fuDirectMode = !state.fuDirectMode; scheduleRender(); }
function setManualFu(v){ state.manualFu = Math.max(0, v); scheduleRender(); }
// 符は常に10の位に切り上げ（七対子の25符だけ例外）というルールを、
// 直接入力された値にも適用する。
function normalizeManualFu(v){ return v === 25 ? 25 : roundUpTo(v, 10); }

function selectHanTier(tier){
  state.hanTier = tier;
  scheduleRender();
}

function selectKeitai(k){
  if (state.hanTier !== 1 && state.hanTier !== 2 && state.hanTier !== 3 && state.hanTier !== 4) return;
  state.keitai = k;
  // 七対子は役だけで2翻あるため1翻はあり得ない（ピンフはロンなら1翻もあり得るので制限しない）
  if (k === 'chiitoitsu' && state.hanTier === 1) state.hanTier = 2;
  scheduleRender();
}

function toggleChip(name){
  state[name] = !state[name];
  scheduleRender();
}
function setMachi(key){ state.machi = key; scheduleRender(); }
function setShanponTerminal(v){ state.shanponTerminal = v; scheduleRender(); }

const MAX_MENTSU = 4; // a hand has at most 4 sets besides the pair
function addMentsu(){
  if (state.mentsuList.length >= MAX_MENTSU) return;
  state.mentsuList.push({ id: mentsuSeq++, ankou: true, terminal: false, isKan: false });
  scheduleRender();
}
function setMentsuField(id, field, value){
  const m = state.mentsuList.find(x => x.id === id);
  if (m) m[field] = value;
  scheduleRender();
}
function removeMentsu(id){
  state.mentsuList = state.mentsuList.filter(x => x.id !== id);
  scheduleRender();
}

function isTierHan(h){ return h === 1 || h === 2 || h === 3 || h === 4; }

function fmt(n){ return n.toLocaleString('ja-JP'); }

function render(){
  // dealer segment
  document.getElementById('dealerSeg').innerHTML = `
    <button class="${!state.isDealer?'':'active'}" onclick="setDealer(true)">親</button>
    <button class="${!state.isDealer?'active':''}" onclick="setDealer(false)">子</button>
  `;
  const sw = document.getElementById('kiriageSwitch');
  sw.className = 'switch' + (state.kiriageMangan ? ' on' : '');

  // han grids
  const hanRow1 = [1,2,3,4].map(h=>{
    const disabled = h===1 && state.keitai==='chiitoitsu';
    const selected = state.hanTier===h;

// 符計算の内訳1本分(ron側 or tsumo側)を「項目1a + 項目b = 小計符 → 切り上げ後符」
// の文字列に組み立てる。要素が1つしかない(七対子・平和の固定値)場合は
// 「〇〇(固定)25符」のように単独表示し、冗長な「= 25符」を付けない。
// 各項目のラベルの後ろに、該当する専門用語があれば小さな?ボタンを添える
// (用語表記そのものは変更しない)。戻り値はHTML文字列(ラベル部分は
// escapeHtml済み)。
function formatFuBreakdown(side){
  const parts = side.items.map(it => {
    const tips = it.terms ? termTipBtn(...it.terms) : '';
    return `${escapeHtml(it.label)}${tips}${it.value}符`;
  }).join(' + ');
  // 項目が1つだけ(七対子・平和の固定値、または鳴きで加符が無いだけの手)の
  // 場合は、冗長な「= 〇〇符」を付けずラベル+値だけを表示する。
  let html = side.items.length > 1 ? `${parts} = ${side.subtotal}符` : parts;
  if (side.rounded !== side.subtotal) html += ` → ${side.rounded}符(切り上げ)`;
  if (side.final !== side.rounded) html += ` → ${side.final}符(鳴きは30符が最低)`;
  return html;
}

// ロン/ツモで内訳(項目の並び・値)が完全に一致する場合(七対子など)は1行に
// まとめ、そうでなければ「ロン:」「ツモ:」を頭に付けて2行に分けて表示する。
function fuBreakdownHtml(breakdown){
  if (!breakdown) return '';
  const sameBothSides = breakdown.ron.items.length === breakdown.tsumo.items.length
    && breakdown.ron.items.every((it, i) =>
      it.label === breakdown.tsumo.items[i].label && it.value === breakdown.tsumo.items[i].value);
  const lines = sameBothSides
    ? [formatFuBreakdown(breakdown.ron)]
    : [`ロン: ${formatFuBreakdown(breakdown.ron)}`, `ツモ: ${formatFuBreakdown(breakdown.tsumo)}`];
  return `<div class="fu-breakdown">${lines.map(l => `<div class="fu-breakdown-line">${l}</div>`).join('')}</div>`;
}

function resultHtml(stateLabel, ronFuLabel, tsumoFuLabel, r, breakdown){
  const tsumoHtml = r.tsumo.all !== undefined
    ? `<span class="pt">${fmt(r.tsumo.all)}</span><span class="all">ALL</span>`
    : `<span class="split">
         <span class="item"><span class="who">子から</span><span class="num">${fmt(r.tsumo.fromNonDealer)}</span></span>
         <span class="item"><span class="who">親から</span><span class="num">${fmt(r.tsumo.fromDealer)}</span></span>
       </span>`;
  return `
    <div class="summary-line">
      <span class="state">現在: <b>${stateLabel}</b></span>
    </div>
    <div class="score-rows">
      <div class="score-row row-ron">
        <span class="tag">ロン${ronFuLabel ? `<span class="fusub">${ronFuLabel}</span>` : ''}</span>
        <span class="amt">${fmt(r.ron)}<span class="pt">点</span></span>
      </div>
      <div class="score-row row-tsumo">
        <span class="tag">ツモ${tsumoFuLabel ? `<span class="fusub">${tsumoFuLabel}</span>` : ''}</span>
        <span class="amt">${tsumoHtml}</span>
      </div>
    </div>
    ${fuBreakdownHtml(breakdown)}
  `;
}

  const elapsed = _billingTraceStart != null ? Date.now() - _billingTraceStart : null;
  _billingTraceLog.push({ elapsed, event });

function _formatBillingTrace(){
  if (!_billingTraceLog.length) return '(イベント受信ログなし)';
  return _billingTraceLog.map(e => `  ${e.elapsed != null ? `+${e.elapsed}ms` : '?'}: ${e.event}`).join('\n');

const Native = {
  isNativeApp(){
    try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
    catch (e) { return false; }
  },
  /* ---- 広告(AdMob, @capacitor-community/admob想定) ---- */
  async initAds(){
    if (!this.isNativeApp()) return;
    try {
      const AdMob = window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob;
      if (!AdMob) return;
      // ⚠️ capacitor.config.jsonのAdMobブロックにある `requestTrackingAuthorization`
      // というキーは、このプラグイン(@capacitor-community/admob)のiOS実装
      // (AdMobPlugin.swift)からもWeb実装からも一切参照されていない
      // (native側は`requestTrackingAuthorization`という"メソッド"をJSから
      // 明示的に呼んだ時だけATTrackingManagerのダイアログを出す設計で、
      // capacitor.config.jsonの同名の設定キーとは無関係の別物)。そのため
      // NSUserTrackingUsageDescriptionをInfo.plistに用意していても、
      // ここで明示的に呼び出さない限りトラッキング許可ダイアログは一切
      // 表示されない。iOS 14+でまだ未確認(notDetermined)の場合のみ要求する。
      if (AdMob.trackingAuthorizationStatus && AdMob.requestTrackingAuthorization) {
        try {
          const status = await AdMob.trackingAuthorizationStatus();
          if (status && status.status === 'notDetermined') {
            await AdMob.requestTrackingAuthorization();
          }
        } catch (e) { /* iOS 14未満・Android等では未対応のため無視 */ }
      }
      if (AdMob.initialize) await AdMob.initialize({});
      // バナー広告の実際のロード成否をリッスンする。updateBannerState()は
      // 「表示を試みたかどうか」ではなくこのイベントで分かる「実際に
      // ロードされ表示されているかどうか」でレイアウトの余白(CSSクラス
      // ad-banner-active/with-ad-banner)を確保するかどうかを判断する
      // (オフライン・広告在庫切れ等でロードに失敗した場合、CSS側だけが
      // 余白を確保してしまうと、その余白に何も表示されない「隙間」に
      // なってしまうため)。
      if (AdMob.addListener) {
        AdMob.addListener('bannerAdLoaded', () => {
          _bannerAdLoaded = true;
          scheduleRenderApp();
        });
        AdMob.addListener('bannerAdFailedToLoad', () => {
          _bannerAdLoaded = false;
          scheduleRenderApp();
        });
        // 実際のバナー高さ(ネイティブ側でロード/削除されるたびに発火)を
        // CSSカスタムプロパティへ反映する。@capacitor-community/admobの
        // iOS実装はバナーViewをWKWebViewとは別の、rootViewControllerの
        // 「safeAreaLayoutGuideのbottom」を基準にした独立したネイティブ
        // オーバーレイとして追加している(DOM外)。そのため画面下端からの
        // オフセットは「セーフエリア + バナー高さ」の合計になり、
        // env(safe-area-inset-bottom)を含めずバナー高さだけをbottomに
        // 足すと、セーフエリア分だけトグルバーとバナーが重なってしまう
        // (ホームインジケーターが無い旧機種では気づきにくいが、ある機種
        // では必ず重なる)。adSize:'BANNER'固定(320x50)なので通常は
        // 高さ50で決め打ちでも大きくは外れないが、実測値が取れる時は
        // 実測値を優先して使う。
        AdMob.addListener('bannerAdSizeChanged', (info) => {
          const h = info && info.height;
          if (h > 0) document.documentElement.style.setProperty('--ad-banner-height', `${h}px`);
        });
      }
    } catch (e) { /* 広告SDKの初期化に失敗しても本体機能は止めない */ }
  },
  async showBanner(){
    if (!this.isNativeApp() || isPremiumUnlocked()) return;

  /* ---- 課金(cordova-plugin-purchase, iOS: App Store / Android: Google Play Billing) ----
     https://purchase.cordova.fovea.cc/ のイベント駆動API(v13系)を前提にした実装例。

     ―両方いっぺんに登録すると、実機には存在しない方のストアにも問い合わせが
     走ってしまうため。プロダクトID(billingProductId)はiOS/Android共通の

     商品を作成しておくこと)。以降のapproved/verified/productUpdatedの

     のTransaction/Receipt/Productがプラットフォームを問わず共通のAPIで
