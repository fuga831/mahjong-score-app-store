function renderHanchanForm(){
  if (isRoomViewerOnly()) {
    const hostName = (logState.room.participants.find(p => p.uid === logState.room.hostUid) || {}).name;
    return `<section><div class="sec-title">半荘の結果を入力<span class="hint">閲覧のみ</span></div>
      <div class="log-empty">${hostName ? escapeHtml(hostName) + 'さん' : '代表入力者'}が記録中です。この端末では入力できません。</div>
    </section>`;
  }
  const s = logState.settings;
  const players = activePlayers();
  const total = formTotal();
  const expected = s.startPoints * s.playerCount;
  const allFilled = players.every(p => logState.ui.formScores[p] !== '' && !isNaN(formScoreActual(p)));
  const bustedPlayers = players.filter(p => (formScoreActual(p)||0) < 0);
  const needsBuster = s.tobiEnabled && s.tobiRecipient === 'buster';
  const busterOk = !needsBuster || bustedPlayers.every(p => logState.ui.formBuster[p]);
  const valid = allFilled && total === expected && busterOk;
  const editing = logState.ui.editingHanchanId !== null;
  // 「第◯半荘」は作成時の連番(id)ではなく、削除後も欠番が出ないよう
  // 現在残っている対局ログの中での順番（古い方から1,2,3...）で数え直す。
  const editingIdx = editing ? logState.hanchans.findIndex(x => x.id === logState.ui.editingHanchanId) : -1;
  const editingDispNum = editingIdx >= 0 ? logState.hanchans.length - editingIdx : '';

  return `
    <section id="hanchanFormAnchor">
      <div class="sec-title">${editing?`第${editingDispNum}半荘を編集中`:'半荘の結果を入力'}<span class="hint">${editing?'':`第${logState.hanchans.length+1}半荘`}</span></div>
      <div class="score-scale-hint">下2桁(00)は省略できます　例: 25,000点 → <b>250</b></div>
      <div class="score-input-grid">
        ${players.map(p=>{
          const val = formScoreActual(p);
          const busted = !isNaN(val) && val < 0;
          return `
          <div class="score-input-row">
            <span class="pname">${escapeHtml(p)}</span>
            <input class="num-input" type="number" step="1" inputmode="numeric" placeholder="例:250"
              value="${logState.ui.formScores[p]}" onchange="setFormScore('${escKey(p)}', this.value)">
            ${busted && needsBuster ? `
              <select class="text-input buster-select" onchange="setFormBuster('${escKey(p)}', this.value)">
                <option value="">誰が飛ばした？</option>
                ${players.filter(x=>x!==p).map(x=>`<option value="${escapeHtml(x)}" ${logState.ui.formBuster[p]===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}
              </select>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="check-banner ${(allFilled && total===expected)?'ok':'bad'}" style="margin-top:9px;">
        ${!allFilled ? '素点を入力してください' : total===expected ? `✓ 合計 ${total.toLocaleString()}点` : `⚠ 合計 ${total.toLocaleString()}点（${total-expected>0?'+':''}${(total-expected).toLocaleString()}点のズレ）`}
      </div>
      <button class="record-btn" style="margin-top:9px;width:100%;" ${valid?'':'disabled'} onclick="recordHanchan()">${editing?'この内容で更新する':'この半荘を記録'}</button>
      ${editing ? `<button class="mentsu-add" style="margin-top:7px;" onclick="cancelEditHanchan()">編集をキャンセル</button>` : ''}
    </section>`;
}

// hanchansList/sは対局履歴の詳細画面からも(settingsSnapshotを渡して)再利用できるよう
// パラメータ化してある。opts.readOnly=trueで編集・削除ボタンを非表示にする
// (過去の確定済み対局は書き換えさせない)。
function renderHanchanLog(hanchansList, s, opts){
  opts = opts || {};
  const readOnly = !!opts.readOnly;
  if (hanchansList.length === 0) {
    return `<section><div class="sec-title">対局ログ</div><div class="log-empty">まだ記録がありません</div></section>`;
  }
  // 「第◯半荘」は作成時の連番(id)ではなく、削除しても欠番が出ないよう
  // 現在残っている対局ログの中での順番（一番古いものを1として数え直す）で表示する。
  const cards = hanchansList.map((h, idx)=>{
    const dispNum = hanchansList.length - idx;
    const { pt, ranked } = calcHanchanResult(h, s);
    const rows = [...ranked].sort((a,b)=>a.loRank-b.loRank).map(r=>`
      <div class="hc-row ${r.loRank===1?'rank1':''}">
        <span class="hc-rank">${r.loRank===r.hiRank ? r.loRank : `${r.loRank}-${r.hiRank}`}</span>
        <span class="hc-name">${escapeHtml(r.name)}</span>
        <span class="hc-score">${r.score.toLocaleString()}</span>
        <span class="hc-pt ${pt[r.name]>=0?'plus':'minus'}">${formatPt(pt[r.name])}</span>
      </div>`).join('');
    return `
      <div class="hanchan-card">
        <div class="hc-head">
          <span class="hc-title">第${dispNum}半荘</span>
          ${readOnly ? '' : `<span class="hc-actions">
            <button onclick="editHanchan(${h.id})">✎</button>
            <button onclick="deleteHanchan(${h.id})">×</button>
          </span>`}
        </div>
        <div class="hc-rows">${rows}</div>
      </div>`;
  }).join('');
  return `<section><div class="sec-title">対局ログ<span class="hint">${hanchansList.length}半荘</span></div><div style="display:flex;flex-direction:column;gap:8px;">${cards}</div></section>`;
}

function totalCardsHtml(order, totals, topMoney){
  return `
    <div class="total-cards">
      ${order.map(p=>{
        const isTop = totals.money[p]===topMoney && topMoney > 0;
        return `
        <div class="total-card ${isTop?'top':''}">
          <div class="pname">${isTop?'<span class="crown">👑</span>':''}${escapeHtml(p)}</div>
          <div class="pmoney">${formatMoney(totals.money[p])}</div>
          <div class="ppt">${formatPt(totals.pt[p])}pt</div>
        </div>`;
      }).join('')}
    </div>`;
}

// 演出モード用: 現在の合計収支(円)で順位グループ(同着はまとめる)を作り、
// 「2位→3位→…→1位」の順に並べ替える。同着で複数の順位にまたがる場合は
// そのグループのいちばん良い方の順位（loRank）を発表順の基準にする。
function revealGroupsFor(players, totals, playerCount){
  const entries = players.map(p => ({ name: p, score: Math.round((totals.money[p]||0) * 100) / 100 }));
  const ranked = rankPlayers(entries);
  const order = revealOrderFor(playerCount);
  const seen = new Set();
  const groups = [];
  ranked.forEach(r => {
    const key = `${r.loRank}-${r.hiRank}`;
    if (seen.has(key)) return;
    seen.add(key);
    groups.push({ loRank: r.loRank, hiRank: r.hiRank, members: ranked.filter(x => x.loRank===r.loRank && x.hiRank===r.hiRank) });
  });
  groups.sort((a,b) => order.indexOf(a.loRank) - order.indexOf(b.loRank));
  return groups;
}
function revealGroupCardHtml(group, totals){
  const rankLabel = group.loRank===group.hiRank ? `${group.loRank}位` : `${group.loRank}〜${group.hiRank}位`;
  const isTop = group.loRank === 1;
  return `
    <div class="reveal-card ${isTop?'top':''}">
      <div class="reveal-rank">${isTop?'👑 ':''}${rankLabel}</div>
      ${group.members.map(m => `
        <div class="reveal-member">
          <span class="reveal-name">${escapeHtml(m.name)}</span>
          <span class="reveal-money">${formatMoney(totals.money[m.name])}</span>
          <span class="reveal-pt">${formatPt(totals.pt[m.name])}pt</span>
        </div>`).join('')}
    </div>`;
}

// 「対局を終了する」系のボタン・確認UI。isPresentationDone=trueの時だけ
// 「対局を終了して履歴に保存」の文言・演出後の見た目にする(演出モードでは
// 発表が終わるまでこのボタン自体を出さない＝呼び出し側で制御)。
function renderEndMatchControls(isPresentationDone){
  if (isRoomViewerOnly()) return ''; // 対局の終了(確定保存)は代表入力者だけの操作
  if (logState.hanchans.length === 0) return '';
  if (logState.ui.confirmEndMatch) {
    return `
      <div class="end-match-confirm">
        <span>この対局を終了して履歴に保存しますか？</span>
        <div class="end-match-confirm-btns">
          <button class="preset-btn" onclick="cancelEndMatch()">キャンセル</button>
          <button class="preset-btn danger" onclick="confirmEndMatch()">終了して保存</button>
        </div>
      </div>`;
  }
  const label = isPresentationDone ? '🏁 対局を終了して履歴に保存' : '対局を終了する';
  return `<button class="end-match-btn" onclick="requestEndMatch()">${label}</button>`;
}

function renderRoomStatusHtml(){
  if (!logState.room) return '';
  if (isRoomViewerOnly()) {
    const hostP = logState.room.participants.find(p => p.uid === logState.room.hostUid);
    return `<div class="room-status-row">👀 ${hostP ? escapeHtml(hostP.name) + 'さん' : '代表入力者'}の卓に参加中(閲覧のみ・リアルタイム更新)</div>`;
  }
  const linkedCount = (logState.room.participants || []).filter(p => p.uid).length;
  return `<div class="room-status-row">🔴 卓を公開中・同卓${linkedCount}人にリアルタイム配信中</div>`;
}

function renderStickyHeader(s, totals){
  const players = activePlayers();
  const presentation = logState.settings.presentationMode;
  const viewerOnly = isRoomViewerOnly();
  const modeSwitchHtml = `
    <div class="mode-switch-row">
      <button class="share-icon-btn" onclick="shareCurrentResult()" title="現在の収支をシェア">📤</button>
      <span class="mode-label">演出モード</span>
      <span class="switch ${presentation?'on':''} ${viewerOnly?'disabled':''}" onclick="${viewerOnly?'':'togglePresentationMode()'}"></span>
    </div>`;
  const roomStatusHtml = renderRoomStatusHtml();

  if (!presentation) {
    const order = [...players].sort((a,b)=> totals.money[b]-totals.money[a]);
    const topMoney = order.length ? totals.money[order[0]] : 0;
    return `<div class="sticky-header">${roomStatusHtml}${modeSwitchHtml}${totalCardsHtml(order, totals, topMoney)}${renderEndMatchControls(false)}</div>`;
  }

  if (!logState.ui.revealActive) {
    const noLog = logState.hanchans.length === 0;
    return `<div class="sticky-header">${roomStatusHtml}${modeSwitchHtml}
      <button class="reveal-btn" ${(noLog||viewerOnly) ? 'disabled' : ''} onclick="startReveal()">🎤 終局！結果を発表する</button>
    </div>`;
  }

  const groups = revealGroupsFor(players, totals, logState.settings.playerCount);
  const done = logState.ui.revealStep >= groups.length;
  const shownGroups = done ? [...groups].sort((a,b)=>a.loRank-b.loRank) : groups.slice(0, logState.ui.revealStep);

  // 発表中〜発表後は順位カードが積み重なって縦に長くなり得るため、sticky解除
  // (header-block)にして、スクロール時に下のフォームなどを覆い隠さないようにする。
  return `<div class="header-block">${roomStatusHtml}${modeSwitchHtml}
    <div class="reveal-area">
      ${shownGroups.map(g => revealGroupCardHtml(g, totals)).join('')}
    </div>
    ${done
      ? `<div class="reveal-done">🎉 発表終了！次の半荘を記録するとまた隠れます</div>${renderEndMatchControls(true)}`
      : `<button class="reveal-btn" onclick="revealNext(${groups.length})">次の順位を発表 →</button>`}
  </div>`;
}

function renderLog(){
  const s = settingsWithPlayers();
  const totals = calcTotals(logState.hanchans, logState.chips, s);
  const headerHtml = renderStickyHeader(s, totals);

  document.getElementById('logTab').innerHTML =
    headerHtml + renderSettingsAccordion() + renderChipsAccordion() + renderHanchanForm()
    + renderHanchanLog(logState.hanchans, s, { readOnly: isRoomViewerOnly() });
}

function memberKey(names){ return [...names].slice().sort().join('・'); }

function formatMatchDate(startedAt, endedAt){
  const d = new Date(endedAt || startedAt || Date.now());
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---- 通算成績 ---- */
// matchHistory中、playerNameが参加していた全対局の全半荘を対象に集計する。
// 「試合数」は半荘数（1半荘あたりの平均収支などと単位を揃えるため）。
function calcCareerStats(matchHistory, playerName){
  const relevant = matchHistory.filter(m => {
    const s = m.settingsSnapshot;
    return s && s.playerNames.slice(0, s.playerCount).includes(playerName);
  });
  if (relevant.length === 0) return null;

  let games = 0, rankSum = 0, top1 = 0, top2 = 0, last = 0, tobiCount = 0, moneySum = 0, maxScore = -Infinity;
  relevant.forEach(m => {
    const s = m.settingsSnapshot;
    const players = s.playerNames.slice(0, s.playerCount);
    const settingsForCalc = { ...s, players };
    m.hanchans.forEach(h => {
      if (!(playerName in h.scores)) return;
      games++;
      const entries = players.map(p => ({ name: p, score: h.scores[p] }));
      const ranked = rankPlayers(entries);
      const me = ranked.find(r => r.name === playerName);
      rankSum += (me.loRank + me.hiRank) / 2; // 同着は帯の平均順位として数える
      if (me.loRank === 1) top1++;
      if (me.hiRank <= 2) top2++;
      if (me.hiRank === s.playerCount) last++;
      if (h.scores[playerName] < 0) tobiCount++;
      if (h.scores[playerName] > maxScore) maxScore = h.scores[playerName];
      const { pt } = calcHanchanResult(h, settingsForCalc);
      moneySum += pt[playerName] * s.rate;
    });
    moneySum += ((m.chips && m.chips[playerName]) || 0) * s.chipUnitYen;
  });
  if (games === 0) return null;

  return {
    games,
    avgRank: rankSum / games,
    topRate: top1 / games,
    top2Rate: top2 / games,     // 連対率（4人打ち用）
    lastRate: last / games,
    lastAvoidRate: 1 - (last / games), // ラス回避率（3人打ち用）
    maxScore: maxScore === -Infinity ? 0 : maxScore,
    avgMoneyPerHanchan: moneySum / games,
    totalMoney: moneySum,
    tobiCount,
  };
}

function renderHistoryStats(){
  const filter = logState.ui.historyFriendFilter;
  const source = filterMatchHistoryByFriend(logState.matchHistory, filter);
  if (source.length === 0) {
    return filter
      ? `<div class="history-empty">${escapeHtml(filter.username)}さんと同卓した対局はまだありません</div>`
      : `<div class="history-empty">まだ成績データがありません<br>対局を終了すると、ここに通算成績が表示されます</div>`;
  }
  // メンバー構成（参加者の名前の組み合わせ）ごとにグループ分けする。
  const groups = {};
  source.forEach(m => {
    const s = m.settingsSnapshot;
    const players = s.playerNames.slice(0, s.playerCount);
    const key = memberKey(players);
    if (!groups[key]) groups[key] = { players, playerCount: s.playerCount, matches: [] };
    groups[key].matches.push(m);
  });
  const groupList = Object.values(groups).sort((a,b) => b.matches.length - a.matches.length);

  return groupList.map(g => {
    const totalHanchans = g.matches.reduce((sum,m)=>sum+m.hanchans.length, 0);
    const cards = g.players.map(p => {
      const st = calcCareerStats(g.matches, p);
      if (!st) return '';
      const primaryLine = g.playerCount === 4
        ? `<div class="stat-row">連対率 <b>${(st.top2Rate*100).toFixed(0)}%</b></div>`
        : `<div class="stat-row">トップ率 <b>${(st.topRate*100).toFixed(0)}%</b> ／ ラス回避率 <b>${(st.lastAvoidRate*100).toFixed(0)}%</b></div>`;
      const secondaryLine = g.playerCount === 4
        ? `<div class="stat-row">トップ率 <b>${(st.topRate*100).toFixed(0)}%</b> ／ ラス率 <b>${(st.lastRate*100).toFixed(0)}%</b></div>`
        : `<div class="stat-row">ラス率 <b>${(st.lastRate*100).toFixed(0)}%</b></div>`;
      const moneyColor = v => v >= 0 ? '#9fe0bd' : 'var(--red-soft)';
      return `
        <div class="stat-card">
          <div class="stat-name">${escapeHtml(p)}</div>

/* ---- エクスポート / インポート / シェア ---- */
async function exportMatchHistory(includeInProgress){
  const payload = {
    exportedAt: new Date().toISOString(),
    appVersion: 'mahjong-score-log-v2',
    matchHistory: logState.matchHistory,
  };
  if (includeInProgress && logState.hanchans.length > 0) {
    payload.inProgress = {
      settings: logState.settings,
      hanchans: logState.hanchans,
      chips: logState.chips,
      startedAt: logState.currentMatchStartedAt,
    };
  }
  const json = JSON.stringify(payload, null, 2);
  const filename = `mahjong-log-${new Date().toISOString().slice(0,10)}.json`;
  const blob = new Blob([json], { type: 'application/json' });

  if (navigator.share && navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: '麻雀対局履歴' });
        return;
      }
    } catch (e) { /* キャンセル・失敗時は下のダウンロードにフォールバック */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function triggerImport(){
  const el = document.getElementById('importFileInput');
  if (el) el.click();
}
function handleImportFile(files){
  const file = files && files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data.matchHistory) ? data.matchHistory
        : Array.isArray(data) ? data : [];
      const existingIds = new Set(logState.matchHistory.map(m => m.id));
      let added = 0, skipped = 0;
      incoming.forEach(m => {
        if (!m || !m.id || !m.settingsSnapshot || !Array.isArray(m.hanchans)) { skipped++; return; }
        if (existingIds.has(m.id)) { skipped++; return; }
        existingIds.add(m.id);
        logState.matchHistory.push(m);
        added++;
      });
      logState.matchHistory.sort((a,b) => new Date(b.endedAt||b.startedAt||0) - new Date(a.endedAt||a.startedAt||0));
      saveLogState();
      logState.ui.importResultMsg = `${added}件を読み込みました${skipped>0?`（${skipped}件は重複・不正な形式のためスキップ）`:''}`;
    } catch (e) {
      logState.ui.importResultMsg = '読み込みに失敗しました。ファイル形式を確認してください。';
    }
    scheduleRenderApp();
  };
  reader.readAsText(file);
  const el = document.getElementById('importFileInput');
  if (el) el.value = '';
}

function buildShareText(players, totals, headerLine){
  const order = [...players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const lines = order.map((p,i) => `${i+1}位 ${p}　${formatMoney(totals.money[p])}`);
  return `${headerLine ? headerLine + '\n\n' : ''}${lines.join('\n')}`;
}
async function shareText(text, title){
  if (navigator.share) {
    try {
      await navigator.share({ text, title: title || '麻雀対局結果' });
      return;
    } catch (e) { /* キャンセル・未対応時は下のフォールバックへ */ }
  }
  try {
    await navigator.clipboard.writeText(text);
    logState.ui.shareFallbackMsg = 'クリップボードにコピーしました';
  } catch (e) {
    logState.ui.shareFallbackMsg = text; // コピーもできない環境ではテキストをそのまま表示する
  }
  scheduleRenderApp();
  setTimeout(() => { logState.ui.shareFallbackMsg = null; scheduleRenderApp(); }, 4000);
}
function shareCurrentResult(){
  const s = settingsWithPlayers();
  const totals = calcTotals(logState.hanchans, logState.chips, s);
  const order = [...s.players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const header = order.length ? `🀄 現在${order[0]}さんがトップ！収支${formatMoney(totals.money[order[0]])}` : '';
  shareText(buildShareText(s.players, totals, header));
}
function shareMatchResult(id){
  const m = logState.matchHistory.find(x => x.id === id);
  if (!m) return;
  const s = m.settingsSnapshot;
  const players = s.playerNames.slice(0, s.playerCount);
  const totals = calcTotals(m.hanchans, m.chips, { ...s, players });
  const order = [...players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const header = order.length ? `🀄 ${order[0]}さん第1位！収支${formatMoney(totals.money[order[0]])}` : '';
  shareText(buildShareText(players, totals, header));
}

/* ---- top-level bootstrap ---- */
// テキスト入力のonchange（blur）と、別のボタンへのタップは同じ一連の操作の中で
// 同期的に発火する。renderApp()をその場で同期実行すると、タップ先のボタンごと
// DOMを作り直してしまい、直後に来るはずのクリックイベントが宛先を失って
// 消えてしまう（＝名前変更などの直後だけ他の項目が反応しなくなる不具合の原因）。
// 1フレーム分だけ描画を遅らせることで、先に来ているクリックを本来のボタンで
// 処理させてから、最新のstateで安全に描画し直す。
let _renderAppQueued = false;
let _renderAppCallbacks = [];
function scheduleRenderApp(afterRender){
  if (afterRender) _renderAppCallbacks.push(afterRender);
  if (_renderAppQueued) return;
  _renderAppQueued = true;
  requestAnimationFrame(() => {
    _renderAppQueued = false;
    renderApp();
    const cbs = _renderAppCallbacks.splice(0);
    cbs.forEach(cb => cb());
  });
}
function renderApp(){
  const onLog = logState._activeTab === 'log';
  document.getElementById('appTitle').innerHTML = onLog
    ? '<span class="tile">📋</span>得点記録票'
    : '<span class="tile">🀄</span>麻雀点数電卓';
  document.getElementById('calcTab').style.display = onLog ? 'none' : '';
  document.getElementById('logTab').style.display = onLog ? '' : 'none';
  // 対局履歴(☰)・アカウント(👤)は得点記録票タブでのみ意味を持つので、それ以外では隠す。
  // アカウントボタンはマルチプレイヤー機能と同じく、ストアアプリの中でのみ表示する。
  document.getElementById('historyMenuBtn').style.display = onLog ? '' : 'none';
  document.getElementById('accountMenuBtn').style.display = (onLog && CloudSync.isAvailable()) ? '' : 'none';
  if (!onLog) {
    // 計算タブに切り替えたらモーダルも閉じる
    logState.ui.historyOpen = false; logState.ui.paywallOpen = false;
    logState.ui.accountModalOpen = false; logState.ui.friendPickerOpen = false;
    logState.ui.loginPromptOpen = false; logState.ui.friendsListOpen = false;
    logState.ui.addFriendOpen = false; logState.ui.historyFriendFilter = null;
  }
  document.getElementById('bottomNav').innerHTML = `
    <button class="${onLog?'':'active'}" onclick="setActiveTab('calc')"><span class="ic">🀄</span>点数計算</button>
    <button class="${onLog?'active':''}" onclick="setActiveTab('log')"><span class="ic">📋</span>得点記録</button>
  `;
  if (onLog) renderLog(); else render();
  renderHistoryModal();
  renderPaywallModal();
  renderAccountModal();
  renderFriendPickerModal();
  renderLoginPromptModal();
  renderFriendsListModal();
  renderAddFriendModal();
  renderNotifyBanner();
  updateBannerState(onLog);
}

// バナー広告(ネイティブのオーバーレイビュー)の表示/非表示を、得点記録票タブに
// いるか・モーダルが開いていないか・購入済みでないかに応じて切り替える。
// 状態が変わった時だけNative.showBanner/hideBannerを呼び、無駄な呼び出しを避ける。
let _bannerShown = false;
function updateBannerState(onLog){
  const modalOpen = logState.ui.historyOpen || logState.ui.paywallOpen
    || logState.ui.accountModalOpen || logState.ui.friendPickerOpen
    || logState.ui.loginPromptOpen || logState.ui.friendsListOpen
    || logState.ui.addFriendOpen;
  const shouldShow = Native.isNativeApp() && onLog && !modalOpen && !isPremiumUnlocked();
  document.body.classList.toggle('ad-banner-active', shouldShow);
  const nav = document.getElementById('bottomNav');
  if (nav) nav.classList.toggle('with-ad-banner', shouldShow);
  if (shouldShow && !_bannerShown) { _bannerShown = true; Native.showBanner(); }
  else if (!shouldShow && _bannerShown) { _bannerShown = false; Native.hideBanner(); }
}

// 自分以外の操作で対局記録が自動追加された時の簡易通知トースト。
// 金額・詳細成績は含めない(ロック画面等で収支が見えてしまうのを避けるため)。
function renderNotifyBanner(){
  const root = document.getElementById('notifyBannerRoot');
  if (!root) return;
  if (!logState.ui.notifyBanner) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="share-fallback-toast" onclick="dismissNotifyBanner()">🔔 ${escapeHtml(logState.ui.notifyBanner)}</div>`;
}

renderApp();
</script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
